# The local inner loop (T-4.1, #35).
#
# Postgres, Keycloak, MinIO and Valkey — everything the two services need in
# order to run with no Hetzner resources at all. The services themselves are NOT
# here: they run from Maven with spring-boot-devtools, because a code change has
# to be running in seconds and a container rebuild is not that.
#
# Ports are the ones the `dev` Spring profile already expects, so nothing has to
# be reconfigured to use this: Postgres 5432, MinIO 9000, Valkey 6379. Keycloak
# is on 9080 rather than 8080 because the gateway already owns 8080.
name: xenopsbase-dev

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: core
      # Trust auth, deliberately. This listens on localhost for one developer's
      # machine and holds nothing; a password here would be a password in git.
      # The deployed cluster gets its credentials from SOPS (ADR-0003).
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d core"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: ["start-dev", "--import-realm", "--http-port=9080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_HEALTH_ENABLED: "true"
    ports:
      - "9080:9080"
    volumes:
      # Generated by `make dev-realm` from the realm the CLUSTER uses, so local
      # identity cannot drift from deployed identity. See infra/scripts/dev-realm.sh.
      - ./.generated:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The discovery document, not the port. Keycloak accepts connections well
      # before the realm import finishes, and a port check would hand the
      # services a Keycloak that 404s on the realm they are configured for.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9080 && echo -e 'GET /realms/xenopsbase/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
      interval: 3s
      timeout: 5s
      retries: 60

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: localdevkey
      MINIO_ROOT_PASSWORD: localdevsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  # One-shot. Creates the bucket the services expect and exits; without it the
  # first upload fails with NoSuchBucket, which reads like a credentials problem.
  minio-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 localdevkey localdevsecret
        mc mb --ignore-existing local/xenopsbase-dev-documents
        mc version enable local/xenopsbase-dev-documents
    restart: "no"

  valkey:
    image: valkey/valkey:8.1.4-alpine
    # The gateway holds its OIDC session here (ADR-0009) and refuses to start if
    # it cannot connect (RedisEagerConnectionConfiguration), so this is not
    # optional for local development even though nothing local depends on the
    # session surviving.
    command: ["valkey-server", "--requirepass", "localdev"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "localdev", "--no-auth-warning", "PING"]
      interval: 2s
      timeout: 3s
      retries: 30
