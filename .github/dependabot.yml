# Scheduled dependency updates (T-6.5, #52).
#
# WHY DEPENDABOT AND NOT RENOVATE
#
# T-6.5 asked for Renovate. Dependabot is what this repository gets, and the
# reasoning is worth recording because the card named a tool rather than a
# behaviour.
#
#   1. Dependabot SECURITY updates are already enabled on this repository
#      (T-5.8) and cannot be turned off per-ecosystem without turning off the
#      alerts too. Adding Renovate for version updates would put two bots on
#      the same manifests, and the duplicate-PR problem that creates is worse
#      than either bot's shortcomings.
#
#   2. Renovate needs a GitHub App installed on the account. That is an
#      authorisation only the repository owner can grant, so shipping a
#      renovate.json would have produced a config file governing nothing --
#      the exact failure this project keeps finding, and one it would be
#      absurd to commit while fixing it elsewhere.
#
#   3. The reason Renovate was wanted was GROUPING: one PR for a Spring Boot
#      bump rather than forty. Dependabot has supported `groups` since 2023,
#      and the groups below are the ones that actually move together here.
#
# If Renovate is installed later, delete this file in the same change --
# not before, and not after.
#
# WHY WEEKLY AND NOT DAILY
#
# The cluster is torn down between working sessions, so a dependency PR that
# lands on a Tuesday is not deployed until somebody runs `make up`. Daily
# updates would produce a queue of PRs nobody looks at, and a queue nobody
# looks at is where a security update goes to die alongside a Jackson patch.
# Weekly, on Monday, is one review to do at the start of a week.
version: 2

updates:
  # ---------------------------------------------------------------------------
  # The services. Two independent Maven projects with no parent pom, so each
  # needs its own entry -- Dependabot does not discover sibling modules.
  - package-ecosystem: maven
    directory: /services/core
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    commit-message:
      # Matches the Conventional Commits gate on pull request titles. Without
      # this the bot's own PRs fail the check that every other PR must pass,
      # and a bot whose PRs cannot merge is a bot that gets ignored.
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Spring Boot moves as a unit. Forty separate PRs for one release is how
      # people learn to bulk-close dependency PRs without reading them.
      spring:
        patterns:
          - "org.springframework*"
          - "io.micrometer*"
      testing:
        patterns:
          - "org.junit*"
          - "org.assertj*"
          - "org.mockito*"
          - "org.testcontainers*"
          - "com.tngtech.archunit*"
      # Everything else, still grouped, because the alternative is one PR per
      # transitive bump on a project with this many dependencies.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /services/gateway
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "io.micrometer*"
      testing:
        patterns:
          - "org.junit*"
          - "org.assertj*"
          - "org.mockito*"
          - "org.testcontainers*"
          - "com.tngtech.archunit*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # The generated client. Small, and it is what an external consumer compiles
  # against, so it is worth keeping current independently of the services.
  - package-ecosystem: maven
    directory: /clients/java
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      client:
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # Actions are pinned to commit SHAs throughout this repository, which is what
  # makes them tamper-evident and what makes them invisible to a human reader:
  # nobody can tell 42947a3 is three releases behind. This is the only thing
  # that will ever notice.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # The prettier toolchain. Small, but it decides the formatting of every Java
  # file, and Spotless pins the same versions in both poms -- so an update here
  # that is not mirrored there means `make format` and CI disagree.
  - package-ecosystem: npm
    directory: /services/core
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    groups:
      prettier:
        patterns:
          - "prettier*"

  - package-ecosystem: npm
    directory: /services/gateway
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    groups:
      prettier:
        patterns:
          - "prettier*"

  # ---------------------------------------------------------------------------
  # Terraform providers. A provider bump can change what `destroy` does, so
  # these are deliberately NOT grouped with anything else and are reviewed on
  # their own.
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/storage
      - /infra/terraform/cluster
      - /infra/terraform/edge
      - /infra/terraform/mail-dns
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(infra)"
