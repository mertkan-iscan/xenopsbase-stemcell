name: Bug
description: Something does not work as intended
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Local development
        - CI
        - Deployed environment
        - During a cluster rebuild
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, traces or correlation ID
      description: A correlation ID is worth more than a screenshot.
