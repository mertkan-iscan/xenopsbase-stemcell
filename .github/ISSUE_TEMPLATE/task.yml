name: Task
description: A unit of work on the stemcell board
labels: []
body:
  - type: input
    id: task-id
    attributes:
      label: Task ID
      description: The board identifier, if this belongs to the planned sequence.
      placeholder: T-3.7
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this task covers, and explicitly what it does not.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkboxes. Each one must be objectively verifiable by someone else.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      placeholder: T-2.1, T-1.2
    validations:
      required: false
