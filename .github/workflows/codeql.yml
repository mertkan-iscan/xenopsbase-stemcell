name: CodeQL

# Static analysis of the application code (T-5.8).
#
# WHY MANUAL BUILD MODE
#
# CodeQL's `autobuild` guesses how to compile a project. This repository has two
# INDEPENDENT Maven projects under services/, no parent pom, and a hard Java 25
# requirement enforced by maven-enforcer. Autobuild finds one of them, builds it
# with whatever JDK is on the runner, and either fails on the enforcer or
# analyses half the code while reporting success — and a security scan that
# silently covers half the codebase is worse than none, because the green tick
# is the thing people read.
#
# So the build is explicit, both services, on the JDK the project actually
# requires.
#
# `-DskipTests`: CodeQL needs the classes, not the test results. Those are
# services.yml's job, and running them twice would double the slowest workflow
# in the repository for no extra signal.
on:
  pull_request:
    paths:
      - 'services/**'
      - 'clients/**'
      - '.github/workflows/codeql.yml'
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'clients/**'
      - '.github/workflows/codeql.yml'
  schedule:
    # Weekly, because a finding can appear without the code changing: CodeQL's
    # query packs are updated continuously, so code that was clean in August can
    # have a known problem in September with no commit in between.
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Writes the findings to the Security tab. Without this the analysis runs
      # and the results go nowhere.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [core, gateway]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: corretto
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Initialise CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java-kotlin
          build-mode: manual
          # security-and-quality over the default security-extended: the extra
          # queries are noisy, and a scan people filter mentally is one they
          # stop reading. Revisit if the noise turns out to be findings.
          queries: security-extended

      - name: Build ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: ./mvnw --batch-mode clean compile -DskipTests

      - name: Analyse
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:java-kotlin/service:${{ matrix.service }}
