name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - name: Lint the PR title
        uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            build
            ci
            perf
            revert
          # Conventional Commits allows exactly ONE scope. A change spanning
          # components therefore takes the broader scope or none -- not a comma
          # list, which is why `fix(gateway,core)` and `fix(gateway,platform)`
          # were rejected and then landed on main anyway (T-0.10, #215).
          #
          # `services` is the broader scope for a change touching both the
          # gateway and core. It was added because that combination kept being
          # written as a comma pair, which is a signal that the list was missing
          # something rather than that people were careless.
          scopes: |
            gateway
            core
            services
            infra
            platform
            secrets
            ci
            adr
            docs
            deps
          requireScope: false
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The subject "{subject}" is invalid: start it with a lower-case letter and do not end
            it with a period. Example: feat(gateway): relay OIDC token to the core service
