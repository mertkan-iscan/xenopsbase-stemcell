name: Secrets

# Every pull request, with no path filter. A path filter here would be a hole:
# a secret can be committed anywhere, and the one place it will be is the file
# nobody thought to watch.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: no unencrypted secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history, so the credential-shape scan sees what was actually
          # pushed rather than only the tip commit.
          fetch-depth: 0

      - name: Check for unencrypted secrets
        run: bash infra/scripts/check-secrets.sh

      # Needs no key. It compares the recipients named in .sops.yaml against the
      # recipients each encrypted file actually carries, which is public
      # metadata -- so the one check that guards against losing every secret
      # runs on every pull request without a credential anywhere near CI.
      #
      # The gap it closes: adding a recipient to .sops.yaml does not re-key
      # existing files and sops reports no error, so the escrow key can be in
      # the configuration and in none of the secrets it exists to rescue
      # (T-0.8).
      - name: Check every secret carries every recipient
        run: bash infra/scripts/verify-secret-recipients.sh

      # Needs no cluster and no credential -- it reads the manifests, which is
      # also why it can run here at all (the Kubernetes API is a tailnet
      # address, T-1.5). A container with no request is BestEffort: invisible
      # to the scheduler and first to be evicted (T-2.15).
      - name: Check every workload declares resource requests
        run: bash infra/scripts/verify-resources.sh

      # Static, like the check above, and for the same reason: the failure it
      # prevents is a scale-up event that has not happened yet. Live connection
      # counts are low right up until the moment they are not, so this reads
      # the declared ceilings -- HPA maxReplicas, Hikari, Keycloak's pool --
      # and adds them up against max_connections (T-2.18).
      - name: Check the database connection budget adds up
        run: bash infra/scripts/check-connection-budget.sh dev

      # Static for the same reason again: the runbook an alert points at is a
      # fact about the repository, and the moment it is worth checking is before
      # the alert fires rather than while somebody is reading it at 3am. It
      # resolves the anchor too -- a link to a heading that was renamed is worse
      # than no link, because it gets followed (T-7.6).
      - name: Check every alert links to a runbook section that exists
        run: bash infra/scripts/verify-alert-runbooks.sh

      # Static for the same reasons, and with a sharper deadline than the others.
      # T-6.2's third-party allowlist names exact DIGESTS, so repinning an image
      # without editing the policy denies the workload -- and not at deploy time:
      # the manifest applies cleanly and admission refuses the pod only when one
      # is next created, which may be hours later during a rollout or a
      # scale-up. Catching it on the pull request is the difference between a red
      # check and a mystery outage (T-6.2, #49).
      - name: Check third-party images are in the digest allowlist
        run: bash infra/scripts/check-image-allowlist.sh
