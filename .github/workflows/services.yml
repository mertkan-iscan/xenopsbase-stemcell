name: Services

# Publishes the API contract and proves it is consumable.
#
# The build and test half is ordinary. The part that earns its place is the spec: it is generated
# from the running application, compared against what is committed, and fed to a real generator.
# Each of those catches something the others cannot.
on:
  pull_request:
    paths:
      - 'services/**'
      - 'clients/**'
      - 'docs/api/**'
      - '.github/workflows/services.yml'
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'clients/**'
      - 'docs/api/**'
      # Present on pull_request and missing here, which meant a change to this
      # file could not trigger the workflow it changes. A commit touching only
      # the pipeline produced no run at all, so the pipeline was the one thing
      # that shipped to main unverified.
      - '.github/workflows/services.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # Both services are reported even when one fails. Stopping at the first turns "the gateway is
      # broken" into "something is broken", and the two are on the same Spring Boot line now, so a
      # failure in one is frequently a failure in both.
      fail-fast: false
      matrix:
        service: [core, gateway]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '25'
          distribution: corretto
          cache: maven
          # Per-service cache key, and this is a fix rather than tidying.
          #
          # setup-java derives the key from the hashed dependency files, which
          # defaulted to **/pom.xml -- identical for every job in this workflow.
          # GitHub Actions keeps the FIRST save under a key and rejects the
          # rest, so the `generated client` job, which finishes about two
          # minutes earlier and resolves far fewer artifacts, persisted its
          # ~/.m2 as the cache for all of them.
          #
          # Measured: the shared cache was 28 MB, and every core and gateway run
          # restored it, reported "Cache hit", and then downloaded the whole
          # Spring Boot dependency tree anyway. Caching that always hits and
          # rarely helps is worse than none, because the hit is what stops
          # anyone looking.
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      # Integration tests use Testcontainers, which needs a working Docker daemon. Ubuntu runners
      # have one; this fails loudly if that ever stops being true, rather than every IT erroring
      # with "Could not find a valid Docker environment".
      - name: Check Docker is available
        run: docker info > /dev/null

      - name: Build and test
        working-directory: services/${{ matrix.service }}
        run: ./mvnw --batch-mode clean verify -DskipITs=false

      # The contract, as an artifact anyone can download without building the project.
      - name: Upload OpenAPI document
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/openapi/*.json
          if-no-files-found: error

      # The committed spec is what the client generator and code review both read. If it drifts
      # from what the service actually serves, every consumer is working from a document that
      # describes an API that no longer exists -- and nothing else would notice.
      - name: Fail if the committed spec is stale
        run: |
          generated="services/${{ matrix.service }}/target/openapi/${{ matrix.service }}.json"
          committed="docs/api/${{ matrix.service }}.json"
          if ! diff -u "$committed" "$generated"; then
            echo ""
            echo "::error::docs/api/${{ matrix.service }}.json is out of date."
            echo "Regenerate it with: make api-spec"
            exit 1
          fi

  publish:
    name: publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    # Only from main, and only after the tests that gate it have passed. A PR
    # must not be able to publish an image: the tag would exist, be pullable,
    # and carry code that was never merged.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      # The only job that gets this. GITHUB_TOKEN is scoped per job, so a
      # compromised step in `build` or `client` cannot push an image.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [core, gateway]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '25'
          distribution: corretto
          cache: maven
          # Scoped to this service, so the publish job reuses the cache its own
          # build job populated rather than another job's.
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      # Jib talks to the registry directly and never builds a local image, so
      # there is no docker build, no daemon, and no Dockerfile to keep in step
      # with the application (T-6.1).
      # The version comes from the pom, not from the workflow, so the image tag
      # and the artifact it contains cannot disagree. A version written in two
      # places is a version that will eventually be wrong in one of them.
      - name: Read the project version
        id: version
        working-directory: services/${{ matrix.service }}
        run: |
          version="$(./mvnw --batch-mode --quiet -DforceStdout help:evaluate -Dexpression=project.version | tail -1 | tr -d '[:space:]')"
          case "$version" in
            ''|*[!0-9A-Za-z._-]*)
              echo "::error::project.version is empty or not usable as an image tag: '$version'"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "project version: $version"

      - name: Build and push to GHCR
        working-directory: services/${{ matrix.service }}
        run: |
          ./mvnw --batch-mode -DskipTests package jib:build             -Djib.to.image=ghcr.io/${{ github.repository }}/${{ matrix.service }}             -Djib.to.tags=${{ github.sha }},${{ steps.version.outputs.version }},main             -Djib.to.auth.username=${{ github.actor }}             -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}

      # Printed so the digest is in the log of the run that produced it. The
      # immutable reference for a deployment is the digest, not either tag:
      # `main` moves, and even a commit tag can be overwritten by a re-run.
      - name: Report the digest
        working-directory: services/${{ matrix.service }}
        run: |
          echo "### ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "image:   ghcr.io/${{ github.repository }}/${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "sha:     ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "version: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: $(cat target/jib-image.digest)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  client:
    name: generated client
    runs-on: ubuntu-latest
    # Runs regardless of the services job. A client that cannot be generated is a broken contract
    # whether or not the services happen to be green.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '25'
          distribution: corretto
          cache: maven
          # clients/java only. Same reason as the service jobs below: without a
          # distinct dependency path this job shares one cache key with them,
          # and being the fastest it wins the race to save -- persisting its own
          # small ~/.m2 as "the" cache for everyone.
          cache-dependency-path: clients/java/pom.xml

      # Generating is not enough -- openapi-generator will happily emit code that does not compile
      # from a spec it only partly understands. Compiling is the assertion.
      - name: Generate and compile the typed client
        working-directory: clients/java
        run: mvn --batch-mode clean compile

      - name: Upload the generated client sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-api-client-sources
          path: clients/java/target/generated-sources/openapi/src/main/java/**/*.java
          if-no-files-found: error
