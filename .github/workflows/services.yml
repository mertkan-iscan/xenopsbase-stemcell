name: Services

# Publishes the API contract and proves it is consumable.
#
# The build and test half is ordinary. The part that earns its place is the spec: it is generated
# from the running application, compared against what is committed, and fed to a real generator.
# Each of those catches something the others cannot.
#
# No `paths:` filter on the triggers, and that is deliberate rather than an
# oversight (T-0.7). A required status check that never runs is not reported as
# skipped, it is reported as expected — and a pull request waiting on a check
# that will never arrive cannot be merged, ever. So the workflow always starts,
# the `changed paths` job decides whether there is anything to build, and the
# expensive jobs skip themselves. A skipped job counts as success to branch
# protection; a workflow that never ran counts as nothing at all.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Replaces the trigger-level path filter. Everything that filter used to name
  # is named here instead, in one place, for both event types.
  changes:
    name: changed paths (services)
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.services }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Both sides of the comparison have to exist locally. A shallow clone
          # has the head and not the base, and `git diff` against a commit it
          # does not have fails — which would skip every build.
          fetch-depth: 0

      - name: Decide whether anything relevant changed
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A manual run is someone asking for the build regardless of what
          # changed, and workflow_dispatch carries neither sha.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "services=true" >> "$GITHUB_OUTPUT"
            echo "manual run: building everything"
            exit 0
          fi

          # The first push to a new branch reports an all-zero `before`, and a
          # force-push can report a commit that no longer exists. Neither is a
          # reason to skip the build, so fall back to building.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "services=true" >> "$GITHUB_OUTPUT"
            echo "base ${BASE} is not available: building everything"
            exit 0
          fi

          changed="$(git diff --name-only "${BASE}" "${HEAD}")"
          echo "changed files:"
          echo "${changed}"

          if echo "${changed}" | grep -Eq '^(services/|clients/|docs/api/|\.github/workflows/services\.yml$)'; then
            echo "services=true" >> "$GITHUB_OUTPUT"
          else
            echo "services=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.services == 'true'
    strategy:
      # Both services are reported even when one fails. Stopping at the first turns "the gateway is
      # broken" into "something is broken", and the two are on the same Spring Boot line now, so a
      # failure in one is frequently a failure in both.
      fail-fast: false
      matrix:
        service: [core, gateway]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '25'
          distribution: corretto
          cache: maven
          # Per-service cache key, and this is a fix rather than tidying.
          #
          # setup-java derives the key from the hashed dependency files, which
          # defaulted to **/pom.xml -- identical for every job in this workflow.
          # GitHub Actions keeps the FIRST save under a key and rejects the
          # rest, so the `generated client` job, which finishes about two
          # minutes earlier and resolves far fewer artifacts, persisted its
          # ~/.m2 as the cache for all of them.
          #
          # Measured: the shared cache was 28 MB, and every core and gateway run
          # restored it, reported "Cache hit", and then downloaded the whole
          # Spring Boot dependency tree anyway. Caching that always hits and
          # rarely helps is worse than none, because the hit is what stops
          # anyone looking.
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      # Integration tests use Testcontainers, which needs a working Docker daemon. Ubuntu runners
      # have one; this fails loudly if that ever stops being true, rather than every IT erroring
      # with "Could not find a valid Docker environment".
      - name: Check Docker is available
        run: docker info > /dev/null

      - name: Build and test
        working-directory: services/${{ matrix.service }}
        run: ./mvnw --batch-mode clean verify -DskipITs=false

      # The contract, as an artifact anyone can download without building the project.
      - name: Upload OpenAPI document
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/openapi/*.json
          if-no-files-found: error

      # The committed spec is what the client generator and code review both read. If it drifts
      # from what the service actually serves, every consumer is working from a document that
      # describes an API that no longer exists -- and nothing else would notice.
      #
      # The comparison moved into a script (T-5.4) so it can be run BEFORE pushing --
      # `make api-spec-check`. It was previously inline here, which meant the only way to
      # discover the spec was stale was to open a pull request and wait.
      - name: Fail if the committed spec is stale
        run: |
          bash infra/scripts/check-api-drift.sh             "services/${{ matrix.service }}/target/openapi/${{ matrix.service }}.json"             "docs/api/${{ matrix.service }}.json"

  api-compat:
    name: API compatibility
    runs-on: ubuntu-latest
    needs: changes
    # Pull requests only: it compares this branch's contract against the base's. On a push to
    # main there is no "before" that means anything -- main IS the contract.
    if: github.event_name == 'pull_request' && needs.changes.outputs.services == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Both sides of the comparison have to exist locally.
          fetch-depth: 0

      # Proves the gate can still fail. A compatibility check that has quietly stopped detecting
      # anything reports success on every breaking change ever made, and this repository has now
      # found that shape four times (#2, #113, #155, #211). Ten synthetic cases, five that must
      # break and five that must not.
      - name: Self-test the checker
        run: python3 infra/scripts/check-api-breaking.py --self-test

      - name: Compare the contract against the base branch
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          failed=0
          for service in core gateway; do
            committed="docs/api/${service}.json"
            echo "=================================================================="
            echo " ${service}"
            echo "=================================================================="
            if ! git cat-file -e "${base}:${committed}" 2>/dev/null; then
              echo "  no ${committed} on the base branch -- nothing to compare against."
              continue
            fi
            git show "${base}:${committed}" > "/tmp/${service}-base.json"
            if ! python3 infra/scripts/check-api-breaking.py "/tmp/${service}-base.json" "${committed}"; then
              failed=1
            fi
            echo ""
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::This pull request breaks the published API contract."
            exit 1
          fi

  publish:
    name: publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    # Only from main, and only after the tests that gate it have passed. A PR
    # must not be able to publish an image: the tag would exist, be pullable,
    # and carry code that was never merged.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      # The only job that gets this. GITHUB_TOKEN is scoped per job, so a
      # compromised step in `build` or `client` cannot push an image.
      packages: write
      # Keyless signing (T-6.2, #49). cosign exchanges this short-lived OIDC
      # token for a Fulcio certificate bound to THIS workflow, at this ref, in
      # this repository, and records the signature in Rekor. No private key
      # exists to be stolen or rotated, and the identity in the certificate is
      # the thing verification checks -- which is what makes "only images this
      # pipeline built" enforceable rather than aspirational.
      id-token: write
      # SLSA provenance. Attaches a signed statement of how the image was
      # built -- which workflow, which commit, which runner -- as an attestation
      # in the registry alongside the image.
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: [core, gateway]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '25'
          distribution: corretto
          cache: maven
          # Scoped to this service, so the publish job reuses the cache its own
          # build job populated rather than another job's.
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      # Jib talks to the registry directly and never builds a local image, so
      # there is no docker build, no daemon, and no Dockerfile to keep in step
      # with the application (T-6.1).
      # The version comes from the pom, not from the workflow, so the image tag
      # and the artifact it contains cannot disagree. A version written in two
      # places is a version that will eventually be wrong in one of them.
      - name: Read the project version
        id: version
        working-directory: services/${{ matrix.service }}
        run: |
          version="$(./mvnw --batch-mode --quiet -DforceStdout help:evaluate -Dexpression=project.version | tail -1 | tr -d '[:space:]')"
          case "$version" in
            ''|*[!0-9A-Za-z._-]*)
              echo "::error::project.version is empty or not usable as an image tag: '$version'"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "project version: $version"

      - name: Build and push to GHCR
        working-directory: services/${{ matrix.service }}
        run: |
          ./mvnw --batch-mode -DskipTests package jib:build             -Djib.to.image=ghcr.io/${{ github.repository }}/${{ matrix.service }}             -Djib.to.tags=${{ github.sha }},${{ steps.version.outputs.version }},main             -Djib.to.auth.username=${{ github.actor }}             -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}

      # THE DIGEST IS THE SUBJECT OF EVERYTHING BELOW.
      #
      # Signing or attesting a TAG would sign whatever that tag points at when
      # the verifier looks, which is a different image the moment `main` moves.
      # Jib writes the digest of what it actually pushed; that is what gets
      # signed, attested, and later verified.
      - name: Resolve the pushed digest
        id: digest
        working-directory: services/${{ matrix.service }}
        run: |
          digest="$(cat target/jib-image.digest)"
          case "$digest" in
            sha256:*) ;;
            *)
              echo "::error::jib-image.digest is not a digest: '$digest'"
              exit 1
              ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository }}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # cosign WRITES the signature to the registry as an artifact beside the
      # image, so it needs registry credentials of its own. Jib was given them
      # explicitly via -Djib.to.auth.*; cosign inherits nothing from that, and
      # the first run without this failed with
      #
      #   UNAUTHORIZED: unauthenticated
      #   POST https://ghcr.io/v2/.../blobs/uploads/
      #
      # after the image had already been pushed -- so the failure was in
      # publishing the signature, not in producing it.
      #
      # --password-stdin rather than -p: an argument is visible in the process
      # list, and this is the token that can push images.
      - name: Log in to GHCR for cosign
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Keyless. The certificate Fulcio issues carries this workflow's identity,
      # so verification can require that the image came from THIS pipeline
      # rather than merely that somebody signed it. A signature that only proves
      # "signed by someone" is the supply-chain equivalent of a control that
      # reports success while governing nothing.
      - name: Sign the image
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "${{ steps.digest.outputs.image }}@${{ steps.digest.outputs.digest }}"

      # THE PIPELINE PROVES ITS OWN CLAIM, RATHER THAN ASSUMING IT.
      #
      # `cosign sign` exiting 0 says the command ran, not that anything a
      # verifier can use was published. This runs the verification in the same
      # job, against the identity that is supposed to have made the signature,
      # so a signing step that silently stops producing usable output fails here
      # rather than being discovered by whatever was relying on it.
      #
      # A CORRECTION, KEPT BECAUSE THE TRAP IS REAL
      #
      # The commit that added this step said the registry held no signature at
      # all. That was wrong, and the mistake is worth recording because the next
      # person will make it too.
      #
      # cosign 3.x publishes the signature under the OCI referrers FALLBACK TAG
      #
      #   sha256-<digest>            <- no suffix
      #
      # where cosign 2.x used `sha256-<digest>.sig`. A check that greps the tag
      # list for names ending `.sig` finds nothing and reads as "unsigned",
      # which is exactly what happened: the signature was there the whole time,
      # under a name the search did not match.
      #
      # So this step earns its place for the ordinary reason -- an assertion
      # next to the thing it asserts -- and not because signing was broken.
      - name: Verify the signature we just made
        run: |
          cosign verify             --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/\.github/workflows/'             --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'             "${{ steps.digest.outputs.image }}@${{ steps.digest.outputs.digest }}"

      - name: Attest SLSA provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.digest.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          # Stored in the registry next to the image rather than only as a
          # GitHub attestation, so an admission controller can fetch it without
          # calling the GitHub API from inside the cluster.
          push-to-registry: true

      # Printed so the digest is in the log of the run that produced it. The
      # immutable reference for a deployment is the digest, not either tag:
      # `main` moves, and even a commit tag can be overwritten by a re-run.
      - name: Report the digest
        working-directory: services/${{ matrix.service }}
        run: |
          echo "### ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "image:   ghcr.io/${{ github.repository }}/${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "sha:     ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "version: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest:  ${{ steps.digest.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "signed:  cosign keyless, identity ${{ github.workflow_ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  client:
    name: generated client
    runs-on: ubuntu-latest
    needs: changes
    # Runs regardless of the services job. A client that cannot be generated is a broken contract
    # whether or not the services happen to be green.
    if: needs.changes.outputs.services == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '25'
          distribution: corretto
          cache: maven
          # clients/java only. Same reason as the service jobs below: without a
          # distinct dependency path this job shares one cache key with them,
          # and being the fastest it wins the race to save -- persisting its own
          # small ~/.m2 as "the" cache for everyone.
          cache-dependency-path: clients/java/pom.xml

      # Generating is not enough -- openapi-generator will happily emit code that does not compile
      # from a spec it only partly understands. Compiling is the assertion.
      - name: Generate and compile the typed client
        working-directory: clients/java
        run: mvn --batch-mode clean compile

      - name: Upload the generated client sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-api-client-sources
          path: clients/java/target/generated-sources/openapi/src/main/java/**/*.java
          if-no-files-found: error

  # The one context branch protection requires from this workflow (T-0.7).
  #
  # Requiring `core`, `gateway` and `generated client` by name would work too,
  # and would couple the protection rules to a matrix definition: rename an
  # entry or add a third service and the required check silently stops
  # existing, which reads as "no longer required" rather than as an error. One
  # aggregate context cannot drift that way.
  gate:
    name: services
    runs-on: ubuntu-latest
    # `always()` is what makes this reportable when the jobs above skipped —
    # the default `success()` would skip the gate too, and a skipped gate is
    # fine for protection but tells nobody anything.
    if: always()
    # api-compat is in this list deliberately. `services` is the REQUIRED status check on main,
    # so a job missing from here can fail while the gate still reports success -- which is the
    # exact failure T-0.7 found in branch protection itself.
    needs: [changes, build, api-compat, client]
    steps:
      - name: Fail if any services job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *)
                echo "::error::a Services job reported '${result}'"
                exit 1
                ;;
            esac
          done
          echo "all Services jobs succeeded or were skipped"
