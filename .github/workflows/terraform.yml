name: Terraform

# No `paths:` filter on the triggers, and that is deliberate (T-0.7). A
# required status check that never runs is not reported as skipped, it is
# reported as expected, and a pull request waiting on a check that will never
# arrive cannot be merged. So the workflow always starts, the `changed paths`
# job decides whether there is any Terraform to look at, and everything below
# it skips when there is not. A skipped job counts as success to branch
# protection; a workflow that never ran counts as nothing at all.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      module:
        description: 'Root module to apply'
        required: true
        type: choice
        options: [storage, edge, cluster]
      environment:
        description: 'Environment'
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]

# Deliberately `pull_request`, never `pull_request_target`. This repository is
# public: pull_request_target runs workflow code from the base branch WITH
# secrets available to a fork's pull request, which is the standard way people
# leak credentials. With `pull_request`, a fork gets no secrets — the plan job
# below skips itself rather than failing.
permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: '1.14.8'
  # Git for Windows is not involved here, but keeping the override makes the CI
  # invocation identical to the local one rather than subtly different.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  # ----------------------------------------------------------------------------
  # Replaces the trigger-level path filter. Everything that filter used to name
  # is named here instead, in one place, for both event types.
  # ----------------------------------------------------------------------------
  changes:
    name: changed paths (terraform)
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Both sides of the comparison have to exist locally. A shallow clone
          # has the head and not the base, and `git diff` against a commit it
          # does not have fails — which would skip every check.
          fetch-depth: 0

      - name: Decide whether anything relevant changed
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A manual run is someone asking for the plan or the apply regardless
          # of what changed, and workflow_dispatch carries neither sha.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
            echo "manual run: checking everything"
            exit 0
          fi

          # The first push to a new branch reports an all-zero `before`, and a
          # force-push can report a commit that no longer exists. Neither is a
          # reason to skip, so fall back to checking.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
            echo "base ${BASE} is not available: checking everything"
            exit 0
          fi

          changed="$(git diff --name-only "${BASE}" "${HEAD}")"
          echo "changed files:"
          echo "${changed}"

          if echo "${changed}" | grep -Eq '^(infra/terraform/|\.github/workflows/terraform\.yml$|\.tflint\.hcl$|\.checkov\.yaml$)'; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform=false" >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------------------------
  # Static checks. No credentials, so these run for forks too.
  # ----------------------------------------------------------------------------
  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    strategy:
      fail-fast: false
      # EVERY root module under infra/terraform, not the three that get planned
      # (T-1.8, #14). `cluster-v2` was added by #287 and `mail-dns` predates the
      # matrix; both were reachable only by `terraform fmt -check -recursive`
      # and by checkov, which scans the whole directory. Neither was validated
      # and neither was linted, so a root module could be merged that does not
      # parse -- which is the specific thing this job exists to prevent.
      #
      # The plan matrix below is deliberately NOT the same list. See the note
      # on it for why.
      matrix:
        module: [storage, edge, cluster, cluster-v2, mail-dns]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: terraform init (no backend)
        working-directory: infra/terraform/${{ matrix.module }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: infra/terraform/${{ matrix.module }}
        run: terraform validate

      # Installed directly rather than via a marketplace action. Pinning an
      # action to a commit SHA is the right practice, and a SHA that has not
      # been verified is worse than none -- this is a public repository and the
      # action would run with the workflow's permissions.
      - name: Install tflint
        run: |
          curl -fsSL https://raw.githubusercontent.com/terraform-linters/tflint/v0.55.1/install_linux.sh | bash
          tflint --version

      - name: tflint
        working-directory: infra/terraform/${{ matrix.module }}
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact

  # ----------------------------------------------------------------------------
  # Security scan. Also credential-free.
  # ----------------------------------------------------------------------------
  checkov:
    name: checkov
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install checkov
        run: pip install --quiet checkov==3.2.334

      - name: checkov
        run: checkov --directory infra/terraform --framework terraform --config-file .checkov.yaml

  # ----------------------------------------------------------------------------
  # Plan. Needs credentials, so it is skipped for pull requests from forks —
  # they have no secrets, and a plan that cannot reach state is noise, not a
  # failure worth reporting.
  # ----------------------------------------------------------------------------
  plan:
    name: plan (${{ matrix.module }})
    if: >-
      needs.changes.outputs.terraform == 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [changes, lint]
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      # NOT the lint matrix (T-1.8, #14). A plan needs three things this job
      # supplies by convention: an `env/<environment>.tfvars`, a state key in
      # the case block below, and credentials that reach real infrastructure.
      #
      #   cluster-v2  has no env/ yet -- it is the half-built root module from
      #               #287 and has never been applied, so there is no state to
      #               plan against. It joins this list in that card, together
      #               with its tfvars and its state key.
      #   mail-dns    is applied by hand from mail.tfvars, once, when the DKIM
      #               records change. It has no per-environment layout at all.
      #
      # Both are linted and scanned above. What they are missing here is a plan,
      # and the reason is stated rather than left as an omission.
      matrix:
        module: [storage, edge, cluster]
    env:
      ENVIRONMENT: dev
      # R2 holds Terraform state (ADR-0005). These are the standard AWS names
      # because the S3 backend cannot read a TF_VAR_ — see the state runbook.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      # Provider credentials, per module.
      TF_VAR_hetzner_s3_access_key: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      TF_VAR_hetzner_s3_secret_key: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_firewall_source_cidrs: ${{ secrets.FIREWALL_SOURCE_CIDRS }}
      # Without this the cluster module cannot even PLAN: node_transport_mode is
      # "tailscale" and a variable validation rejects an absent key at plan time,
      # on purpose (a missing key produces nodes that boot, never join, and hang
      # rather than failing). So `plan (cluster)` has been red since 2026-08-21
      # and no terraform change has been validated by CI since (T-1.17, #183).
      #
      # Must be REUSABLE. A single-use key registers the first node and the rest
      # wait forever, which presents as a rebuild that never converges rather
      # than as an error.
      TF_VAR_tailscale_auth_key: ${{ secrets.TAILSCALE_AUTH_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check credentials are configured
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ]; then
            echo "::warning::R2 credentials are not configured; skipping plan."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Write backend config
        if: env.skip != 'true'
        working-directory: infra/terraform/${{ matrix.module }}
        run: |
          cat > backend.hcl <<EOF
          bucket = "xenopsbase-tfstate"
          region = "auto"
          endpoints = { s3 = "${R2_ENDPOINT}" }
          EOF

      # The state key is derived from the environment exactly as the Makefile
      # does it, so CI cannot plan one environment's config against another's
      # state (T-1.4).
      - name: terraform init
        if: env.skip != 'true'
        working-directory: infra/terraform/${{ matrix.module }}
        run: |
          case "${{ matrix.module }}" in
            storage) KEY="storage/${ENVIRONMENT}/terraform.tfstate" ;;
            edge)    KEY="edge/${ENVIRONMENT}/terraform.tfstate" ;;
            cluster) KEY="${ENVIRONMENT}/cluster.tfstate" ;;
          esac
          terraform init -input=false -reconfigure \
            -backend-config=backend.hcl -backend-config="key=${KEY}"

      # Secrets tfvars are gitignored, so CI reconstructs the non-sensitive half
      # it needs. Anything genuinely sensitive arrives as TF_VAR_ above.
      - name: Write per-environment secrets tfvars
        if: env.skip != 'true'
        working-directory: infra/terraform/${{ matrix.module }}
        run: |
          case "${{ matrix.module }}" in
            storage)
              cat > "env/${ENVIRONMENT}.secrets.tfvars" <<EOF
          project_id = "${{ secrets.HETZNER_PROJECT_ID }}"
          access_keys = {
            infra         = "${{ secrets.HETZNER_KEY_INFRA }}"
            app           = "${{ secrets.HETZNER_KEY_APP }}"
            db            = "${{ secrets.HETZNER_KEY_DB }}"
            observability = "${{ secrets.HETZNER_KEY_OBS }}"
          }
          EOF
              ;;
            edge)
              cat > "env/${ENVIRONMENT}.secrets.tfvars" <<EOF
          account_id = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          zone_id    = "${{ secrets.CLOUDFLARE_ZONE_ID }}"
          EOF
              ;;
          esac

      # The cluster module reads SSH keys from local FILES, which a runner does
      # not have. The public key must be the real one -- it becomes an
      # hcloud_ssh_key resource, so a different value would produce a plan that
      # does not match reality. The private key is only used by provisioners at
      # apply time, never during plan, so a throwaway satisfies the variable.
      #
      # That is the point: a real plan, without putting a key that grants root
      # on every node into CI.
      - name: Provide SSH keys for the cluster plan
        if: env.skip != 'true' && matrix.module == 'cluster'
        run: |
          ssh-keygen -t ed25519 -N '' -C 'ci-throwaway-never-authorised' -f /tmp/ci_key >/dev/null
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/ci_key.pub
          echo "TF_KEY_OVERRIDE=-var ssh_public_key_path=/tmp/ci_key.pub -var ssh_private_key_path=/tmp/ci_key" >> "$GITHUB_ENV"

      - name: terraform plan
        if: env.skip != 'true'
        id: plan
        working-directory: infra/terraform/${{ matrix.module }}
        run: |
          set +e
          EXTRA=""
          [ -f "env/${ENVIRONMENT}.secrets.tfvars" ] && EXTRA="-var-file=env/${ENVIRONMENT}.secrets.tfvars"
          terraform plan -input=false -no-color -lock-timeout=5m \
            -var-file="env/${ENVIRONMENT}.tfvars" $EXTRA ${TF_KEY_OVERRIDE:-} > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          # Keep the comment inside GitHub's 65536-character limit.
          tail -c 60000 plan.txt > plan.trimmed
          cat plan.trimmed

      - name: Comment plan on the pull request
        if: env.skip != 'true' && always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          MODULE: ${{ matrix.module }}
        with:
          script: |
            const fs = require('fs');
            const module_ = process.env.MODULE;
            let body;
            try {
              const plan = fs.readFileSync(
                `infra/terraform/${module_}/plan.trimmed`, 'utf8');
              const summary = (plan.match(/^(Plan:|No changes\.).*$/m) || ['(no summary line)'])[0];
              body = [
                `### Terraform plan — \`${module_}\` (dev)`,
                '',
                `**${summary}**`,
                '',
                '<details><summary>Full plan</summary>',
                '',
                '```terraform',
                plan,
                '```',
                '',
                '</details>',
              ].join('\n');
            } catch (e) {
              body = `### Terraform plan — \`${module_}\` (dev)\n\nPlan did not produce output: ${e.message}`;
            }
            const marker = `<!-- tf-plan-${module_} -->`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));
            const payload = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: payload });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: payload });
            }

      - name: Fail if plan errored
        if: env.skip != 'true' && steps.plan.outputs.exitcode != '0'
        run: exit 1

  # ----------------------------------------------------------------------------
  # The one context branch protection requires from this workflow (T-0.7).
  #
  # Requiring `lint (storage)`, `checkov`, `plan (cluster)` and the rest by name
  # would work too, and would couple the protection rules to a matrix
  # definition: add a fourth root module and the new job is not required,
  # rename one and the old name silently stops existing — which GitHub reads as
  # "no longer required" rather than as an error. One aggregate context cannot
  # drift that way.
  #
  # `apply` is deliberately not among the needs: it is workflow_dispatch-only,
  # so on a pull request it is always skipped and it has nothing to say about
  # whether the branch is mergeable.
  # ----------------------------------------------------------------------------
  gate:
    name: terraform
    runs-on: ubuntu-latest
    # `always()` is what makes this reportable when the jobs above skipped. The
    # default `success()` would skip the gate too.
    if: always()
    needs: [changes, lint, checkov, plan]
    steps:
      - name: Fail if any Terraform job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *)
                echo "::error::a Terraform job reported '${result}'"
                exit 1
                ;;
            esac
          done
          echo "all Terraform jobs succeeded or were skipped"

  # ----------------------------------------------------------------------------
  # Apply. Manual only.
  #
  # Never on push or merge: an apply here creates or destroys real, billable
  # infrastructure, and ADR-0002 makes destroy an everyday operation rather than
  # an exceptional one. A human chooses the module and environment deliberately.
  # ----------------------------------------------------------------------------
  apply:
    name: apply (${{ inputs.module }} / ${{ inputs.environment }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      TF_VAR_hetzner_s3_access_key: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      TF_VAR_hetzner_s3_secret_key: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_firewall_source_cidrs: ${{ secrets.FIREWALL_SOURCE_CIDRS }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Same reconstruction the plan job does, and for the same reason: the
      # *.secrets.tfvars files are gitignored, so the runner rebuilds the
      # non-sensitive half from repository secrets.
      #
      # Absent here until now, which means this job had never once succeeded.
      # `apply` is workflow_dispatch only, so no push and no PR ever exercised
      # it, and the first real dispatch died on "No value for required variable"
      # for account_id and zone_id. It died safely -- variables resolve before
      # any provider call, so the state lock was taken and released with no plan
      # and no change.
      - name: Write per-environment secrets tfvars
        working-directory: infra/terraform/${{ inputs.module }}
        run: |
          case "${{ inputs.module }}" in
            storage)
              cat > "env/${ENVIRONMENT}.secrets.tfvars" <<EOF
          project_id = "${{ secrets.HETZNER_PROJECT_ID }}"
          access_keys = {
            infra         = "${{ secrets.HETZNER_KEY_INFRA }}"
            app           = "${{ secrets.HETZNER_KEY_APP }}"
            db            = "${{ secrets.HETZNER_KEY_DB }}"
            observability = "${{ secrets.HETZNER_KEY_OBS }}"
          }
          EOF
              ;;
            edge)
              cat > "env/${ENVIRONMENT}.secrets.tfvars" <<EOF
          account_id = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          zone_id    = "${{ secrets.CLOUDFLARE_ZONE_ID }}"
          EOF
              ;;
          esac

      - name: terraform init and apply
        working-directory: infra/terraform/${{ inputs.module }}
        run: |
          cat > backend.hcl <<EOF
          bucket = "xenopsbase-tfstate"
          region = "auto"
          endpoints = { s3 = "${R2_ENDPOINT}" }
          EOF
          case "${{ inputs.module }}" in
            storage) KEY="storage/${ENVIRONMENT}/terraform.tfstate" ;;
            edge)    KEY="edge/${ENVIRONMENT}/terraform.tfstate" ;;
            cluster) KEY="${ENVIRONMENT}/cluster.tfstate" ;;
          esac
          terraform init -input=false -reconfigure \
            -backend-config=backend.hcl -backend-config="key=${KEY}"
          # Deliberately not the plan job's "[ -f x ] && EXTRA=..." one-liner:
          # as the last command of a "set -e" step, a false test exits 1.
          EXTRA=""
          if [ -f "env/${ENVIRONMENT}.secrets.tfvars" ]; then
            EXTRA="-var-file=env/${ENVIRONMENT}.secrets.tfvars"
          fi
          terraform apply -auto-approve -input=false -lock-timeout=5m \
            -var-file="env/${ENVIRONMENT}.tfvars" $EXTRA
