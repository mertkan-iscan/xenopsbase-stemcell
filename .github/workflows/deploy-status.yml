name: Deploy status

# Did the commit that just merged actually reach the cluster? (T-6.7, #195)
#
# THE LOOP THIS CLOSES
#
# Promotion is a git operation with an approval gate (T-6.3). The commit merges,
# the workflow goes green, and whether Argo CD ever applied it was observed by
# nobody: a promotion that silently failed to reconcile looked exactly like one
# that worked. `make rollout-status` asked the right question, from a machine
# that could reach the answer, and only when somebody remembered.
#
# WHY THIS CAN RUN AT ALL NOW
#
# The Kubernetes API is a tailnet address and 6443 is closed on every public IP
# (T-1.5, ADR-0006). A GitHub-hosted runner is not on the tailnet, which is why
# T-6.3 could not do this.
#
# The runner now JOINS the tailnet for the duration of the job. That does not
# widen the public surface -- 6443 stays closed to the internet, and the runner
# is a peer rather than a hole. It does widen who is briefly inside the private
# network, which is the honest cost and is recorded on #195.
#
# The auth key is the one added for terraform in T-1.17, and it is EPHEMERAL:
# verified by observing that the previous cluster's three nodes disappeared from
# the tailnet after a rebuild rather than accumulating. So a runner registers,
# does its work, and is removed when it disconnects. A non-ephemeral key would
# leave a device per CI run for ever, and that check is worth repeating if the
# key is ever replaced.
#
# THE CLUSTER IS USUALLY DOWN, AND THAT IS NOT A FAILURE
#
# `make down` at the end of a session is the intended lifecycle (ADR-0002), so
# most merges land with no cluster at all. A deploy check that failed every time
# would be noise within a week, and a noisy check is one people learn to ignore
# -- the shape this repository keeps finding. So the absence of a cluster is
# detected first, reported, and passes.
on:
  push:
    branches: [main]
    paths:
      - 'platform/envs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check'
        required: false
        default: 'dev'
        type: string

permissions:
  contents: read

concurrency:
  # One at a time. Two of these racing would ask Argo CD about different
  # commits and disagree, and the older one could report a failure that the
  # newer one has already fixed.
  group: deploy-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reached:
    name: did the deploy land
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before joining anything. If there is no cluster there is nothing to
      # verify, and no reason to put a runner on the tailnet to find that out.
      - name: Is there a cluster at all?
        id: cluster
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          count="$(curl -sS -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
            'https://api.hetzner.cloud/v1/servers?per_page=1' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["meta"]["pagination"]["total_entries"])')"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "${count}" -eq 0 ]; then
            echo "::notice::No cluster is running, so there is nothing to reconcile against."
            echo "This is the normal state between working sessions (ADR-0002)."
          else
            echo "${count} server(s) running — checking whether ${GITHUB_SHA} reached them."
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.cluster.outputs.count != '0'
        with:
          terraform_version: 1.14.8

      # From Terraform state in R2, over the public internet -- this does not
      # need the tailnet, only the kubectl calls below do.
      - name: Read the kubeconfig out of Terraform state
        if: steps.cluster.outputs.count != '0'
        working-directory: infra/terraform/cluster
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # backend.hcl is gitignored -- only backend.hcl.example is tracked --
          # so CI writes it, exactly as terraform.yml does. Found by this
          # workflow's first real run failing with "Failed to read file", which
          # names neither the file nor the fact that it is generated.
          cat > backend.hcl <<EOF
          bucket = "xenopsbase-tfstate"
          region = "auto"
          endpoints = { s3 = "${R2_ENDPOINT}" }
          EOF

          # The state key is derived from the environment exactly as the
          # Makefile does it, so this cannot read one environment's state while
          # claiming to report on another (T-1.4).
          terraform init -input=false -reconfigure \
            -backend-config=backend.hcl \
            -backend-config="key=${ENVIRONMENT}/cluster.tfstate"
          terraform output -raw kubeconfig > kubeconfig
          chmod 600 kubeconfig
          test -s kubeconfig

      - name: Join the tailnet
        if: steps.cluster.outputs.count != '0'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          # Hostname only, deliberately no --advertise-tags. A tag has to be
          # authorised for the key in the tailnet ACL, and this is the untagged
          # node key from T-1.17: advertising tag:ci with it fails the join
          # outright rather than degrading. Tagging is the better end state --
          # it would let ACLs treat a runner differently from a cluster node --
          # and it needs an ACL change and a key minted for it, which is a
          # decision rather than plumbing.
          #
          # The hostname still makes the device identifiable while it exists,
          # and it exists only for the length of the job.
          # The action's own input, NOT `args: --hostname=...`. The action
          # builds the `tailscale up` command itself, so passing the flag
          # through args conflicts with it and `tailscale up` exits printing
          # its usage -- which reads like a broken key rather than a duplicated
          # argument.
          hostname: gh-runner-${{ github.run_id }}

      - name: Did the cluster reach this commit?
        if: steps.cluster.outputs.count != '0'
        env:
          # rollout-status.sh polls internally until this expires, so it does
          # the waiting rather than a retry loop here. Ten minutes because Argo
          # CD polls git roughly every three: "not yet" is the expected answer
          # for the first couple of attempts and must not read as a failure,
          # which is the distinction #195 asked for. A timeout means it never
          # arrived; a Degraded application means it arrived and broke. The
          # script says which.
          #
          # THIS PARAGRAPH DESCRIBED AN INTENTION, NOT THE CODE, UNTIL T-6.7.
          # The script waited for Synced and Healthy and then compared revisions
          # ONCE, after the wait -- so on a merge it broke out immediately
          # (everything was already healthy at the previous commit), compared,
          # and failed in about 25 seconds of these 600. It is true now.
          ROLLOUT_TIMEOUT: "600"
        run: |
          # The expected SHA is only meaningful when this commit CHANGED
          # something Argo CD watches. On a push touching platform/envs/** it
          # is the whole point: "Synced and Healthy" says the cluster matches
          # some revision, and only the SHA says it matches the one that just
          # merged.
          #
          # On a manual run it is the wrong question. Argo CD advances an
          # application's recorded revision when it reconciles that
          # application's path, so a commit touching only .github/ leaves most
          # applications reporting an older SHA -- correctly, because nothing
          # about them changed. Demanding the new SHA there reports a failure
          # for applications that are working exactly as intended, which is how
          # a check earns a reputation for crying wolf.
          if [ "${{ github.event_name }}" = "push" ]; then
            EXPECT="${GITHUB_SHA}"
            echo "Checking that ${GITHUB_SHA} reached ${ENVIRONMENT}."
          else
            EXPECT=""
            echo "Manual run: checking every application is Synced and Healthy."
            echo "Not asserting a revision — this commit may not touch anything Argo CD watches."
          fi

          if bash infra/scripts/rollout-status.sh "${ENVIRONMENT}" "${EXPECT}"; then
            echo "::notice::${ENVIRONMENT} is Synced and Healthy${EXPECT:+ at ${GITHUB_SHA}}."
          else
            echo ""
            # Deliberately does NOT name the failure. There are two -- an
            # application that never became Healthy, and one that is healthy but
            # never advanced to this commit -- and the script's last lines say
            # which. Restating one of them here produced a run whose summary said
            # "did not reach a Synced and Healthy state" about a cluster where
            # every application was Synced and Healthy, at the previous commit.
            echo "::error::${ENVIRONMENT} did not reach ${GITHUB_SHA} within 10 minutes. See the output above."
            echo "Argo CD polls about every 3 minutes, so this is longer than lag."
            echo "The output above names which application is not Synced, not Healthy,"
            echo "or still at an older revision."
            echo "To force one:"
            echo "  kubectl -n argocd patch application <name> --type merge -p '{\"operation\":{\"sync\":{}}}'"
            exit 1
          fi
