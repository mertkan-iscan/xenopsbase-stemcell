name: Cost

# Notices a cluster that was left running, and anything billable that nothing
# is using (T-8.4, #62).
#
# WHY THIS EXISTS
#
# ADR-0002's whole argument is "near zero when idle", and until now nothing
# checked it. The lifecycle is `make up` at the start of a session and
# `make down` at the end, which works exactly as well as remembering does.
#
# It has already failed in practice: on 2026-08-24 the dev cluster ran for
# hours after work on it had finished, and the reason nobody noticed is that
# the only way to look was to go and look.
#
# WHAT IT DOES NOT DO, AND WHY
#
# It does not destroy anything, and as of 2026-09-04 that is a DECISION rather
# than a limitation.
#
# The original first reason no longer holds. It read: "`make down` needs the
# cluster's Kubernetes API to flush the WAL before destroying (T-7.2), and CI
# cannot reach it over Tailscale (#195)". #195 landed; runners now join the
# tailnet for the duration of a job, which deploy-status.yml and
# load-regression.yml both do. A scheduled teardown is technically possible.
#
# The second reason was always the real one, and it has now been decided rather
# than deferred: destroying someone's cluster on a timer is a standing decision
# about their environment, not one that should arrive as a surprise during a long
# debugging session. Asked directly on 2026-09-04, the answer was to keep the
# detection and decline the destruction.
#
# What makes that cheap rather than lax: the dev cluster is already torn down by
# hand most nights, reliably. Auto-destroy would be automating a habit that is
# being performed anyway, so it buys little, and the failure it can cause --
# deleting an environment somebody was still using -- is not recoverable by
# rerunning the job. This check costs a morning's notice when the habit slips,
# which is what actually went wrong on 2026-08-24.
#
# T-8.4's first criterion therefore stands DECLINED rather than unmet, and the
# reasoning is on #62 rather than only here.
#
# WHY AGE RATHER THAN EXISTENCE
#
# Alerting on "a cluster exists" would fire on every working day, and a check
# that fires when nothing is wrong is one people stop reading -- a shape this
# repository has now found four times. It fires when the oldest server has
# been up longer than a working session.
on:
  schedule:
    # 06:00 UTC, which is early morning in Europe/Istanbul: late enough that a
    # cluster left up overnight has been up long enough to trip the threshold,
    # early enough that seeing it costs a morning rather than a day.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      max_hours:
        description: 'Hours a cluster may run before this fails.'
        required: false
        default: '12'
        type: string

permissions:
  contents: read

jobs:
  cost:
    name: cost and orphans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Report
        id: report
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          if [ -z "${HCLOUD_TOKEN}" ]; then
            echo "::error::HCLOUD_TOKEN is not set — this check cannot see the project."
            exit 1
          fi
          bash infra/scripts/cost-report.sh | tee /tmp/report.txt || true
          bash infra/scripts/cost-report.sh --json > /tmp/report.json
          cat /tmp/report.json

      # Reported, never deleted. Snapshot growth is slow and steady, so the
      # useful thing is seeing the plan regularly rather than having images
      # disappear on a timer -- and a snapshot is durable state (ADR-0008),
      # so an automated deletion that got it wrong would break a cold rebuild
      # rather than cost a few cents.
      - name: Snapshot retention plan (dry run)
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: bash infra/scripts/prune-snapshots.sh

      - name: Fail if something was left running, or is orphaned
        env:
          MAX_HOURS: ${{ inputs.max_hours || '12' }}
        run: |
          python3 - "$MAX_HOURS" <<'PY'
          import json, os, sys

          limit = float(sys.argv[1])
          with open("/tmp/report.json", encoding="utf-8") as fh:
              r = json.load(fh)

          failed = False

          # Orphans first: they cost money and nothing is using them, which is
          # true regardless of whether a cluster is meant to be up.
          if r["orphans"]:
              print("::error::%d orphaned billable resource(s)" % len(r["orphans"]))
              for o in r["orphans"]:
                  print("  %s %s (%s)" % (o["kind"], o["name"], o["detail"]))
              print("")
              print("These are what a failed teardown leaves behind. `make down` runs")
              print("verify-teardown.sh, which would have caught them at the time.")
              failed = True

          hours = r["oldest_server_hours"]
          if r["servers"] and hours > limit:
              print("::error::a cluster has been running for %.1f hours (limit %.0f)" % (hours, limit))
              print("  spent so far      EUR %.2f" % r["spent_so_far"])
              print("  per day if left   EUR %.2f" % r["daily_total"])
              print("")
              print("If this was deliberate, ignore it. If it was not:")
              print("  source ~/.xenopsbase.env && make down ENV=dev")
              failed = True
          elif r["servers"]:
              print("%d server(s), oldest %.1f h — within the %.0f h limit." % (
                  r["servers"], hours, limit))
          else:
              print("Nothing billable is running. EUR %.4f/h for what survives teardown." % r["hourly_idle"])

          sys.exit(1 if failed else 0)
          PY
