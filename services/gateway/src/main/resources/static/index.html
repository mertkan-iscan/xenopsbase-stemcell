<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XenOpsBase</title>

    <!--
      Stylesheet and script are separate files rather than inline blocks.

      That is now load-bearing. This comment used to say the CSP still allowed
      'unsafe-inline' and that dropping it would need no change here; T-3.14 did
      drop it, so the policy is script-src 'self'; style-src 'self' and an inline
      block added to this page would simply not run.

      Widths on the usage meters are set through the CSSOM from app.js, which CSP
      does not govern -- it restricts inline <style> elements and style
      attributes parsed from markup, not property assignment by script that has
      already satisfied script-src.
    -->
    <link rel="stylesheet" href="/app.css" />
  </head>

  <!--
    WHAT THIS PAGE IS FOR, NOW THAT THE DEMO DOMAIN IS GONE (T-9.2).

    It used to be a document manager: an upload panel, a table and a pager, which
    were business UI in a template that claims to have no business logic. Those
    are deleted along with the endpoints behind them.

    What is left is the minimum that has a REASON to exist:

      - the session identity and a log-out button, because they are what proves
        the OIDC login flow reached the browser and can be ended;
      - the infrastructure panel, which is a platform capability rather than a
        feature (T-3.16);
      - a page at `/` at all, because SecurityConfiguration's
        anyExchange().authenticated() and smoke.sh both depend on this route
        serving something to an authenticated caller. Deleting the page would
        have left both of them passing against a 404.

    A fork replaces this with its own UI. Nothing here is a component library and
    nothing here is meant to be extended.
  -->
  <body>
    <header class="bar">
      <h1>XenOpsBase</h1>
      <div class="identity">
        <span id="identity" class="muted">checking session…</span>
        <button id="logout" type="button" class="secondary" disabled>Log out</button>
      </div>
    </header>

    <!-- Assertive rather than polite: this is where an expired session is
         reported, and that needs to interrupt. -->
    <div id="banner" class="banner" role="alert" hidden></div>

    <main>
      <section class="panel">
        <h2>Session</h2>
        <!-- What CORE sees in the relayed token, not what the gateway saw. The
             two differ whenever the relay is misconfigured, and the difference
             is otherwise invisible: requests still succeed, they are just
             anonymous by the time they land downstream.

             role="status" so a screen reader hears the result rather than
             having to go looking for it. -->
        <p id="session-detail" class="muted" role="status">…</p>
      </section>

      <!--
        Infrastructure usage (T-3.16).

        Hidden until the session is known to hold app-admin. That is a
        CONVENIENCE, not the control: /api/admin/** is restricted server-side by
        core's SecurityConfiguration, and this section only avoids showing a
        panel that would answer 403. Anyone can unhide it with dev tools and
        will get exactly nothing.
      -->
      <section class="panel" id="infra-panel" hidden>
        <div class="row spread">
          <h2>Infrastructure <span id="infra-collected" class="muted"></span></h2>
          <button id="infra-refresh" type="button" class="secondary">Refresh</button>
        </div>

        <p id="infra-status" class="muted" role="status"></p>

        <div id="infra-content" hidden>
          <h3>Nodes</h3>
          <div id="infra-nodes" class="cards"></div>

          <h3>Containers</h3>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Node</th>
                  <th>Namespace</th>
                  <th>Container</th>
                  <th class="num">CPU</th>
                  <th class="num">Memory</th>
                  <th>Memory vs limit</th>
                </tr>
              </thead>
              <tbody id="infra-containers"></tbody>
            </table>
          </div>

          <h3>Volumes</h3>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Namespace</th>
                  <th>Claim</th>
                  <th class="num">Used</th>
                  <th class="num">Capacity</th>
                  <th>Used vs capacity</th>
                </tr>
              </thead>
              <tbody id="infra-volumes"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
