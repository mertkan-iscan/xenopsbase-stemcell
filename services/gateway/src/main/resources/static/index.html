<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XenOpsBase — Documents</title>

    <!--
      Stylesheet and script are separate files rather than inline blocks.

      The CSP still allows 'unsafe-inline' for both, because JHipster's default did
      and removing it was not this task. Nothing here relies on it, so that
      allowance can be dropped from application.yml without touching this page --
      which is the point of not writing inline blocks in the first place.
    -->
    <link rel="stylesheet" href="/app.css" />
  </head>

  <body>
    <header class="bar">
      <h1>Documents</h1>
      <div class="identity">
        <span id="identity" class="muted">checking session…</span>
        <button id="logout" type="button" class="secondary" disabled>Log out</button>
      </div>
    </header>

    <!-- Assertive rather than polite: this is where a failed upload or an expired
         session is reported, and both need to interrupt. -->
    <div id="banner" class="banner" role="alert" hidden></div>

    <main>
      <section class="panel">
        <h2>Upload</h2>
        <div class="row">
          <input type="file" id="file" />
          <button id="upload" type="button" disabled>Upload</button>
        </div>
        <!-- role="status" so a screen reader hears each stage. The three-step
             upload is slow enough that silence reads as a hang. -->
        <p id="upload-status" class="muted" role="status"></p>
      </section>

      <section class="panel">
        <h2>Your documents <span id="total" class="muted"></span></h2>

        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Type</th>
                <th class="num">Size</th>
                <th>Uploaded</th>
                <th><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>

        <p id="empty" class="muted" hidden>Nothing uploaded yet.</p>

        <nav class="pager" aria-label="Pagination">
          <button id="prev" type="button" class="secondary" disabled>Previous</button>
          <span id="page-label" class="muted"></span>
          <button id="next" type="button" class="secondary" disabled>Next</button>
        </nav>
      </section>

      <!--
        Infrastructure usage (T-3.16).

        Hidden until the session is known to hold app-admin. That is a
        CONVENIENCE, not the control: /api/admin/** is restricted server-side by
        core's SecurityConfiguration, and this section only avoids showing a
        panel that would answer 403. Anyone can unhide it with dev tools and
        will get exactly nothing.
      -->
      <section class="panel" id="infra-panel" hidden>
        <div class="row spread">
          <h2>Infrastructure <span id="infra-collected" class="muted"></span></h2>
          <button id="infra-refresh" type="button" class="secondary">Refresh</button>
        </div>

        <p id="infra-status" class="muted" role="status"></p>

        <div id="infra-content" hidden>
          <h3>Nodes</h3>
          <div id="infra-nodes" class="cards"></div>

          <h3>Containers</h3>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Namespace</th>
                  <th>Container</th>
                  <th class="num">CPU</th>
                  <th class="num">Memory</th>
                  <th>Memory vs limit</th>
                </tr>
              </thead>
              <tbody id="infra-containers"></tbody>
            </table>
          </div>

          <h3>Volumes</h3>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Namespace</th>
                  <th>Claim</th>
                  <th class="num">Used</th>
                  <th class="num">Capacity</th>
                  <th>Used vs capacity</th>
                </tr>
              </thead>
              <tbody id="infra-volumes"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
