# ===================================================================
# Spring Boot configuration for the "prod" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    com.xenopsoftware.gateway: INFO

management:
  # THE SWITCH THAT MADE THE WHOLE PIPELINE EMPTY (T-2.12, #155).
  #
  # This read `false` until 2026-08-23. It disables the Micrometer Prometheus
  # registry, so `/management/prometheus` answered 404 even though `prometheus`
  # is listed in the exposure include list -- and no jvm_*, http_server_* or
  # pool metric from either service reached anywhere. Prometheus held 2423
  # metric names and none of them came from an application.
  #
  # The comment below the OTLP switch is what let it survive: it said metrics
  # already reached Prometheus another way. There was no other way.
  prometheus:
    metrics:
      export:
        enabled: true
  # Distributed tracing over OTLP (T-2.7).
  #
  # This block previously configured Zipkin at http://localhost:9411, paired
  # with a `zipkin` Maven profile that was never activated. The result was a
  # service that produced no spans at all, while Tempo and Alloy were deployed,
  # healthy and receiving nothing -- Tempo's own API answered {"traces":[]}.
  #
  # The endpoint has NO default on purpose. Spring only registers an OTLP
  # exporter when one is set, so a laptop with no collector generates spans and
  # exports nothing, rather than retrying against a port that is not listening.
  # The deployment supplies it; see platform/envs/dev/services/.
  #
  # TRACES go over OTLP. METRICS do not, and are scraped instead -- by the
  # ServiceMonitor in platform/envs/dev/services/servicemonitor.yaml, which is
  # the "another way" this comment used to assert without one existing.
  #
  # spring-boot-starter-opentelemetry brings micrometer-registry-otlp, which
  # turns OTLP metrics export on by default and aims it at
  # http://localhost:4318/v1/metrics. Nothing listens there and Alloy's
  # pipeline handles traces only, so leaving it on produced a stack trace once
  # a minute in every pod. Disabling it was right; believing that left a
  # working metrics path behind was not.
  #
  # Exactly one path is enabled. If OTLP metrics are ever turned on, the scrape
  # must be turned off in the same commit, or every series is counted twice.
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:}
          # gRPC, not the `http` default: the Alloy receiver in this platform
          # listens on 4317 with a grpc block only. Sending protobuf-over-HTTP
          # to a gRPC port fails per export, in the exporter's own log, while
          # the application stays healthy.
          transport: grpc
  tracing:
    sampling:
      # Everything, which is right for dev and wrong for a busy production
      # service -- overridden by TRACING_SAMPLE_PROBABILITY rather than by
      # editing this. Boot's own default is 0.1.
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  thymeleaf:
    cache: true

# ===================================================================
# To enable TLS in production, generate a certificate using:
# keytool -genkey -alias gateway -storetype PKCS12 -keyalg RSA -keysize 2048 -keystore keystore.p12 -validity 3650
#
# You can also use Let's Encrypt:
# See details in topic "Create a Java Keystore (.JKS) from Let's Encrypt Certificates" on https://maximilian-boehm.com/en-gb/blog
#
# Then, modify the server.ssl properties so your "server" configuration looks like:
#
# server:
#   port: 443
#   ssl:
#     key-store: classpath:config/tls/keystore.p12
#     key-store-password: password
#     key-store-type: PKCS12
#     key-alias: selfsigned
#     # The ciphers suite enforce the security by deactivating some old and deprecated SSL cipher, this list was tested against SSL Labs (https://www.ssllabs.com/ssltest/)
#     ciphers: TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384 ,TLS_DHE_RSA_WITH_AES_128_GCM_SHA256 ,TLS_DHE_RSA_WITH_AES_256_GCM_SHA384 ,TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384,TLS_DHE_RSA_WITH_AES_128_CBC_SHA256,TLS_DHE_RSA_WITH_AES_128_CBC_SHA,TLS_DHE_RSA_WITH_AES_256_CBC_SHA256,TLS_DHE_RSA_WITH_AES_256_CBC_SHA,TLS_RSA_WITH_AES_128_GCM_SHA256,TLS_RSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_128_CBC_SHA256,TLS_RSA_WITH_AES_256_CBC_SHA256,TLS_RSA_WITH_AES_128_CBC_SHA,TLS_RSA_WITH_AES_256_CBC_SHA,TLS_DHE_RSA_WITH_CAMELLIA_256_CBC_SHA,TLS_RSA_WITH_CAMELLIA_256_CBC_SHA,TLS_DHE_RSA_WITH_CAMELLIA_128_CBC_SHA,TLS_RSA_WITH_CAMELLIA_128_CBC_SHA
# ===================================================================
server:
  port: 8080
  shutdown: graceful # see https://docs.spring.io/spring-boot/reference/web/graceful-shutdown.html#web.graceful-shutdown
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  http:
    cache: # Used by the CachingHttpHeadersFilter
      timeToLiveInDays: 1461
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

