# ===================================================================
# Configuration for the "secret-samples" profile.
#
# ACTIVATED AUTOMATICALLY BY THE dev PROFILE. application.yml puts
# secret-samples in the `dev` profile group, so anything set here silently
# overrides application.yml whenever you run in dev.
#
# That is a trap worth knowing about. As generated, this file pointed at
# JHipster's sample realm:
#
#   issuer-uri: http://localhost:9080/realms/jhipster
#   client-id: web_app
#
# which meant a gateway configured correctly in application.yml still refused to
# start in dev, with "Unable to resolve Configuration with the provided Issuer"
# naming a realm nobody had configured.
#
# It now describes THIS project's realm, and takes the secret from the
# environment rather than hard-coding one.
# ===================================================================

spring:
  security:
    oauth2:
      client:
        provider:
          oidc:
            # Must match Keycloak's configured hostname exactly: that value is
            # what it puts in the `iss` claim of every token, regardless of the
            # host the request arrived on.
            issuer-uri: ${OIDC_ISSUER_URI:https://auth-dev.xenopsoftware.com/realms/xenopsbase}
        registration:
          oidc:
            client-id: ${OIDC_CLIENT_ID:gateway}
            # No default. The real value is SOPS-encrypted in the cluster
            # (platform/envs/dev/secrets/keycloak-clients.yaml); locally, export
            # OIDC_CLIENT_SECRET. A gateway that starts with a placeholder
            # secret authenticates against nothing and looks fine doing it.
            client-secret: ${OIDC_CLIENT_SECRET}
            scope: openid, profile, email, offline_access
