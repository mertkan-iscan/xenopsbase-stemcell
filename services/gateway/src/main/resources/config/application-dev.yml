# ===================================================================
# Spring Boot configuration for the "dev" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

logging:
  level:
    ROOT: DEBUG
    tech.jhipster: DEBUG
    org.hibernate.SQL: DEBUG
    com.xenopsoftware.gateway: DEBUG

management:
  # Distributed tracing over OTLP (T-2.7).
  #
  # This block previously configured Zipkin at http://localhost:9411, paired
  # with a `zipkin` Maven profile that was never activated. The result was a
  # service that produced no spans at all, while Tempo and Alloy were deployed,
  # healthy and receiving nothing -- Tempo's own API answered {"traces":[]}.
  #
  # The endpoint has no usable default, and `tracing.enabled` below is what makes
  # that safe.
  #
  # This comment used to claim Spring "only registers an OTLP exporter when one
  # is set". It does not. `${OTLP_TRACING_ENDPOINT:}` resolves to the EMPTY
  # STRING, which is a set value, and the exporter is built and rejects it:
  #
  #   IllegalArgumentException: Invalid endpoint, must start with http:// or https://:
  #
  # So the dev profile could not start at all without that variable exported --
  # found the first time anything ran this profile on a laptop rather than in the
  # cluster (T-4.1). The deployment was unaffected because it runs the `prod`
  # profile and supplies the endpoint; see platform/envs/dev/services/.
  #
  # Tracing is therefore OFF by default here and ON wherever a collector exists.
  # Set TRACING_ENABLED=true together with OTLP_TRACING_ENDPOINT to trace locally.
  # Metrics do NOT go over OTLP here; Prometheus scrapes them.
  #
  # spring-boot-starter-opentelemetry brings micrometer-registry-otlp, which
  # turns OTLP metrics export on by default and aims it at
  # http://localhost:4318/v1/metrics. Nothing listens there, and Alloy's
  # pipeline handles traces only, so the effect was a stack trace once a minute
  # in every pod, for metrics that already reach Prometheus another way.
  otlp:
    metrics:
      export:
        enabled: false
  # NO otlp tracing endpoint here, deliberately, and the omission is the fix.
  #
  # `endpoint: ${OTLP_TRACING_ENDPOINT:}` used to live here. The empty default is
  # a SET value, so Boot built the exporter and it rejected it:
  #
  #   IllegalArgumentException: Invalid endpoint, must start with http:// or https://:
  #
  # which meant the dev profile could not start on a machine that had not
  # exported that variable -- the whole point of T-4.1 being a five-minute clone.
  # Setting `management.tracing.enabled: false` does NOT avoid it either: the
  # exporter bean is conditional on the endpoint property existing, not on
  # tracing being on. Leaving the property unset is what actually works.
  #
  # The deployment is unaffected: it runs the `prod` profile, which sets the
  # endpoint and the grpc transport (Alloy's receiver listens on 4317 with a
  # grpc block only). To trace locally, export
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT and TRACING_ENABLED=true.
  tracing:
    # OFF unless a collector exists -- see the note above the otlp block.
    enabled: ${TRACING_ENABLED:false}
    sampling:
      # Everything, which is right for dev and wrong for a busy production
      # service -- overridden by TRACING_SAMPLE_PROBABILITY rather than by
      # editing this. Boot's own default is 0.1.
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}

spring:
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**
    livereload:
      enabled: false # we use Webpack dev server + BrowserSync for livereload
  # jackson2, not jackson. Under Boot 4 `spring.jackson.*` binds to Jackson 3
  # (tools.jackson), where WRITE_DURATIONS_AS_TIMESTAMPS does not exist -- the
  # context fails at startup on an unconvertible enum. This service still uses the
  # Jackson 2 API, so it configures the Jackson 2 namespace. core does the same.
  jackson2:
    serialization:
      indent-output: true
  messages:
    cache-duration: PT1S # 1 second, see the ISO 8601 standard
  thymeleaf:
    cache: false

server:
  port: 8080
  # make sure requests the proxy uri instead of the server one
  forward-headers-strategy: native

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  gateway:
    rate-limiting:
      enabled: false
      limit: 100000
      duration-in-seconds: 3600
  # CORS is only enabled by default with the "dev" profile
  cors:
    # Allow Ionic for JHipster by default (* no longer allowed in Spring Boot 2.4+)
    allowed-origins: 'http://localhost:8100,https://localhost:8100'
    # Enable CORS when running in GitHub Codespaces
    allowed-origin-patterns: 'https://*.githubpreview.dev'
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params'
    allow-credentials: true
    max-age: 1800
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
