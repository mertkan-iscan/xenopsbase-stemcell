# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
reactive:
  feign:
    circuit:
      breaker:
        enabled: true
  # client:
  #   config:
  #     default:
  #       connectTimeout: 5000
  #       readTimeout: 5000
# ===================================================================
# Resilience (T-3.9)
#
# Numbers here are a DEFAULT POSTURE, not tuning. Tuning needs the latency
# distribution of a real downstream, which a template does not have. What matters
# is that every value is stated: an unset timeout is not "the default", it is
# usually no timeout at all.
# ===================================================================
resilience4j:
  circuitbreaker:
    configs:
      default:
        # ---------------------------------------------------------------------
        # THE WINDOW IS A DURATION, NOT A CALL COUNT (T-5.10)
        # ---------------------------------------------------------------------
        #
        # This was COUNT_BASED with slidingWindowSize: 20, for a stated and
        # correct reason -- a time window on a low-traffic service never
        # accumulates enough calls to decide anything, so the breaker would stay
        # closed while the downstream was entirely broken.
        #
        # The reason was right and the consequence was not. A COUNT window's
        # TIME SPAN varies inversely with traffic, so the busier the service, the
        # less evidence the breaker demands before cutting it off. T-5.10
        # measured what that costs at 1200 req/s, where 20 calls is SEVENTEEN
        # MILLISECONDS of traffic:
        #
        #   forwarded to core, successful   84,350
        #   short-circuited, never sent    133,931
        #   actually failed                    457
        #   slow calls (>5s)                     0
        #
        # 293 requests discarded per real failure. One GC pause fills a 17ms
        # window, the failure rate crosses 50%, and the breaker opens for 10s --
        # six hundred times the span of traffic that made the decision. Five
        # half-open probes then meet a still-busy service, and it reopens. The
        # stack oscillated between serving and serving nothing, and throughput
        # at 1600 req/s came out BELOW what it serves comfortably at 400.
        #
        # TIME_BASED makes the decision span constant at every rate. The original
        # low-traffic concern is now carried by minimumNumberOfCalls instead,
        # which is what that setting is for.
        #
        # THE TRADE, STATED: below ~2 req/s the breaker can no longer open,
        # because 20 calls will not arrive in a 10s window. That is deliberate.
        # A dead downstream at low traffic costs a handful of requests that hit
        # the response-timeout; a 17ms window at high traffic costs a ten-second
        # blackout of a service that was working. The second failure is far more
        # expensive and it is the one that was actually observed.
        slidingWindowType: TIME_BASED
        # Seconds, not calls, now that the type is TIME_BASED.
        slidingWindowSize: 10
        # Below this the failure rate is noise, and this is now also what stops a
        # near-idle service from tripping on a couple of unlucky calls.
        minimumNumberOfCalls: 20
        failureRateThreshold: 50
        # Two seconds, not ten. Every second open discards a full second of
        # traffic -- 1200 requests at the rate above -- so the open state is now
        # priced against what it costs rather than against how long a JVM takes
        # to restart. automaticTransitionFromOpenToHalfOpen means recovery is
        # probed without a request having to arrive and be rejected first.
        waitDurationInOpenState: 2s
        # Twenty probes rather than five. At any real rate this is a few
        # milliseconds of exposure, and it makes the recovery decision a
        # measurement instead of a coin toss: with five, three unlucky calls
        # re-opened the breaker for another ten seconds.
        permittedNumberOfCallsInHalfOpenState: 20
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # A slow downstream is a failure too. 5s never once fired in T-5.10 --
        # `slow` stayed at 0 through a run that pushed 2000 req/s -- because the
        # measured p99 is ~24ms healthy and ~148ms at the knee, so 5s was two
        # hundred times the worst case the system actually produces. 1s is ~40x
        # the healthy p99: still far outside normal, and inside the 10s
        # response-timeout, so slowness is detected before the transport gives
        # up rather than after.
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 1s
        registerHealthIndicator: true
        # ---------------------------------------------------------------------
        # SHED LOAD IS NOT A DOWNSTREAM FAILURE (T-5.11)
        # ---------------------------------------------------------------------
        #
        # The reactive Spring Cloud CircuitBreaker nests these two controls in a
        # fixed order, and the order is not the one the YAML suggests. From
        # ReactiveResilience4JCircuitBreaker.run():
        #
        #   fallback( timeLimiter( circuitBreaker( bulkhead( proxy ) ) ) )
        #
        # The BREAKER IS OUTSIDE THE BULKHEAD. So every request the bulkhead
        # refuses raises BulkheadFullException *inside* the breaker's call, and
        # without this line the breaker counts the gateway's own admission
        # control as evidence that core is failing.
        #
        # That is a self-reinforcing loop and it recreates exactly the outage
        # T-5.10 measured: concurrency rises, the bulkhead sheds, the shed calls
        # read as a 100% failure rate, the breaker opens, and a downstream that
        # was merely busy is cut off entirely. The bulkhead only becomes a
        # graceful-degradation mechanism once its rejections stop being counted.
        #
        # `ignoreExceptions` is the right verb, not `recordExceptions`: ignored
        # calls are excluded from the window altogether rather than recorded as
        # successes, so shedding neither opens the breaker nor papers over a
        # genuine failure rate while it is happening.
        #
        # CallNotPermittedException is NOT listed. The breaker never records its
        # own rejections, and naming it here would be cargo cult.
        ignoreExceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
    instances:
      core:
        baseConfig: default
  timelimiter:
    configs:
      default:
        # Must be >= the httpclient response-timeout above, or this cancels the
        # call before the transport has had its stated chance and every slow
        # response is attributed to the wrong layer.
        timeoutDuration: 12s
        cancelRunningFuture: true
    instances:
      core:
        baseConfig: default
  bulkhead:
    configs:
      default:
        # Caps how much of the gateway one downstream can consume. Without it a
        # single slow service occupies every worker and takes the others down
        # with it -- the failure this whole card exists to prevent.
        #
        # ---------------------------------------------------------------------
        # WHY THIS IS STILL 50, AND WHAT IS NOW KNOWN ABOUT IT (T-5.11)
        # ---------------------------------------------------------------------
        #
        # T-5.10 recorded this bulkhead as INERT and attributed that to reactive
        # Spring Cloud Gateway not applying Resilience4j bulkheads at all. That
        # attribution is WRONG and is retracted in docs/slos.md. It is applied:
        # ReactiveResilience4JCircuitBreaker.run() decorates the call via
        # ReactiveResilience4jBulkheadProvider using the breaker's own id, so
        # `name: core` on the route resolves this instance.
        # ReactiveBulkheadWiringTest asserts that path against the real upstream
        # classes, and two cluster runs confirmed it: 109,195 and 337,679
        # rejections recorded, against a metric that had previously never moved.
        #
        # It was inert because 50 per pod is above any concurrency this stack
        # reaches -- Little's Law on the T-5.10 curve puts the whole tier at ~40
        # in flight at its knee, against a budget of 150 at three replicas.
        #
        # LOWERING IT WAS TRIED AND MADE THINGS WORSE. 8 per pod capped served
        # throughput at ~250 req/s; 16 per pod restored the low end and then
        # collapsed to 55 req/s at 1600 offered. The cause is not the breaker --
        # `failed` was 0 and `not_permitted` was 0 in both runs, so the
        # ignoreExceptions line below does its job and the circuit never opened.
        # The cause is that a permit is held for the whole gateway-side request,
        # and at the knee the NODES are at 97-100% CPU with a load average of 30
        # on four cores (T-5.12). Permit hold time is then dominated by run-queue
        # delay, so the limit tightens hardest exactly when it should not.
        #
        # A concurrency limit cannot be sized against a saturated host. The
        # number stays at its unmeasured default until the cluster is fixed --
        # requests aligned with usage, cluster-autoscaler actually reachable,
        # and the trace pipeline up so the hold time can be attributed to a span
        # rather than inferred. docs/slos.md carries the measurements.
        maxConcurrentCalls: 50
        # MUST STAY 0, AND NOT FOR TUNING REASONS. SemaphoreBulkhead.tryEnterBulkhead
        # calls semaphore.tryAcquire() when this is 0 and the BLOCKING
        # tryAcquire(timeout, unit) when it is not -- and the caller here is a
        # Netty event loop thread. Any non-zero wait parks an event loop under
        # exactly the overload it was configured to survive. BlockHound (see
        # JHipsterBlockHoundIntegration) fails the build on it.
        maxWaitDuration: 0
    instances:
      core:
        baseConfig: default

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - gateway
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
  endpoint:
    health:
      show-details: when_authorized
      # app-admin, not ROLE_ADMIN. This is Boot's own role check and it is
      # matched against the principal's authorities, which carry the realm's
      # role names -- no token has ever contained ROLE_ADMIN, so `when_authorized`
      # could authorize nobody and every caller saw a bare UP (T-3.20, #186).
      roles: 'app-admin'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    jhimetrics:
      access: read-only
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      # SCOPED, not `all: true` (T-2.12, #155).
      #
      # `all: true` asks Micrometer for a full bucket histogram on EVERY timer
      # and distribution summary. Each one becomes roughly 30-70 additional
      # series, and it applies to meters nobody reads -- Spring Data repository
      # timers, task executors, the lot. While the registry was switched off
      # this cost nothing, because nothing was exported. Turning the registry on
      # without narrowing it first is how a metrics fix becomes a Prometheus
      # incident.
      #
      # Histograms are for the meter that has an SLO attached to it, which here
      # is the one the load baseline (T-5.6) will be written against.
      percentiles-histogram:
        http.server.requests: true
      # Client-side percentiles on everything else. These are cheap -- one
      # series per quantile, pre-computed in the process -- but they cannot be
      # aggregated across replicas, which is the reason the histogram above
      # exists for the metric that matters.
      percentiles:
        all: 0.5, 0.95, 0.99
    data:
      repository:
        autotime:
          enabled: true
    tags:
      application: ${spring.application.name}

spring:
  # Carries the correlation id from the Reactor context into MDC around each operator, so
  # %X{requestId} in the log pattern is populated on log lines written from any scheduler.
  # Without it the field renders empty and every log line simply lacks the id -- which looks
  # like normal logs rather than like a broken feature (T-3.8).
  reactor:
    context-propagation: auto
  application:
    name: gateway

  # Session storage (T-2.11, ADR-0009).
  #
  # This gateway is a backend-for-frontend: it holds the OIDC session and relays
  # the access token downstream. Spring's default keeps that in an
  # InMemoryWebSessionStore, which puts the access and refresh tokens in one
  # JVM's heap and makes `replicas: 1` load-bearing rather than a sizing choice.
  # A second replica would serve requests that land on the pod without the
  # session, signing users out at random, intermittently, with nothing logged.
  session:
    # There is NO spring.session.store-type in Spring Boot 4. It was removed;
    # the store is chosen by what is on the classpath. This block first carried
    # `store-type: ${SESSION_STORE_TYPE:none}` intending to make Redis optional,
    # and that property is simply unknown: it bound to nothing, changed nothing,
    # and the reactive Redis repository was used anyway.
    #
    # It surfaced as a BlockHound failure in CI rather than as a configuration
    # error -- ReactiveRedisTemplate resolving an empty hostname on the event
    # loop -- which names the symptom and not the cause.
    #
    # So Valkey is a REQUIRED dependency of this gateway now, not an optional
    # one. Tests get a real one from Testcontainers; the deployment points at
    # the cluster's.
    timeout: ${SESSION_TIMEOUT:30m}
    data:
      redis:
        # spring.session.data.redis.*, not spring.session.redis.*. The latter
        # still binds and is deprecated.
        #
        # Namespaced so a future consumer of the same Valkey cannot collide with
        # session keys, and so that `KEYS xenopsbase:gateway:session:*` is a
        # meaningful question when someone needs to know whether sessions are
        # landing at all.
        namespace: xenopsbase:gateway:session

  data:
    redis:
      # No default, deliberately, and no empty-string default either. An unset
      # VALKEY_HOST fails at startup with "Could not resolve placeholder", which
      # names the missing variable. An empty default instead produced a gateway
      # that started, reported healthy, and blocked an event-loop thread trying
      # to resolve "" on the first request that touched a session.
      host: ${VALKEY_HOST}
      port: ${VALKEY_PORT:6379}
      password: ${VALKEY_PASSWORD:}
      # Bounded like every other outbound call in this service (T-3.9). An
      # unreachable session store must fail the request, not hold the thread.
      timeout: 2s
      connect-timeout: 2s

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - TokenRelay
            # PER-CLIENT RATE LIMITING (T-8.3, #61).
            #
            # ADR-0009 named this as one of the two things that wanted a shared
            # store -- "Per-replica counters mean the real limit is
            # limit x replicas" -- and deferred it until there was one. Valkey
            # is that store, and it is already a hard dependency of this gateway
            # for sessions, so this adds a use of a component rather than a
            # component.
            #
            # WHO A CLIENT IS is the whole design and it lives in
            # RateLimiterConfiguration, including the two ways to get it wrong
            # that both produce a single global bucket.
            #
            # THE NUMBERS ARE A CEILING, NOT A TUNING.
            #
            # 20/s sustained with a burst of 60 is far above any human and far
            # below a script. A browser page load on the frontend (T-3.13) bursts
            # tens of requests for assets and then goes quiet, which is exactly
            # the shape a token bucket is for; a credential-stuffing loop is not.
            #
            # They are deliberately NOT derived from the k6 baseline. That
            # measures what the pods can serve (T-5.6), which is the autoscaling
            # question; this is "what could one client possibly be doing that is
            # legitimate", and the honest answer is a round number with a wide
            # margin. `make load-ratelimit` proves the limit exists and is
            # per-client; it does not claim the number is right.
            #
            # WHY IT DOES NOT FAIL CLOSED
            #
            # deny-empty-key is false: a client this cannot identify is served,
            # not rejected with a 403. A limiter that fails closed turns a defect
            # in identifying callers into an outage, and Cloudflare's limit
            # (infra/terraform/edge) is still in front of it. Same reasoning as
            # ADR-0011's for the cache: losing the mechanism must degrade, not
            # deny.
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@clientKeyResolver}"
                deny-empty-key: false
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:60}
                redis-rate-limiter.requestedTokens: 1
          httpclient:
            pool:
              max-connections: 1000
            # No outbound call may wait forever (T-3.9). Reactor Netty's defaults
            # are effectively unbounded, which is the worst possible behaviour under
            # load: a downstream that has stopped answering holds every connection
            # that reached it, and the gateway stops serving requests that have
            # nothing to do with it.
            #
            # connect-timeout is milliseconds; response-timeout is a Duration.
            connect-timeout: 2000
            response-timeout: 10s
          routes:
            # Kubernetes Service DNS, not lb://. There is no service registry
            # (JDL: serviceDiscoveryType no) because Kubernetes already provides
            # discovery; lb:// here would fail to resolve at runtime rather than
            # at startup, so the first symptom would be a 503 on a real request.
            #
            # CORE_URI is overridden per environment. The default is the
            # in-cluster name so a deployment needs no configuration to work.
            - id: core
              uri: ${CORE_URI:http://core:8081}
              predicates:
                - Path=/services/core/**
              filters:
                # /services/core/api/x  ->  /api/x
                - StripPrefix=2
                # NO X-Forwarded-Prefix filter here, deliberately.
                #
                # Spring Cloud Gateway's XForwardedHeadersFilter already derives the
                # prefix from StripPrefix and sends it. Setting one as a route filter as
                # well produced BOTH, and core concatenated them:
                #   /services/core/services/core/api/documents
                # A link that 404s is not obviously better than the one it replaced.
                #
                # What core needs to make use of it is forward-headers-strategy:
                # framework, which is set in the core service's application.yml. That
                # was the entire missing half.
                # Trips before a failing downstream can exhaust the gateway (T-3.9).
                # The fallback turns an open circuit into a 503 problem document
                # rather than the generic error page Spring would otherwise return.
                - name: CircuitBreaker
                  args:
                    name: core
                    fallbackUri: forward:/fallback/core
                # Retries GET only. A POST is not safe to replay from here: the
                # gateway cannot know whether the first attempt reached core and
                # committed, and it cannot see whether the client supplied an
                # Idempotency-Key (T-3.8) -- so a retry could duplicate the work
                # the key exists to prevent.
                #
                # 5xx and connect failures only. Retrying a 4xx re-sends a request
                # the downstream has already judged invalid.
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    series: SERVER_ERROR
                    exceptions: java.io.IOException, java.util.concurrent.TimeoutException
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false
          # WHOSE X-Forwarded-* HEADERS THIS GATEWAY BELIEVES (T-3.15, #148).
          #
          # Still '.*', which trusts the immediate peer whoever it is. Narrowing
          # it is the open half of #148; what stops forged headers arriving
          # through the ingress today is the ingress rewriting them, including
          # X-Forwarded-Prefix, which is now stripped there
          # (platform/envs/dev/apps/ingress-nginx.yaml).
          #
          # THIS SETTING HAS NOW BEEN CHANGED TWICE ON AN INFERENCE AND REVERTED
          # ONCE, AT THE COST OF A CLIENT CONTRACT. Read the whole comment
          # before touching it.
          #
          # WHAT HAPPENED. It was narrowed to '10\.42\.\d{1,3}\.\d{1,3}' in
          # 0c8129a. Core's pagination Link header immediately became
          #
          #   <http://core:8081/api/documents?page=1&size=2>; rel="next"
          #
          # instead of https://app-dev.xenopsoftware.com/services/core/api/...
          # An untrusted peer does not merely stop ADDING forwarded headers: the
          # upstream filter deletes the ones nginx already set, so core saw no
          # host and no proto and fell back to its own in-cluster address. This
          # setting fails OPEN on the client contract, not closed on the attack,
          # which is why a wrong value here is worse than no value.
          #
          # WHAT THE MECHANISM ACTUALLY IS, now established rather than assumed.
          # See TrustedProxiesTest, which asserts all of it against the real
          # upstream classes and fails if Spring changes them:
          #
          #   - the pattern is a FULL match (Pattern.matches), so '10\.42\.'
          #     rejects everything and '10\.42\..*' does not;
          #   - it is matched against getRemoteAddress().getHostString(), which
          #     carries NO PORT;
          #   - an untrusted peer strips every x-forwarded-* header.
          #
          # THE RECORDED HYPOTHESIS WAS WRONG. d861dbf guessed the match string
          # included the port (10.42.3.26:54321). It does not -- getHostString()
          # never returns one -- and '10\.42\.\d{1,3}\.\d{1,3}' matches
          # '10.42.3.26' perfectly well. Both are asserted in the test. So the
          # pattern was not the fault: the string it was fed was not the string
          # anyone thought it was.
          #
          # Reproduced locally on k3d (same k3s, same 10.42.0.0/16 pod CIDR,
          # ingress-nginx as a ClusterIP Deployment exactly as dev deploys it):
          # a backend behind the ingress sees its peer as the ingress-nginx POD
          # IP, in 10.42.0.0/16, no port. Under those conditions the reverted
          # pattern would have worked. Dev therefore differs from that in some
          # way nobody has yet looked at, and THAT is the open question -- not
          # which regex to write.
          #
          # SETTLED ON THE LIVE CLUSTER, 2026-08-24. IT CANNOT BE NARROWED.
          #
          # `trusted-proxies` is read by TWO layers that see DIFFERENT addresses,
          # and one value has to serve both:
          #
          #   1. gatewayNettyServerCustomizer, gated on
          #      `httpserver.customizer-enabled`. It matches the REAL TCP peer,
          #      and decides whether Netty applies the forwarded headers to the
          #      gateway's own view of the request.
          #
          #   2. XForwardedHeadersFilter and ForwardedHeadersFilter. They match
          #      `request.getRemoteAddress()` -- which layer 1 has ALREADY
          #      rewritten to the client's address -- and decide what is
          #      forwarded on to core.
          #
          # Measured, with the customizer on and this set to the pod CIDR:
          #
          #   layer 1 saw  10.42.2.9      the ingress-nginx pod: trusted, correct
          #   layer 2 saw  81.214.48.36   the browser: NOT trusted, headers stripped
          #
          # and core immediately produced
          #
          #   <http://core:8081/api/documents?page=1&size=1>; rel="next"
          #
          # which is #170's regression exactly. The new smoke check caught it in
          # four seconds; in August it took a person reading a header and a day
          # to revert.
          #
          # So the two layers cannot be satisfied by one pattern:
          #   narrow  -> layer 1 right, layer 2 strips every forwarded header
          #   '.*'    -> both trust everything, which is where this sits
          #
          # THE TRUST DECISION THEREFORE LIVES AT THE EDGE, and already does:
          # Cloudflare overwrites X-Forwarded-Host, and the ingress strips
          # X-Forwarded-Prefix (platform/envs/dev/apps/ingress-nginx.yaml). This
          # value is not the control it looks like, and changing it is not the
          # improvement it looks like.
          #
          # Three attempts have now been made here. The first two were
          # inferences; this one was measured, and the measurement says stop.
          #
          # See alternatives in https://github.com/spring-cloud/spring-cloud-gateway/issues/3818
          trusted-proxies: '.*'
  docker:
    compose:
      # Off. The generated compose files duplicated Keycloak, Postgres, Grafana
      # and Prometheus, all of which the cluster already runs; they were deleted
      # in T-3.2. Left enabled, startup fails looking for a file that is gone.
      enabled: false
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: '@spring.profiles.active@'
    group:
      dev:
        - secret-samples
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- tls
  jmx:
    enabled: false
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  webflux:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        provider:
          oidc:
            # Points at the Keycloak realm imported from git in T-2.5.
            #
            # This MUST be the PUBLIC issuer, not the in-cluster Service name.
            #
            # Verified rather than assumed: Keycloak's discovery document
            # reports
            #   "issuer":"https://auth-dev.xenopsoftware.com/realms/xenopsbase"
            # even when fetched over localhost. hostname.strict: false relaxes
            # which Host headers are ACCEPTED; it does not make the issuer
            # follow the request. Every token carries the configured hostname.
            #
            # So a gateway configured with the in-cluster URL rejects every
            # token with an issuer-mismatch error, while Keycloak, the realm and
            # the network all look fine.
            #
            # It also has to be publicly reachable regardless: the login flow
            # redirects the user's BROWSER to Keycloak, which cannot resolve a
            # cluster-internal name.
            issuer-uri: ${OIDC_ISSUER_URI:https://auth-dev.xenopsoftware.com/realms/xenopsbase}
        registration:
          oidc:
            client-id: ${OIDC_CLIENT_ID:gateway}
            # Never defaulted. A gateway that starts with a placeholder secret
            # is a gateway that authenticates against nothing and looks fine.
            client-secret: ${OIDC_CLIENT_SECRET}
            # offline_access is NOT requested, and the claim that it "makes
            # the refresh-token filter useful" was wrong twice over.
            #
            # It does not do that. OAuth2ReactiveRefreshTokensWebFilter goes
            # through ReactiveOAuth2AuthorizedClientManager, which refreshes
            # with the ORDINARY refresh token the authorization-code flow
            # already returns. offline_access buys nothing there.
            #
            # What it actually asks for is an OFFLINE token: a refresh token
            # that outlives the SSO session and survives logout, meant for
            # daemons acting for an absent user. This gateway holds a browser
            # session, so that is the wrong shape and a real downgrade -- it
            # would quietly undo accessTokenLifespan and the ssoSession bounds
            # the realm sets, and blunt the reasoning in T-3.5 that a relayed
            # access token is only useful for as long as it lives.
            #
            # It also could not have worked. Keycloak refuses to mint an
            # offline token unless the USER holds the offline_access realm
            # role, and imported users hold no default roles at all: the
            # importer calls addUser(..., addDefaultRoles = false), so
            # default-roles-<realm>, which is what normally carries it, is
            # never granted. The client-scope half was assigned and the
            # authorization request passed; the token exchange then failed with
            #   CODE_TO_TOKEN_ERROR ... "Offline tokens not allowed for the
            #   user or client"
            # which is a Keycloak event-log line and nothing else -- Spring
            # reports it to the browser as a bare redirect to /login?error.
            #
            # The client keeps offline_access in its optionalClientScopes. That
            # assignment is correct on its own terms and costs nothing; this is
            # about not ASKING for it.
            #
            # `api` is gone. The comment here said the realm defines it for
            # reaching the core service; the realm does not define it at all,
            # and deliberately carries no clientScopes block (see the note above
            # `clients:` in the realm import). Keycloak rejects an authorization
            # request naming a scope the client does not have, with
            # invalid_scope -- delivered as a redirect BACK to the application
            # rather than an error page, so it reads as a login that silently
            # refused rather than as a configuration fault.
            #
            # Nothing consumed it. Authorization is carried by
            # realm_access.roles (app-user / app-admin) and the audience by the
            # client's own protocol mapper, which was moved off this scope
            # precisely because the import dropped the scope's mappers.
            scope: openid, profile, email
  task:
    execution:
      thread-name-prefix: gateway-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: gateway-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true

server:
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  api-docs:
    # 3.0, not the 3.1 springdoc emits by default (T-3.11).
    #
    # A spec nothing can consume is not a published contract. openapi-generator 7.x still has
    # incomplete OpenAPI 3.1 support: against a 3.1 document it fails to resolve every component
    # schema and generates nothing, with errors that name the schemas rather than the version.
    # 3.0.1 is what the generator ecosystem actually handles.
    version: openapi_3_0
  show-actuator: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  mail:
    from: gateway@localhost
  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: Gateway API
    description: Gateway API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  security:
    # Stated here rather than inherited from JHipster's default, which had no
    # connect-src at all.
    #
    # connect-src falls back to default-src when absent, and default-src is
    # 'self', so the browser refused every XHR to an origin that is not this
    # one. That includes the presigned PUT straight to object storage in T-3.7 --
    # blocked here, before the request leaves the browser, and so before the
    # bucket's CORS policy is ever consulted. Two independent gates on the same
    # upload, failing in the same unhelpful way in the network tab; fixing the
    # bucket alone changes nothing.
    #
    # The object-storage origin is the only addition, and it is overridable so
    # staging and prod name their own rather than inheriting dev's.
    #
    # https://storage.googleapis.com is REMOVED from script-src. It is a
    # generator default, this application loads no script from Google, and its
    # presence made the policy look as though object storage had been thought
    # about here when it had not.
    #
    # No 'unsafe-inline' and no 'unsafe-eval' (T-3.14). These were JHipster's
    # defaults, kept for one day while T-3.13 had not chosen a framework and
    # dropping them might have broken whatever it picked.
    #
    # The frontend that exists needs none of them, and unlike before that is
    # checkable rather than assumed: no inline <script> and no inline style= in
    # index.html, no eval( and no new Function in app.js, and no build step or
    # dependency that could reintroduce either.
    #
    # 'unsafe-inline' on script-src is what turns one injection point into
    # script execution. This page holds a live session cookie and echoes back
    # filenames chosen by whoever uploaded them. Rows are built with DOM calls
    # precisely so a filename cannot become markup -- but that is one defence,
    # in one function, kept correct by hand. This is the one that does not
    # depend on remembering.
    #
    # Nothing else served by this chain is affected: /swagger-ui/** and the
    # other asset paths are excluded by securityMatcher, so they never receive
    # this header at all.
    content-security-policy: >-
      default-src 'self';
      frame-src 'self' data:;
      script-src 'self';
      style-src 'self';
      img-src 'self' data:;
      font-src 'self' data:;
      connect-src 'self' ${DOCUMENTS_PUBLIC_ENDPOINT:https://fsn1.your-objectstorage.com}
    oauth2:
      audience:
        # Checked by security/oauth2/AudienceValidator. These must match the
        # `aud` claim Keycloak actually puts in the token, or every request is
        # rejected with a valid-looking token.
        #
        # `account` is Keycloak's built-in audience and is present by default;
        # `gateway` is this client. Okta's api://default is removed -- keeping a
        # foreign audience in the accepted list widens what this gateway trusts
        # for no reason.
        - account
        - gateway


