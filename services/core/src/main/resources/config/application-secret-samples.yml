# ===================================================================
# Configuration for the "secret-samples" profile.
#
# ACTIVATED AUTOMATICALLY BY THE dev PROFILE. application.yml puts
# secret-samples in the `dev` profile group, so everything here silently
# overrides application.yml whenever you run in dev.
#
# As generated it pointed at JHipster's sample realm:
#
#   issuer-uri: http://localhost:9080/realms/jhipster
#   client-id: internal
#
# which meant a correctly configured application.yml still failed to start with
# "Unable to resolve Configuration with the provided Issuer", naming a realm
# nobody had configured. The same trap exists in the gateway.
# ===================================================================

spring:
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME:core}
    # No default. The real value is SOPS-encrypted in the cluster
    # (platform/envs/dev/secrets/core-db.yaml); locally, export it.
    password: ${SPRING_DATASOURCE_PASSWORD}
  security:
    oauth2:
      client:
        provider:
          oidc:
            # Must match Keycloak's configured hostname exactly: that value is
            # what lands in every token's `iss` claim, whichever host the
            # request arrived on.
            issuer-uri: ${OIDC_ISSUER_URI:https://auth-dev.xenopsoftware.com/realms/xenopsbase}

        # NO client registration. The core service is a resource server: it
        # validates tokens the gateway relays and never starts a login of its
        # own. Declaring a registration makes Spring build an OAuth2 client,
        # and startup then dies inside OAuth2ClientConfiguration rather than
        # saying anything about credentials.
        #
        # If the core ever needs to CALL another service on its own behalf,
        # that is a client-credentials registration added deliberately -- not
        # this leftover sample.
