# ===================================================================
# Spring Boot configuration for the "prod" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    com.xenopsoftware.core: INFO

management:
  prometheus:
    metrics:
      export:
        enabled: false
  zipkin: # Use the "zipkin" Maven profile to have the Spring Cloud Zipkin dependencies
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0 # report 100% of traces

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://localhost:5432/core
    hikari:
      poolName: Hikari
      auto-commit: false
      # Every wait bounded (T-3.9). Hikari's own defaults are mostly sane; they
      # are restated because an unset value here is invisible, and the one that
      # matters most has no default at all -- see the statement timeout below.
      #
      # How long a thread waits for a connection from the pool before failing.
      # Failing fast is the point: a request that cannot get a connection within
      # a few seconds has already lost, and waiting only adds another stuck
      # thread to the pile.
      connection-timeout: 5000
      validation-timeout: 3000
      # Below the typical 15-minute idle timeout of a cloud load balancer or NAT,
      # so the pool discards a connection before the network silently does.
      # Otherwise the first query on a reused connection hangs until the socket
      # timeout, long after the request that owned it gave up.
      max-lifetime: 600000
      idle-timeout: 300000
      maximum-pool-size: 20
      minimum-idle: 5
      data-source-properties:
        # THE important one. Postgres will run a query until it finishes or the
        # client disconnects -- there is no default limit. A single pathological
        # query with no timeout holds its connection indefinitely, and enough of
        # them exhaust the pool while every health check still passes.
        #
        # Applied as a server-side setting so it binds the DATABASE's work, not
        # merely the driver's patience. A JDBC socket timeout abandons the client
        # side and leaves the query running.
        options: "-c statement_timeout=30000 -c idle_in_transaction_session_timeout=60000"
        # Client-side backstop for a connection that has gone away entirely, where
        # the server-side timeout can never fire because nothing is listening.
        socketTimeout: 45
        connectTimeout: 5
        tcpKeepAlive: true
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Fail rather than guess. Without this, Flyway will happily
    # "baseline" a database that already has tables it did not create,
    # silently adopting an unknown schema as version 1.
    baseline-on-migrate: false
    validate-on-migrate: true
  thymeleaf:
    cache: true

# ===================================================================
# To enable TLS in production, generate a certificate using:
# keytool -genkey -alias core -storetype PKCS12 -keyalg RSA -keysize 2048 -keystore keystore.p12 -validity 3650
#
# You can also use Let's Encrypt:
# See details in topic "Create a Java Keystore (.JKS) from Let's Encrypt Certificates" on https://maximilian-boehm.com/en-gb/blog
#
# Then, modify the server.ssl properties so your "server" configuration looks like:
#
# server:
#   port: 443
#   ssl:
#     key-store: classpath:config/tls/keystore.p12
#     key-store-password: password
#     key-store-type: PKCS12
#     key-alias: selfsigned
#     # The ciphers suite enforce the security by deactivating some old and deprecated SSL cipher, this list was tested against SSL Labs (https://www.ssllabs.com/ssltest/)
#     ciphers: TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384 ,TLS_DHE_RSA_WITH_AES_128_GCM_SHA256 ,TLS_DHE_RSA_WITH_AES_256_GCM_SHA384 ,TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384,TLS_DHE_RSA_WITH_AES_128_CBC_SHA256,TLS_DHE_RSA_WITH_AES_128_CBC_SHA,TLS_DHE_RSA_WITH_AES_256_CBC_SHA256,TLS_DHE_RSA_WITH_AES_256_CBC_SHA,TLS_RSA_WITH_AES_128_GCM_SHA256,TLS_RSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_128_CBC_SHA256,TLS_RSA_WITH_AES_256_CBC_SHA256,TLS_RSA_WITH_AES_128_CBC_SHA,TLS_RSA_WITH_AES_256_CBC_SHA,TLS_DHE_RSA_WITH_CAMELLIA_256_CBC_SHA,TLS_RSA_WITH_CAMELLIA_256_CBC_SHA,TLS_DHE_RSA_WITH_CAMELLIA_128_CBC_SHA,TLS_RSA_WITH_CAMELLIA_128_CBC_SHA
# ===================================================================
server:
  port: 8081
  shutdown: graceful # see https://docs.spring.io/spring-boot/reference/web/graceful-shutdown.html#web.graceful-shutdown
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  http:
    cache: # Used by the CachingHttpHeadersFilter
      timeToLiveInDays: 1461
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:

application:
  storage:
    # Hetzner Object Storage. Bucket and endpoint come from the environment so the
    # same image runs in staging and prod without a rebuild; there is deliberately
    # no default, because a wrong default here writes documents to another
    # environment's bucket and nothing would report an error.
    bucket: ${DOCUMENTS_BUCKET}
    endpoint: ${DOCUMENTS_ENDPOINT}
