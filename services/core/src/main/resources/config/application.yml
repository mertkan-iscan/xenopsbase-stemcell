# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
feign:
  circuitbreaker:
    enabled: true
  # client:
  #   config:
  #     default:
  #       connectTimeout: 5000
  #       readTimeout: 5000
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
          - flyway
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    jhimetrics:
      access: read-only
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      # SCOPED, not `all: true` (T-2.12, #155).
      #
      # `all: true` asks Micrometer for a full bucket histogram on EVERY timer
      # and distribution summary. Each one becomes roughly 30-70 additional
      # series, and it applies to meters nobody reads -- Spring Data repository
      # timers, task executors, the lot. While the registry was switched off
      # this cost nothing, because nothing was exported. Turning the registry on
      # without narrowing it first is how a metrics fix becomes a Prometheus
      # incident.
      #
      # Histograms are for the meter that has an SLO attached to it, which here
      # is the one the load baseline (T-5.6) will be written against.
      percentiles-histogram:
        http.server.requests: true
      # Client-side percentiles on everything else. These are cheap -- one
      # series per quantile, pre-computed in the process -- but they cannot be
      # aggregated across replicas, which is the reason the histogram above
      # exists for the metric that matters.
      percentiles:
        all: 0.5, 0.95, 0.99
    data:
      repository:
        autotime:
          enabled: true
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: core
  # VIRTUAL THREADS (T-9.8, JEP 444 / JEP 491).
  #
  # These services block by design: JPA, JDBC, and a RestClient hop between
  # services. That is a deliberate choice -- the reactive programming model is
  # confined to the gateway, where Spring Cloud Gateway requires it -- and
  # virtual threads are what make a blocking model scale without changing it.
  #
  # WHY NOW AND NOT BEFORE. Java 25 removed the carrier-thread pinning that
  # `synchronized` used to cause (JEP 491). Before that, any blocking call inside
  # a synchronized block pinned a platform thread and the benefit evaporated
  # exactly where it was needed most -- inside libraries nobody here controls.
  #
  # THE OPERATIONAL CONSEQUENCE, STATED RATHER THAN DISCOVERED. Tomcat's
  # 200-thread pool WAS the admission control. It is gone: every accepted request
  # now gets a thread, because a virtual thread costs almost nothing. The queue
  # does not disappear, it MOVES -- to hikari.maximum-pool-size, which is now a
  # capacity decision rather than a courtesy to Postgres. See the note there
  # (application-prod.yml): that number times the HPA ceiling is what the
  # database sees, and check-connection-budget.sh is what fails when the three
  # numbers stop adding up.
  #
  # It also interacts with T-9.6: the outbox relay draws from the same pool on a
  # schedule. One connection every two seconds per replica, and only the replica
  # holding the advisory lock actually uses it.
  #
  # WHAT IS ASSERTED, because it is the part that fails silently:
  # TaskDecoratorSurvivesVirtualThreadsTest. Boot builds the virtual-thread
  # executor through a different auto-configuration path than the pooled one, so
  # a TaskDecorator can quietly stop being applied -- and the symptom is an
  # @Async method losing its request context, not an error.
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      # Off, and it must be. The generated compose files were deleted in T-3.2
      # because they shipped their own Postgres, Keycloak, Grafana and Prometheus
      # duplicating what the cluster already runs. Left enabled, the application
      # refuses to start:
      #
      #   'files' content [src\main\docker\postgresql.yml] must exist
      #
      # Postgres comes from CloudNativePG (T-2.4), not from a compose file.
      enabled: false
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: '@spring.profiles.active@'
    group:
      dev:
        - secret-samples
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- tls
  jmx:
    enabled: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
    # Valkey, for the business cache only (T-3.22, #264). Nested under the
    # existing spring.data rather than a second `data:` key, which YAML would
    # resolve last-wins and silently drop the JPA settings above.
    #
    # No default host, deliberately: an unset CACHE_VALKEY_HOST with caching ON
    # fails at startup naming the variable, rather than resolving to localhost
    # and turning every cache operation into a logged warning nobody reads.
    #
    # This must point at the CACHE instance, never the one holding sessions.
    # T-2.19 (#262) split them precisely so a cache cannot evict a session, and
    # pointing this at the wrong one rebuilds the failure that card prevented.
    redis:
      host: ${CACHE_VALKEY_HOST:}
      port: ${CACHE_VALKEY_PORT:6379}
      password: ${CACHE_VALKEY_PASSWORD:}
      # Bounded like every other outbound call (T-3.9). An unreachable cache must
      # fail fast and fall through to Postgres, not hold the request thread.
      timeout: 500ms
      connect-timeout: 500ms
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.timezone.default_storage: NORMALIZE
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      # modify batch size as necessary
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        provider:
          oidc:
            # The core service is a RESOURCE SERVER: it never starts a login, it
            # only validates tokens the gateway relays inward. SecurityConfiguration
            # reads this property directly, so leaving it unset fails at startup.
            #
            # Must be the public issuer, because that is the value Keycloak puts
            # in every token's `iss` claim regardless of which host the request
            # arrived on. Pointing this at the in-cluster Service name would
            # reject every relayed token while looking correctly configured.
            issuer-uri: ${OIDC_ISSUER_URI:https://auth-dev.xenopsoftware.com/realms/xenopsbase}
  task:
    execution:
      thread-name-prefix: core-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: core-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true

server:
  # `framework`, and in the base file rather than only in dev.
  #
  # This service never receives a request directly -- the gateway is the only
  # caller -- so every absolute URL it builds has to come from the forwarded
  # headers or it describes the wrong origin. Pagination Link headers are the
  # visible case: without this they named https://core/api/... , the in-cluster
  # Service, which no browser can resolve.
  #
  # NOT `native`, which is what the dev profile used to set. Native delegates to
  # the servlet container, and the container understands X-Forwarded-Proto, Host
  # and Port but NOT X-Forwarded-Prefix. The gateway strips /services/core
  # before proxying, so the prefix is exactly the part that has to be restored,
  # and native is the one strategy that cannot restore it. `framework` uses
  # Spring's ForwardedHeaderFilter, which handles all four.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  api-docs:
    # 3.0, not the 3.1 springdoc emits by default (T-3.11).
    #
    # A spec nothing can consume is not a published contract. openapi-generator 7.x still has
    # incomplete OpenAPI 3.1 support: against a 3.1 document it fails to resolve every component
    # schema and generates nothing, with errors that name the schemas rather than the version.
    # 3.0.1 is what the generator ecosystem actually handles.
    version: openapi_3_0
  show-actuator: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  mail:
    from: core@localhost
  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: Core API
    description: Core API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  security:
    oauth2:
      audience:
        # Must match the `aud` claim Keycloak actually issues, or every relayed
        # token is rejected by AudienceValidator while looking valid.
        #
        # NARROWED TO THIS SERVICE'S OWN NAME (T-9.4), and that is the point.
        #
        # It was `account, gateway`, which meant this service accepted any token
        # the realm issued for the gateway -- and so would every other service
        # added behind it. Every service trusted every relayed token identically,
        # so "this token is for core" was not something the system could say, let
        # alone check. A token minted for one service was replayable against
        # another, and nothing anywhere would have noticed.
        #
        # `core` is now put on the token by an oidc-audience-mapper on each client
        # whose tokens reach here -- gateway, for relayed user tokens, and
        # smoke-tests, for the tests that call this service directly. Adding a
        # service means adding a mapper there, not widening this list.
        #
        # `account` is gone with the rest. It is Keycloak's own built-in audience,
        # present on every token the realm issues to anyone, so accepting it is
        # accepting the realm rather than accepting this service's callers.
        #
        # Env-overridable so a fork can widen it during a migration without a
        # rebuild -- deliberately awkward to do permanently.
        - ${OIDC_AUDIENCE:core}


---
# ===================================================================
# Service-to-service calls (T-9.4)
#
# INERT BY DEFAULT, and that is the shipped state: this template has one
# service, which calls nothing. ServiceTokens reports itself unconfigured and
# ServiceCalls refuses rather than silently calling with no credential.
#
# To turn it on in a fork: give the service a svc-<name> client in the realm,
# set the two values below from the environment, and list the services it may
# reach. `endpoints` is a NAME to URL map rather than free-form URLs at the call
# site, because a relay that takes a URL from a caller is a request-forgery
# hole.
# ===================================================================
platform:
  # The transactional outbox's delivery half (T-9.6, ADR-0018).
  #
  # UNTIL NOW NOTHING DRAINED IT. OutboxService wrote messages in the same
  # transaction as the change they announce -- that half was real and tested --
  # and OutboxRelay.relayBatch() was called by nothing, in any environment,
  # since the table was created. The mechanism reported success and delivered
  # nothing.
  outbox:
    relay:
      # ON by default, which is the opposite of how the other seams here
      # default. An outbox that records and never delivers is not a disabled
      # feature, it is a broken one.
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      # fixedDelay, measured from the END of the previous pass, so the relay
      # cannot race itself when a drain runs long.
      delay: ${OUTBOX_RELAY_DELAY:PT2S}
      initial-delay: ${OUTBOX_RELAY_INITIAL_DELAY:PT10S}
    # `logging` or `nats`. The default writes a log line, so a fork with no
    # broker still builds, starts and passes its tests -- and the local stack
    # and the cluster both set this to `nats`.
    publisher: ${OUTBOX_PUBLISHER:logging}
    # Only meaningful when two products share one broker: without a prefix,
    # this template and xenopsbase-learn would both publish
    # `platform.probe.initiated` to the same subject and each would receive the
    # other's messages.
    subject-prefix: ${OUTBOX_SUBJECT_PREFIX:}
  service-auth:
    # Defaults to this service's own issuer, because a service that accepts
    # tokens from one realm while obtaining them from another is a
    # misconfiguration nothing would report.
    token-uri: ${SERVICE_AUTH_TOKEN_URI:${OIDC_ISSUER_URI:http://localhost:9080/realms/xenopsbase}/protocol/openid-connect/token}
    client-id: ${SERVICE_AUTH_CLIENT_ID:}
    client-secret: ${SERVICE_AUTH_CLIENT_SECRET:}
  services:
    endpoints: {}

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:

# ===================================================================
# Application-specific properties
# ===================================================================
application:
  # Valkey as a business cache (T-3.22, #264; ADR-0011).
  #
  # OFF unless a deployment turns it on, for the same reason `storage.bucket` is
  # unset below: a fork that does not want a cache should carry no cache
  # configuration rather than a disabled one. With this false there is no cache
  # manager and no eviction listener, and the cached read path is a plain query.
  cache:
    enabled: ${CACHE_ENABLED:false}

  # Document storage over the S3 API (T-3.7).
  #
  # bucket and endpoint are intentionally UNSET here. Without them the storage
  # beans are not created at all (see StorageConfiguration), so a fork that does
  # not need documents carries no S3 client and no dead configuration. Set them
  # per profile.
  #
  # Credentials are NOT here and must not be: the SDK reads AWS_ACCESS_KEY_ID and
  # AWS_SECRET_ACCESS_KEY from the environment, which is how the platform already
  # delivers them, and keeps them out of anything that gets logged or committed.
  storage:
    region: us-east-1
    path-style-access: true
    # A presigned URL is a bearer credential -- whoever holds it can read or write
    # that object with no further authentication. It ends up in browser history,
    # proxy logs and pasted links, so its blast radius is bounded by how soon it
    # expires and by nothing else.
    presign-ttl: 15m
    max-upload-bytes: 52428800
  infra:
    # Where the operations view reads container, volume and node usage from
    # (T-3.16). Blank on purpose: a localhost default would make an
    # unconfigured deployment render a dashboard full of zeroes, and "the
    # cluster is idle" must not look like "the query never arrived".
    prometheus-url: ${PROMETHEUS_URL:}
    # Short. This is a convenience view, and a Prometheus that has gone slow
    # must not be able to tie up threads in the service that serves documents.
    timeout: 5s
    # Several scrape intervals wide. rate() over too few samples returns
    # nothing at all, which reads as a container using exactly zero CPU.
    cpu-window: 5m
