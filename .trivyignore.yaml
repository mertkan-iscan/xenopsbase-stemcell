# Findings that cannot fail the platform image scan, and why (T-6.10, #332).
#
# HOW THIS FILE IS USED, WHICH IS NARROWER THAN THE FILENAME SUGGESTS
#
# It is passed ONLY to the gating step of security.yml's `platform image` job.
# The reporting step does not read it, so everything below still reaches the
# Security tab and is still counted in the run's output. Nothing here
# disappears -- it stops failing a build, which is a smaller thing than being
# ignored.
#
# It is NOT applied to the `image` job. Findings in core and gateway are ours to
# fix: we choose the base image and we rebuild on demand.
#
# THE RULE FOR ADDING ONE
#
# Trivy's `ignore-unfixed` filters on whether a fixed PACKAGE exists. For an
# image this repository does not build, the question that decides whether anyone
# here can act is whether a fixed IMAGE exists, and those are not the same. The
# gap between them belongs to the image publisher, and a gate that fires inside
# it is red for something nobody here can resolve -- which security.yml's own
# header explains is how a check stops being read.
#
# So an entry is justified only when BOTH hold:
#
#   1. no rebuilt image exists to repin to -- checked, not assumed
#   2. the finding is recorded here with the version that would clear it
#
# If a rebuilt image exists, the answer is to repin. That is what happened to
# THREE images rather than one: valkey in the change that created this file, and
# keycloak and tempo in the change that rewrote it. Between them those repins
# cleared 3 CRITICALs and 58 HIGHs that would otherwise be sitting here as
# exceptions.
#
# WHY THIS IS NOW YAML, AND WHAT THAT BUYS
#
# The plain `.trivyignore` was a list of bare CVE IDs. #332 said of it: there is
# no expiry mechanism here, so the card stays open as the thing that makes
# someone look again -- and an entry with no card behind it is how a documented
# exception becomes a permanent one.
#
# Trivy's YAML ignore file has `expired_at`. An entry past its date stops being
# ignored and the gate goes red again, so the re-examination happens whether or
# not anybody remembers to do it. That is a mechanism rather than an intention,
# and it is why this file changed format.
#
# EVERY DATE BELOW IS THE SAME, AND IS NOT A PREDICTION
#
# 2026-10-29, sixty days out. It is not a guess about when any publisher will
# rebuild -- it is the day this file gets read again. Per-entry estimates would
# be inventing precision nobody has, and staggering them would spread the same
# work over more red builds.
#
# WHEN ONE EXPIRES, THE JOB IS NOT TO PUSH THE DATE OUT. Re-scan the image, and:
#
#   the finding is gone       -> delete the entry
#   a rebuilt image exists    -> repin, then delete the entry
#   still nothing to repin to -> re-verify the evidence line, then move the date
#
# The scheduled scan runs Mondays, so a lapse surfaces within a week of the date
# rather than whenever somebody next pushes.

vulnerabilities:
  # -----------------------------------------------------------------------
  # curl -- c-ares, use-after-free / double-free. HIGH.
  #
  # curlimages/curl ships c-ares 1.34.6-r0; the fix is 1.34.8-r0.
  #
  # RE-VERIFIED 2026-08-30 by scanning the pinned digest: still 1.34.6-r0, and
  # the tag still resolves to sha256:7c12af72... -- byte for byte the digest
  # pinned in core.yaml and gateway.yaml. There is no newer image, so repinning
  # is not available as a response.
  #
  # Reachability, for whoever revisits this: the initContainer makes exactly one
  # HTTPS GET to the cluster's own OIDC issuer, in a loop, and exits. It
  # resolves one hostname the platform controls. That is not an argument that
  # the finding does not matter -- it is the context for deciding how hard to
  # push on it.
  - id: CVE-2026-33630
    statement: >-
      c-ares 1.34.6-r0 in curlimages/curl; fixed in 1.34.8-r0. Re-verified
      2026-08-30: the tag still resolves to the pinned digest, so there is no
      rebuilt image to repin to.
    expired_at: 2026-10-29

  # -----------------------------------------------------------------------
  # curl and valkey -- OpenSSL, denial of service via unbounded allocation.
  # HIGH.
  #
  # Affects both digest-pinned Alpine images, as libcrypto3 and libssl3, and on
  # valkey as openssl too. The fix is 3.5.8-r0 and both carry 3.5.7-r0.
  #
  # RE-VERIFIED 2026-08-30 by scanning both pinned digests: 3.5.7-r0 in each,
  # unchanged since this entry was written. It survived the valkey repin rather
  # than being fixed by it, which is the clearest demonstration in this file
  # that a fix existing and a fix being available to us are different questions.
  - id: CVE-2026-14456
    statement: >-
      OpenSSL 3.5.7-r0 in curlimages/curl and valkey/valkey; fixed in 3.5.8-r0.
      Re-verified 2026-08-30 against both pinned digests; neither carries
      3.5.8-r0 and there is no rebuilt image to repin to.
    expired_at: 2026-10-29

