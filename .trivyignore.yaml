  # -----------------------------------------------------------------------
  # keycloak -- mssql-jdbc. HIGH. The odd one out in this file.
  #
  # This is the ONLY entry not waiting on a publisher rebuild, and the only one
  # where the version arithmetic does not mean what it looks like. Keycloak
  # 26.7.2 bundles com.microsoft.sqlserver:mssql-jdbc 13.2.1, and the advisory's
  # fixed-version list is:
  #
  #   10.2.4.jre11, 11.2.4.jre11, 12.2.1.jre11, 12.6.5.jre11, 12.8.2.jre11,
  #   12.10.2.jre11, 13.2.1.jre11
  #
  # Every entry carries a .jre11 classifier and the bundled jar does not, so the
  # comparison never matches -- including against 13.2.1.jre11, which is the
  # same release as what is installed. No repin can satisfy this, because there
  # is no version of the artefact whose name would match.
  #
  # Second, and independently: this platform runs PostgreSQL (CloudNativePG).
  # The SQL Server driver ships in the Keycloak distribution and is never
  # loaded. That is context for how hard to push, not the reason for the entry.
  #
  # Kept on the same date as everything else. If Keycloak drops the bundled
  # driver, or trivy's matcher learns the classifier, this disappears on its own
  # and the entry should go with it.
  - id: CVE-2025-59250
    statement: >-
      mssql-jdbc 13.2.1 bundled in keycloak 26.7.2. Every fixed version in the
      advisory carries a .jre11 classifier the bundled jar does not, including
      13.2.1.jre11 -- the same release as installed -- so no repin can satisfy
      the match. The driver is unused; this platform runs PostgreSQL.
    expired_at: 2026-10-29

# THE GATE SCANS FOR SECRETS TOO, WHICH IS EASY TO FORGET
#
# The trivy action runs vuln AND secret scanning by default, and the gating step
# does not narrow it. So the platform image gate can fail on something that is
# not a CVE at all -- and did: postgresql was red for a private key long after
# its 36 package findings were accounted for. #332's own table recorded that as
# "36 HIGH + 1 HIGH" and the second number is this, not an OS package.
#
# Keep this section. Narrowing the gate to `scanners: vuln` would have been the
# quick way to green and would have thrown away secret detection across all six
# images to silence one known-benign file.
secrets:
  # -----------------------------------------------------------------------
  # postgresql -- Debian's snakeoil key. HIGH.
  #
  # /etc/ssl/private/ssl-cert-snakeoil.key is the self-signed placeholder the
  # Debian `ssl-cert` package generates in its own postinst, at image build
  # time. Trivy is right that it is an asymmetric private key; it is wrong that
  # it is a secret. It is not a credential anybody issued, it grants access to
  # nothing, and it is regenerated per build rather than shared between them.
  # The finding's own provenance says so: "added by RUN |2 PG_VERSION=18.4".
  #
  # SCOPED BY PATH, deliberately. Ignoring the `private-key` rule outright would
  # mean a real key committed into any of the six images scans clean. This
  # suppresses one file in one location and nothing else.
  #
  # THE LEADING SLASH IS LOAD-BEARING. `etc/ssl/...` matches nothing and the
  # finding comes straight back; trivy compares against the path as it reports
  # it, which is absolute. Measured both ways -- the relative form failed the
  # gate and looked exactly like a correct entry.
  #
  # Dated like everything else, though this one will be renewed rather than
  # resolved: the key is inherent to the Debian base and no rebuild removes it.
  # The thing worth re-checking on the date is that the path still matches and
  # that it is still the only secret finding.
  - id: private-key
    paths:
      - /etc/ssl/private/ssl-cert-snakeoil.key
    statement: >-
      Debian ssl-cert snakeoil placeholder in cloudnative-pg/postgresql,
      generated at image build time by the package postinst. Not an issued
      credential and grants access to nothing. Scoped to this one path so a real
      key elsewhere still fails the gate.
    expired_at: 2026-10-29
