  # -----------------------------------------------------------------------
  # postgresql -- util-linux, Debian trixie. 36 findings, 4 distinct CVEs.
  #
  # ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie carries util-linux
  # 2.41-5 across nine packages -- bsdutils, libblkid1, liblastlog2-2,
  # libmount1, libsmartcols1, libuuid1, login, mount, util-linux -- and the fix
  # is 2.41.5-0+deb13u1 in every case. Nine packages times four CVEs is the 36.
  #
  # THE NEWER IMAGE WAS CHECKED AND DOES NOT HELP. 18.6-system-trixie
  # (sha256:b95a2b38...) was scanned on 2026-08-30 and reports the SAME 36
  # findings at the SAME 2.41-5. So this is not a stale pin: cloudnative-pg has
  # not rebuilt against the patched Debian package on either minor.
  #
  # Which is why this is an entry and not a repin. Bumping the database image
  # two minor versions for zero change in findings would be an unrelated
  # PostgreSQL upgrade wearing a security card's name.
  - id: CVE-2026-53612
    statement: >-
      util-linux 2.41-5 in cloudnative-pg/postgresql; fixed in
      2.41.5-0+deb13u1. 18.6-system-trixie scanned 2026-08-30 carries the same
      2.41-5, so a newer minor is not a repin target either.
    expired_at: 2026-10-29
