apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The Keycloak operator.
#
# Chosen over the Helm chart because realm import is a first-class resource
# here: a KeycloakRealmImport CR reconciled from versioned JSON, which is
# exactly what T-2.5 asks for. With the chart, realm import is an initContainer
# and a mounted file, and "no manual admin-console configuration" becomes a
# convention rather than something the platform enforces.
#
# REFERENCES THE RELEASE'S OWN KUSTOMIZATION rather than listing manifests.
#
# Listing them by hand looked tidier and was wrong twice over. 26.7.1 ships FOUR
# CRDs -- keycloaks, keycloakrealmimports, keycloakoidcclients and
# keycloaksamlclients -- and the operator starts an informer for every one of
# them, refusing to start at all if any is missing:
#
#   Informer startup error. Operator will be stopped.
#   .../keycloaksamlclients?resourceVersion=0. Message: Not Found.
#   Failed to start application: Failed to start quarkus
#
# It crash-loops on a CRD for a feature this platform does not even use. The
# upstream kustomization also carries a NamespaceTransformer with
# setRoleBindingSubjects: allServiceAccounts, which a plain `namespace:` here
# does NOT reproduce -- it would leave the ClusterRoleBinding subjects pointing
# at the wrong namespace.
#
# Pinned by ref, so this tracks whatever that release needs rather than whatever
# was true when it was written.
#
# Under components/ because nothing here is environment-specific. The Keycloak
# instance and its realm live per environment.
resources:
  - https://github.com/keycloak/keycloak-k8s-resources//kubernetes?ref=26.7.2
