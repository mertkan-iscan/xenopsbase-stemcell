# The Keycloak instance.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  # One in dev. Keycloak clusters via Infinispan and a second replica buys
  # session survival across a pod restart, not throughput -- and in dev a
  # restart losing sessions costs nothing. Prod runs 2+.
  instances: 1

  # MOVED TO 26.7.2, REVERSING THE LINE THAT WAS HERE (T-6.10, #332)
  #
  # This said "deliberately NOT 26.7.2, which was released the same day this was
  # written. An identity provider is the wrong component to be first on." Both
  # halves turned out to argue the other way.
  #
  # The date was wrong. 26.7.2 was published 2026-08-19, ten days before that
  # comment; the image on quay was rebuilt 2026-08-27. Nobody would have been
  # first on it.
  #
  # And the caution inverts once you read what is in the release. 26.7.2 is a
  # security release carrying seven CVE fixes, two of them account takeover:
  #
  #   CVE-2026-18963  unauthenticated account takeover via a reset-credentials
  #                   flow bypass -- CRITICAL, and what the platform image scan
  #                   flagged against 26.7.1
  #   CVE-2026-15571  account takeover via a predictable account-linking hash
  #
  # "The wrong component to be first on" is an argument about unproven releases.
  # It is not an argument for running an identity provider with a known
  # unauthenticated takeover in it. Measured against the pinned digest, this
  # bump takes the scan from 16 gating findings to 1.
  #
  # WHEN THIS DIGEST MOVES (T-6.9, #330)
  #
  # Together with the operator, never on its own. The operator is pinned by
  # release ref in platform/components/keycloak-operator/kustomization.yaml
  # (`?ref=26.7.2`), and it reconciles this CR against the API and the CRDs of
  # the version it ships. Those two references name one Keycloak version in two
  # files, so a Keycloak upgrade is: change the operator ref, resolve the image
  # for the same tag, move both in one commit.
  #
  #   docker buildx imagetools inspect quay.io/keycloak/keycloak:<tag>
  #
  # Two other places carry this version and are NOT the cluster: infra/dev/
  # compose.yml and infra/load/hpa-local/manifests.yaml, both local rehearsals.
  # They stay on tags on purpose -- a laptop pulling a slightly different build
  # is not a reproducibility claim anyone is relying on -- but they should be
  # moved to the same version so local does not rehearse a different Keycloak.
  #
  # `startOptimized: false` below is required by this line existing at all, so
  # dropping the pin is not a one-line change either. Read that comment first.
  image: quay.io/keycloak/keycloak@sha256:9d1f1b2b7261ff53c66cb1092dfcdc34a5fb77e81f9e6a6e75b8b6a795de8067  # 26.7.2, resolved 2026-08-29

  # Required BECAUSE spec.image is set. Naming an image makes the operator
  # assume it is a custom, pre-built (augmented) image and start it with
  # --optimized. The stock quay.io image is not pre-built, so it exits:
  #
  #   The '--optimized' flag was used for first ever server start. Please don't
  #   use this flag for the first startup or use 'kc.sh build' to build the
  #   server first.
  #
  # Dropping spec.image would also fix it, by letting the operator pick its own
  # default. The pin is kept instead: a rebuild reproducing a DIFFERENT Keycloak
  # than the last one breaks ADR-0002's promise, and that matters more than the
  # few seconds this costs at startup.
  #
  # The real fix for production is a pre-built image produced by the build
  # pipeline (T-6.1), at which point this becomes true again.
  startOptimized: false

  # THE DATABASE POOL, PINNED (T-2.18, #259).
  #
  # Keycloak sets no pool size by default, which means the Quarkus/Agroal
  # default of 100 -- exactly max_connections on the CNPG cluster. So Keycloak
  # alone was entitled to every connection Postgres has, and the only reason
  # that never happened is that its pool never filled.
  #
  # A limit nothing enforces is not a limit. These are counted by
  # infra/scripts/check-connection-budget.sh alongside core's Hikari pool and
  # the HPA ceiling.
  additionalOptions:
    - name: db-pool-max-size
      value: "15"
    # Small and non-zero: Keycloak's database work is bursty around login, and
    # a cold pool adds connection setup to the first authentication after idle.
    - name: db-pool-initial-size
      value: "2"
    - name: db-pool-min-size
      value: "2"

  db:
    vendor: postgres
    # The -rw service follows the primary across a failover. Pointing at a pod
    # name works exactly until the first promotion.
    host: postgres-rw.database.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db
      key: username
    passwordSecret:
      name: keycloak-db
      key: password

  # The initial admin. NEVER the admin/admin default: the operator would
  # otherwise generate one and store it in a secret nobody rotates, and this
  # cluster is reachable from the internet through the tunnel.
  # The secret name MUST NOT be "<Keycloak name>-initial-admin". The operator
  # manages a secret at exactly that name as one of its own dependent
  # resources, and a pre-existing one collides:
  #
  #   KeycloakAdminSecretDependentResource -> secrets "keycloak-initial-admin"
  #   already exists ... code=409
  #
  # The operator then exhausts its retries and NEVER CREATES THE STATEFULSET, so
  # the symptom is no Keycloak pod at all rather than an authentication error.
  bootstrapAdmin:
    user:
      secret: keycloak-bootstrap-admin

  hostname:
    hostname: https://auth-dev.xenopsoftware.com
    # strict: false in dev only. Strict hostname is what stops Keycloak
    # honouring a Host header an attacker controls -- which matters because
    # Keycloak puts that hostname into tokens and password-reset links. Turn it
    # on in staging and prod, where the hostname is stable.
    strict: false

  http:
    # Plain HTTP inside the cluster. TLS is terminated by Cloudflare at the edge
    # (ADR-0006 / T-2.2); the hop from ingress to here is in-cluster. This is
    # the same trade recorded as a known gap in the ingress runbook, and it is
    # what T-8.2's default-deny will revisit.
    httpEnabled: true

  proxy:
    # Keycloak must trust X-Forwarded-* to know the request arrived over HTTPS.
    # Without it, it builds redirect URIs as http:// and the OIDC flow breaks in
    # a way that looks like a client misconfiguration.
    headers: xforwarded

  ingress:
    # The operator's own Ingress is off. Routing is ours: Cloudflare tunnel ->
    # ingress-nginx. Letting the operator also create one would mean two
    # Ingresses for one hostname and no clear owner.
    enabled: false

  # The client secret referenced by the realm import below, injected as an
  # environment variable so it never appears in the realm JSON committed to git.
  # NOTE the shape: the Keycloak CRD defines its own `secret: {name, key}` here
  # rather than accepting the usual valueFrom.secretKeyRef. Using the Kubernetes
  # spelling is rejected at apply time with
  #   .spec.env[0].valueFrom: field not declared in schema
  env:
    - name: GATEWAY_CLIENT_SECRET
      secret:
        name: keycloak-clients
        key: GATEWAY_CLIENT_SECRET

    # THE HEAP, PINNED — AND THE REASON THE REQUEST BELOW IS WHAT IT IS
    # (T-2.26, #340)
    #
    # The stock image sets -XX:MaxRAMPercentage=70, so the heap ceiling was
    # whatever 70% of the memory LIMIT happened to be. That made the two numbers
    # a matched pair that nothing declared: raise the limit and the JVM quietly
    # grants itself a bigger heap; lower it and the JVM can OOM against a
    # ceiling nobody moved on purpose.
    #
    # An absolute -Xmx is chosen over a percentage precisely because it does NOT
    # follow the limit. These two values must be changed together, by someone
    # who has done the arithmetic below, and a percentage would let one move
    # without the other.
    - name: JAVA_OPTS_APPEND
      value: "-Xms256m -Xmx512m"

  # MEASURED, NOT PICKED (T-2.26, #340). `make resource-audit` re-derives it.
  #
  # From the running pod on 2026-08-29, `jcmd 1 GC.heap_info`:
  #
  #   heap committed        184Mi     (live set 87Mi)
  #   metaspace committed   130Mi
  #   pod RSS               550Mi
  #
  #   non-heap  = RSS - committed heap = 550 - 184  = ~360Mi
  #               metaspace, code cache, thread stacks, GC structures, direct
  #               buffers, and the process itself
  #
  #   -Xmx512m  = 2.8x the committed heap, 5.9x the live set. Headroom chosen
  #               against the measurement rather than against the limit
  #   ceiling   = 512 + 360                        = 872Mi
  #   request   = limit = 896Mi, the next round figure above the ceiling
  #
  # WHY THE REQUEST IS NOT 1.25x MEASURED USAGE, WHICH IS THE RULE ELSEWHERE
  #
  # T-2.23 (#306) sets requests at 1.25x measured steady state. That rule is
  # right for a process whose footprint is its working set, and wrong for a JVM:
  # an idle JVM's RSS is a FLOOR that grows toward its heap ceiling and comes
  # back down slowly, so 1.25x an idle reading books a number the process is
  # entitled to exceed by hundreds of megabytes. That is what was here before --
  # 768Mi requested against a heap permitted to reach 896Mi.
  #
  # For a JVM the factor belongs on the HEAP, not on the pod. Pick the heap from
  # the measurement, then the request follows arithmetically. That is the
  # derivation this card asked for.
  #
  # The limit drops 1280 -> 896Mi and the heap ceiling 896 -> 512Mi, so the pod
  # can balloon less than before. The risk that buys: a genuine leak now reaches
  # the ceiling sooner and OOMs rather than growing quietly. That is the correct
  # failure for dev -- the pod restarts and the graph shows it -- but it is a
  # change of behaviour, not only of numbers.
  #
  # CPU is deliberately untouched, for the reason #306 gives: measured draw is
  # single-digit millicores on an idle cluster, and sizing CPU down from a quiet
  # measurement books capacity correctly only for the moment it does not matter.
  resources:
    requests: {cpu: 200m, memory: 896Mi}
    limits: {memory: 896Mi}
