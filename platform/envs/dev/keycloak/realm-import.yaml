# The realm, in git.
#
# This is the whole point of T-2.5: identity that reproduces exactly on a
# rebuilt cluster, because nothing here was ever clicked in the admin console.
# Anything configured by hand is lost on the next rebuild and, worse, is lost
# silently -- the realm still exists, it just quietly lacks the client someone
# added last month.
#
# The stemcell ships the SHAPE of a realm, not a populated one: no users, no
# groups, no identity providers. Those are per-project.
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: xenopsbase
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  realm:
    realm: xenopsbase
    displayName: xenopsbase
    enabled: true

    # Registration and password reset are OFF. A stemcell that ships with self
    # registration enabled is a stemcell that ships an open signup page the
    # first time it is exposed.
    registrationAllowed: false
    resetPasswordAllowed: false
    verifyEmail: false
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false

    # Short access tokens, longer refresh. The gateway relays the access token
    # (T-3.5), so its lifespan bounds how long a leaked one is useful.
    accessTokenLifespan: 300
    ssoSessionIdleTimeout: 1800
    ssoSessionMaxLifespan: 36000

    # Brute-force protection on by default rather than as a later hardening
    # task. It is free, and the alternative is an internet-reachable login form
    # with unlimited attempts.
    bruteForceProtected: true
    failureFactor: 10
    waitIncrementSeconds: 60
    maxFailureWaitSeconds: 900

    roles:
      realm:
        - name: app-user
          description: Ordinary authenticated user of the application.
        - name: app-admin
          description: Administrative access within the application, NOT within Keycloak.

    # `clientScopes`, not `scope`. The realm representation rejects the latter:
    #   .spec.realm.scope: field not declared in schema
    # NO clientScopes BLOCK, DELIBERATELY.
    #
    # Declaring it suppresses Keycloak's creation of its built-in scopes and
    # does not reliably create the replacements either. Keycloak's own import
    # log said so:
    #
    #   Referenced client scope 'roles' doesn't exist. Ignoring
    #   Referenced client scope 'profile' doesn't exist. Ignoring
    #
    # The realm ended up with two scopes, every client's defaultClientScopes
    # pointed at scopes that were never created, and tokens arrived with no
    # preferred_username and no realm_access.roles -- with no error anywhere
    # except that one WARN line.
    #
    # Omitting the block lets Keycloak build profile, email, roles, web-origins,
    # acr and basic itself, which is what every client here needs. A custom
    # scope, if one is ever required, is safer added to a realm that already
    # exists than declared during its creation.

    clients:
      # The gateway: confidential, authorization-code flow. This is the only
      # client that holds a secret.
      - clientId: gateway
        name: API gateway
        enabled: true
        protocol: openid-connect
        publicClient: false
        protocolMappers:
          # WITHOUT THIS, TOKENS CARRY NO `aud` CLAIM AT ALL.
          #
          # Keycloak does not add an audience by itself. The realm can look
          # complete -- clients, roles, scopes all present -- and still issue
          # tokens that every audience-validating service rejects. Verified: a
          # client_credentials token contained only iss, azp, scope, sub, typ,
          # exp, iat and jti, and both services returned 401 for a token that
          # was otherwise perfectly valid.
          #
          # `azp` names the client that ASKED for the token; `aud` names who it
          # is FOR. Validators check aud, because that is what stops a token
          # minted for one service being replayed against another.
          #
          # Attached to the CLIENT, not to the `api` client scope. The scope was
          # tried first and Keycloak's import created the scope while silently
          # dropping its protocolMappers -- the scope existed, the mapper did
          # not, and tokens still had no audience.
          - name: gateway-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: gateway
              id.token.claim: "false"
              access.token.claim: "true"
              introspection.token.claim: "true"
        # Read from the environment at import time, so the secret lives in SOPS
        # (ADR-0003) rather than in this file. The realm JSON in git shows THAT
        # the client has a secret, never what it is.
        secret: ${GATEWAY_CLIENT_SECRET}
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        # WHERE KEYCLOAK MAY SEND THE BROWSER AFTER LOGOUT.
        #
        # Unset, this is not "anywhere" and it is not "unchecked" -- it defaults
        # to the client's redirectUris, which here is the login callback and
        # nothing else. LogoutResource builds post_logout_redirect_uri from the
        # request's Origin header, so it asks for
        #   https://app-dev.xenopsoftware.com
        # and Keycloak answers 400, "Invalid redirect uri".
        #
        # Every earlier step of the logout works, which is what makes it read as
        # a Keycloak fault rather than a missing registration: the gateway
        # session IS invalidated before the browser is sent here, so the user is
        # locally logged out and then shown an error page. Only the SSO session
        # survives.
        #
        # The origin, exactly, with no path and no wildcard. Landing on "/" with
        # no session means the gateway redirects to Keycloak, which no longer has
        # an SSO session either, so the login form is the signed-out state.
        attributes:
          post.logout.redirect.uris: https://app-dev.xenopsoftware.com

        # Deliberately narrow. A wildcard redirect URI turns the authorization
        # code flow into an open redirect and is the single most common way an
        # OIDC setup is broken.
        redirectUris:
          # The path segment is Spring's REGISTRATION ID, not the provider name.
          # This said .../code/keycloak, a JHipster-ism: the gateway registers
          # the provider as `oidc` (spring.security.oauth2.client.registration.oidc,
          # and findByRegistrationId("oidc") in SecurityConfiguration), so Spring
          # builds .../code/oidc from the {registrationId} template.
          #
          # Keycloak then rejects the authorization request with "Invalid
          # parameter: redirect_uri" before any code is issued. Nothing in the
          # cluster reports a fault -- the gateway is healthy, the realm is
          # imported, and login simply never completes. It is only reachable
          # from a browser, which is why it survived until the first deployment.
          - https://app-dev.xenopsoftware.com/login/oauth2/code/oidc
        webOrigins:
          - https://app-dev.xenopsoftware.com
        # `openid` is deliberately absent: it is implicit in OIDC and is not a
        # client-scope object in Keycloak, so listing it here names something
        # that does not exist.
        # MUST list Keycloak's built-ins explicitly, not just the ones we add.
        #
        # Declaring defaultClientScopes REPLACES the realm defaults rather than
        # extending them. Omitting `roles` drops realm_access from the token, so
        # app-user and app-admin never reach the application and every
        # method-level authorization check silently fails open or closed with no
        # error anywhere. Omitting `profile` drops preferred_username, which the
        # gateway uses as the principal name.
        #
        # acr / basic / web-origins are Keycloak internals that other things
        # assume are present; leaving them out breaks CORS and step-up auth in
        # ways that look unrelated.
        # Keycloak's built-ins, which it creates itself. Listed explicitly
        # so a reader can see what each client gets -- `roles` is the one that
        # carries realm_access.roles and therefore all authorization.
        defaultClientScopes:
          - acr
          - basic
          - email
          - profile
          - roles
          - web-origins

        # MUST be declared too, even though offline_access is one of Keycloak's
        # own built-ins and nothing here wants to change it.
        #
        # Declaring defaultClientScopes above unassigns the OPTIONAL scopes as
        # well, not only the default ones. Keycloak's import strips every scope
        # of BOTH kinds from the client as soon as EITHER list is present, then
        # re-adds only what is named. offline_access is an optional built-in, so
        # listing the defaults quietly took it away.
        #
        # Same trap as the paragraph above, one level down, and with no warning
        # in the import log this time -- the scope exists in the realm, it is
        # just no longer attached to this client. The gateway asks for
        # offline_access (application.yml) and Keycloak answers invalid_scope,
        # which comes back as a redirect to the application rather than an
        # error, so the login simply does not complete.
        #
        # Not padded out with the other optional built-ins (address, phone,
        # microprofile-jwt): naming a scope this Keycloak does not create is
        # what produced "Referenced client scope doesn't exist. Ignoring"
        # before. Assign what is used.
        optionalClientScopes:
          - offline_access

      # DEV ONLY. A client that can exchange a username and password directly
      # for a token, so automated tests can authenticate without driving a
      # browser (T-5.5).
      #
      # directAccessGrants is the OAuth2 password grant, which is deprecated for
      # real applications precisely because it hands the user's password to the
      # client. It is acceptable here because this client exists solely for
      # tests, against a throwaway user, in a realm that holds nothing.
      #
      # DO NOT COPY THIS INTO staging OR prod. The realm files there should not
      # contain this client at all.
      - clientId: smoke-tests
        name: Automated smoke tests (dev only)
        enabled: true
        protocol: openid-connect
        publicClient: true
        standardFlowEnabled: false
        directAccessGrantsEnabled: true
        # MUST list Keycloak's built-ins explicitly, not just the ones we add.
        #
        # Declaring defaultClientScopes REPLACES the realm defaults rather than
        # extending them. Omitting `roles` drops realm_access from the token, so
        # app-user and app-admin never reach the application and every
        # method-level authorization check silently fails open or closed with no
        # error anywhere. Omitting `profile` drops preferred_username, which the
        # gateway uses as the principal name.
        #
        # acr / basic / web-origins are Keycloak internals that other things
        # assume are present; leaving them out breaks CORS and step-up auth in
        # ways that look unrelated.
        # Keycloak's built-ins, which it creates itself. Listed explicitly
        # so a reader can see what each client gets -- `roles` is the one that
        # carries realm_access.roles and therefore all authorization.
        defaultClientScopes:
          - acr
          - basic
          - email
          - profile
          - roles
          - web-origins
        protocolMappers:
          # Same reason as the gateway client: without this the token has no
          # `aud` and every resource server rejects it.
          - name: smoke-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: gateway
              id.token.claim: "false"
              access.token.claim: "true"
              introspection.token.claim: "true"

      # The single-page app: public, PKCE. A browser client cannot keep a
      # secret, so it does not get one -- PKCE is what replaces it.
      - clientId: frontend
        name: Frontend application
        enabled: true
        protocol: openid-connect
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        attributes:
          pkce.code.challenge.method: S256
        redirectUris:
          - https://app-dev.xenopsoftware.com/*
        webOrigins:
          - https://app-dev.xenopsoftware.com
        # `openid` is deliberately absent: it is implicit in OIDC and is not a
        # client-scope object in Keycloak, so listing it here names something
        # that does not exist.
        # MUST list Keycloak's built-ins explicitly, not just the ones we add.
        #
        # Declaring defaultClientScopes REPLACES the realm defaults rather than
        # extending them. Omitting `roles` drops realm_access from the token, so
        # app-user and app-admin never reach the application and every
        # method-level authorization check silently fails open or closed with no
        # error anywhere. Omitting `profile` drops preferred_username, which the
        # gateway uses as the principal name.
        #
        # acr / basic / web-origins are Keycloak internals that other things
        # assume are present; leaving them out breaks CORS and step-up auth in
        # ways that look unrelated.
        # Keycloak's built-ins, which it creates itself. Listed explicitly
        # so a reader can see what each client gets -- `roles` is the one that
        # carries realm_access.roles and therefore all authorization.
        defaultClientScopes:
          - acr
          - basic
          - email
          - profile
          - roles
          - web-origins

        # Same reason as the gateway client: naming defaultClientScopes above
        # unassigns the optional built-ins too, and offline_access is one.
        # Assigned here so the browser client can hold a refresh token when
        # T-3.13 needs one, rather than discovering the omission from a
        # redirect carrying invalid_scope.
        optionalClientScopes:
          - offline_access

    # DEV ONLY, and deliberately the only user this realm contains.
    #
    # Exists so the token relay and the smoke suite can authenticate as a
    # PERSON rather than a service account. That distinction matters: the
    # gateway enriches tokens from Keycloak's /userinfo endpoint, which returns
    # 403 for a client-credentials token because a service account has no user
    # profile. A relay that works for one does not prove the other.
    #
    # The password is not a secret in any meaningful sense -- it grants access
    # to an empty dev realm -- but it is still the kind of thing that should
    # never appear in a staging or prod realm file.
    #
    # IMPORTED USERS GET NO DEFAULT ROLES.
    #
    # Not a consequence of naming realmRoles below -- the importer never grants
    # them at all. It calls addUser(..., addDefaultRoles = false) so that the
    # representation is the whole truth, which means default-roles-<realm> is
    # absent and so is everything it composes: offline_access, uma_authorization
    # and the account client roles.
    #
    # So realmRoles here is not "these in addition to the usual ones", it is
    # the COMPLETE set. Anything Keycloak would normally hand a user created
    # through the console or a self-registration is simply missing, and nothing
    # says so -- the user exists, logs in, and gets a token.
    #
    # It surfaces as a capability that fails at the point of use rather than at
    # login. Asking for an offline token was the first instance: the gateway
    # requested offline_access, the client had the scope, the authorization
    # request succeeded, and Keycloak refused at the token endpoint with
    # "Offline tokens not allowed for the user or client" because the USER had
    # no offline_access role. The gateway no longer asks (see application.yml),
    # so nothing here needs that role -- but add it explicitly, or add
    # default-roles-xenopsbase, before relying on anything that does.
    users:
      - username: smoke
        enabled: true
        emailVerified: true
        email: smoke@example.invalid
        firstName: Smoke
        lastName: Test
        credentials:
          - type: password
            value: smoke-dev-only
            temporary: false
        realmRoles:
          - app-user

      # A second dev user, with the admin role, so authorization can be proved
      # in BOTH directions. A 403 for an unprivileged user only shows the check
      # fires; it does not show a privileged user gets through, and a check that
      # denies everyone looks identical to one that works.
      - username: smoke-admin
        enabled: true
        emailVerified: true
        email: smoke-admin@example.invalid
        firstName: Smoke
        lastName: Admin
        credentials:
          - type: password
            value: smoke-dev-only
            temporary: false
        realmRoles:
          - app-user
          - app-admin
