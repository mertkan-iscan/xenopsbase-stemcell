          "username": "globex-admin",
          "enabled": true,
          "emailVerified": true,
          "email": "globex-admin@globex.test",
          "firstName": "Ada",
          "lastName": "Yilmaz",
          "attributes": {
            "tenant_id": [
              "globex"
            ],
            "side": [
              "TENANT"
            ]
          },
          "credentials": [
            {
              "type": "password",
              "value": "globex-admin",
              "temporary": false
            }
          ],
          "realmRoles": [
            "tenant"
          ]
        },
        {
          "id": "00000000-0000-4000-8000-000000000022",
          "username": "globex-learner",
          "enabled": true,
          "emailVerified": true,
          "email": "globex-learner@globex.test",
          "firstName": "Berk",
          "lastName": "Kaya",
          "attributes": {
            "tenant_id": [
              "globex"
            ],
            "side": [
              "TENANT"
            ]
          },
          "credentials": [
            {
              "type": "password",
              "value": "globex-learner",
              "temporary": false
            }
          ],
          "realmRoles": [
            "tenant"
          ]
        }
      ],
      "components": {
        "org.keycloak.userprofile.UserProfileProvider": [
          {
            "name": "declarative-user-profile",
            "providerId": "declarative-user-profile",
            "subComponents": {},
            "config": {
              "kc.user.profile.config": [
                "{\"attributes\": [{\"name\": \"username\", \"displayName\": \"${username}\", \"validations\": {\"length\": {\"min\": 3, \"max\": 255}, \"username-prohibited-characters\": {}, \"up-username-not-idn-homograph\": {}}, \"permissions\": {\"view\": [\"admin\", \"user\"], \"edit\": [\"admin\", \"user\"]}, \"multivalued\": false}, {\"name\": \"email\", \"displayName\": \"${email}\", \"validations\": {\"email\": {}, \"length\": {\"max\": 255}}, \"required\": {\"roles\": [\"user\"]}, \"permissions\": {\"view\": [\"admin\", \"user\"], \"edit\": [\"admin\", \"user\"]}, \"multivalued\": false}, {\"name\": \"firstName\", \"displayName\": \"${firstName}\", \"validations\": {\"length\": {\"max\": 255}, \"person-name-prohibited-characters\": {}}, \"required\": {\"roles\": [\"user\"]}, \"permissions\": {\"view\": [\"admin\", \"user\"], \"edit\": [\"admin\", \"user\"]}, \"multivalued\": false}, {\"name\": \"lastName\", \"displayName\": \"${lastName}\", \"validations\": {\"length\": {\"max\": 255}, \"person-name-prohibited-characters\": {}}, \"required\": {\"roles\": [\"user\"]}, \"permissions\": {\"view\": [\"admin\", \"user\"], \"edit\": [\"admin\", \"user\"]}, \"multivalued\": false}, {\"name\": \"tenant_id\", \"displayName\": \"Tenant\", \"permissions\": {\"view\": [\"admin\", \"user\"], \"edit\": [\"admin\"]}, \"multivalued\": false}, {\"name\": \"side\", \"displayName\": \"Side\", \"permissions\": {\"view\": [\"admin\", \"user\"], \"edit\": [\"admin\"]}, \"multivalued\": false}], \"unmanagedAttributePolicy\": \"ENABLED\"}"
              ]
            }
          }
        ]
      }
    }
