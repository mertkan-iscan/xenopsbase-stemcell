# The xenopslearn login theme (mertkan-iscan/xenopsbase-learn#94).
#
# parent=keycloak rather than parent=base, deliberately.
#
# `base` gives the FreeMarker templates with no styling and, more importantly,
# with every kc*Class property undefined -- so the markup renders with empty
# class attributes and the only way to style it is by element structure. That
# breaks on the next Keycloak upgrade, silently, on the one page nobody can log
# in past.
#
# Inheriting from `keycloak` keeps the class names, the accessibility work and
# the error markup, and `xenops.css` is loaded LAST so it overrides. The cost is
# that we are overriding PatternFly rather than starting clean; the benefit is
# that an upgrade degrades to "slightly off" instead of "unstyled".
parent=keycloak
import=common/keycloak

# ORDER MATTERS AND THIS LIST REPLACES THE PARENT'S.
#
# Theme properties are inherited key by key, so naming `styles` here discards
# whatever the parent said rather than adding to it. `css/login.css` is the
# parent's own file -- resource lookup walks the theme chain, so it still
# resolves -- and dropping it would ship a login page with no PatternFly at all.
styles=css/login.css css/xenops.css
