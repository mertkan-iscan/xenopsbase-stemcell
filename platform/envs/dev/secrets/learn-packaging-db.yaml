# The learn_packaging role's password, read by CNPG (xenopsbase-learn#163).
#
# The username MUST be the role name exactly. CNPG's managed.roles entry in
# database/cluster.yaml names `learn_packaging` and takes the credential from
# here; a username that disagrees creates a role nobody asked for and leaves the
# declared one without a password.
#
# kubernetes.io/basic-auth rather than Opaque, matching the other five: CNPG
# requires that type for a passwordSecret and rejects the role otherwise.
#
# Its twin is learn-packaging-db-app.yaml, the same credential in the `learn`
# namespace, because a Secret does not cross one. Change both or neither.
