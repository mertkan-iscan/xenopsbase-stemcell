# The same credential as learn-identity-db, in the namespace that USES it.
#
# xenopsbase-learn's identity Deployment reads username and password from here
# (`learn-identity-db` in the `learn` namespace) and builds its JDBC URL
# against the shared cluster. The role itself is created by CNPG from the
# database-namespace twin.
#
# Two files rather than one because a Kubernetes Secret does not cross a
# namespace, which is the same shape core-db.yaml and core-db-app.yaml already
# have. THE TWO MUST HOLD THE SAME PASSWORD: if they drift, the role exists
# with one password and the service authenticates with the other, and the only
# symptom is a service that cannot start against a database that is plainly
# there.
