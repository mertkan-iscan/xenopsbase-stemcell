# The learn_identity role's password, read by CNPG (xenopsbase-learn T-9.3).
#
# The username MUST be the role name exactly. CNPG's managed.roles entry in
# database/cluster.yaml names `learn_identity` and takes the credential from
# here; a username that disagrees creates a role nobody asked for and leaves
# the declared one without a password.
#
# kubernetes.io/basic-auth rather than Opaque, matching core-db and
# keycloak-db: CNPG requires that type for a passwordSecret and rejects the
# role otherwise.
#
# Its twin is learn-identity-db-app.yaml, the same credential in the `learn`
# namespace, because a Secret does not cross one. Change both or neither.
