# Valkey authentication (T-2.11, ADR-0009).
#
# A conf fragment rather than a bare password, so it can be `include`d from the
# ConfigMap that holds every other setting. That split is deliberate: the memory
# bound and the eviction policy are security-relevant and belong in a file a
# reviewer can read, while the password does not.
#
# Passing --requirepass as an argument instead would put the password in the
# container's command line, where `kubectl describe pod` and anything reading
# /proc will show it.
