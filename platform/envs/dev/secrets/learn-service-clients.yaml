# The three service-to-service client secrets (xenopsbase-learn T-9.11).
#
# svc-identity, svc-streaming and svc-reporting are confidential clients in the
# xenopslearn realm, and their secrets exist in TWO places that must agree: the
# realm (imported by keycloak/learn-realm-import.yaml) and this Secret, which
# the three Deployments read as SERVICE_CLIENT_SECRET.
#
# IF THEY DISAGREE, every inter-service call is refused because the service
# credential did not verify, and nothing else looks wrong -- the pods are
# Ready, the databases are up, and only the calls between them fail. Change
# both together or neither.
#
# These are learn's development values, carried verbatim from its realm file
# so the two sides match on a first sync. They are named
# "local-development-only-*" there for the same reason they are unremarkable
# here: this is the dev cluster, and a real environment gets generated values
# on both sides at once.
