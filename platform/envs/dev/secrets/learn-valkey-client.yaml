# The cluster's Valkey password, copied into the `learn` namespace.
#
# The SAME value as valkey-client.yaml, which declares it in `apps` for core
# and gateway. A Secret does not cross a namespace and learn's three services
# read the shared cache, so the credential has to exist on both sides. The conf
# fragment is deliberately NOT copied: only Valkey itself needs requirepass,
# and a client namespace holding the server's configuration would be a second
# place for it to drift.
#
# WHY THIS IS NOT OPTIONAL, even though the services start without it: this
# cluster's Valkey sets requirepass, so an unauthenticated client gets NOAUTH on
# every read. Learn's permission cache fails PERMISSIVE when the cache is
# unreachable -- correct behaviour for a cache outage, and exactly wrong here,
# because it turns a missing password into a permission system that quietly
# stops consulting anything.
