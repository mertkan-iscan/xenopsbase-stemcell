# The gateway's OIDC client secret (xenopsbase-learn T-10.2).
#
# `gateway` is a CONFIDENTIAL client in the xenopslearn realm: it is the thing
# that exchanges an authorization code for tokens on a person's behalf, which is
# the whole reason learn's browsers never hold one. That exchange is
# authenticated with this value.
#
# IT EXISTS IN TWO PLACES THAT MUST AGREE: the realm (imported by
# keycloak/learn-realm-import.yaml) and this Secret, which learn's gateway
# Deployment reads as GATEWAY_CLIENT_SECRET. If they disagree, sign-in fails at
# the token exchange -- after the person has already logged in at Keycloak and
# been redirected back, so the browser lands on an error page having apparently
# authenticated successfully. Change both together or neither.
#
# Carried verbatim from that realm file, where it is named
# "local-development-only-gateway-secret" for the same reason it is unremarkable
# here: this is the dev cluster, and it is already in git in plaintext three
# directories away. Encrypting it buys nothing today and buys everything the
# first time an environment has a real one -- what matters is that the file
# lives where secrets live, so nobody has to decide that later.
