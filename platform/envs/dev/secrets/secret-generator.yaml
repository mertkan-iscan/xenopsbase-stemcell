# KSOPS generator. kustomize runs ksops as an exec plugin, which decrypts the
# files listed here at RENDER time inside argocd-repo-server — so nothing
# decrypted is ever stored, only applied.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: sops-secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - cloudflare-api-token.yaml
  - cloudflared-token.yaml
  - pg-backup-s3.yaml
  - keycloak-db.yaml
  - keycloak-db-app.yaml
  - keycloak-admin.yaml
  - keycloak-clients.yaml
  - grafana-admin.yaml
  - loki-s3.yaml
  - core-db.yaml
  - core-db-app.yaml
  - gateway-oidc.yaml
  - documents-s3.yaml
  - valkey-auth.yaml
  - valkey-client.yaml
  - alertmanager-smtp.yaml
