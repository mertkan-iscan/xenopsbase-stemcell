# KSOPS generator. kustomize runs ksops as an exec plugin, which decrypts the
# files listed here at RENDER time inside argocd-repo-server — so nothing
# decrypted is ever stored, only applied.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: sops-secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - cloudflare-api-token.yaml
  - cloudflared-token.yaml
  - pg-backup-s3.yaml
  - keycloak-db.yaml
  - keycloak-db-app.yaml
  - keycloak-admin.yaml
  - keycloak-clients.yaml
  - grafana-admin.yaml
  - loki-s3.yaml
  - core-db.yaml
  - core-db-app.yaml
  - gateway-oidc.yaml
  - documents-s3.yaml
  - valkey-auth.yaml
  - valkey-client.yaml
  - alertmanager-smtp.yaml
  # svc-* client secrets, in `apps`. The realm's copy is in keycloak-clients
  # above; the two must agree (T-9.4).
  - service-clients.yaml

  # xenopsbase-learn (its T-9.3, #11). One role password per service, read by
  # CNPG in `database`; the same credentials again in `learn` because a Secret
  # does not cross a namespace; the service-to-service client secrets that must
  # agree with the xenopslearn realm; and the shared Valkey password copied into
  # `learn`.
  #
  # FIVE PAIRS NOW, not three. Catalog and assessment had been building, testing
  # and publishing images for weeks against databases that did not exist -- which
  # nothing reported, because nothing had ever asked them to start
  # (xenopsbase-learn#143).
  - learn-identity-db.yaml
  - learn-streaming-db.yaml
  - learn-reporting-db.yaml
  - learn-catalog-db.yaml
  - learn-assessment-db.yaml
  - learn-packaging-db.yaml
  - learn-identity-db-app.yaml
  - learn-streaming-db-app.yaml
  - learn-reporting-db-app.yaml
  - learn-catalog-db-app.yaml
  - learn-assessment-db-app.yaml
  - learn-packaging-db-app.yaml
  - learn-service-clients.yaml
  - learn-valkey-client.yaml
  # The gateway's own client secret (learn T-10.2). Not one of the svc-* three
  # above: those authenticate a SERVICE to another service, this one
  # authenticates the exchange of a PERSON's authorization code for tokens.
  - learn-gateway-client.yaml
