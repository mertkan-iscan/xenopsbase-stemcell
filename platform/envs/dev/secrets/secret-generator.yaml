# KSOPS generator. kustomize runs ksops as an exec plugin, which decrypts the
# files listed here at RENDER time inside argocd-repo-server — so nothing
# decrypted is ever stored, only applied.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: sops-secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - cloudflare-api-token.yaml
  - cloudflared-token.yaml
  - pg-backup-s3.yaml
  - keycloak-db.yaml
  - keycloak-db-app.yaml
  - keycloak-admin.yaml
  - keycloak-clients.yaml
  - grafana-admin.yaml
  - loki-s3.yaml
  - core-db.yaml
  - core-db-app.yaml
  - gateway-oidc.yaml
  - documents-s3.yaml
  - valkey-auth.yaml
  - valkey-client.yaml
  - alertmanager-smtp.yaml

  # xenopsbase-learn (its T-9.3, #11). Three role passwords CNPG reads in
  # `database`, the same three credentials again in `learn` because a Secret
  # does not cross a namespace, the service-to-service client secrets that must
  # agree with the xenopslearn realm, and the shared Valkey password copied into
  # `learn`.
  - learn-identity-db.yaml
  - learn-streaming-db.yaml
  - learn-reporting-db.yaml
  - learn-identity-db-app.yaml
  - learn-streaming-db-app.yaml
  - learn-reporting-db-app.yaml
  - learn-service-clients.yaml
  - learn-valkey-client.yaml
