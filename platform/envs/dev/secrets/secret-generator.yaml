# KSOPS generator. kustomize runs ksops as an exec plugin, which decrypts the
# files listed here at RENDER time inside argocd-repo-server — so nothing
# decrypted is ever stored, only applied.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: sops-secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - cloudflare-api-token.yaml
