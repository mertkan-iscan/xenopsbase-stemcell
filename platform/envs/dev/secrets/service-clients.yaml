# Service-to-service client secrets (T-9.4).
#
# `svc-core` is a confidential client in the xenopsbase realm, and its secret
# exists in TWO places that must agree: the realm, imported by
# keycloak/realm-import.yaml from the keycloak-clients Secret, and this Secret,
# which the service Deployments read as SERVICE_CLIENT_SECRET.
#
# IF THEY DISAGREE, every inter-service call is refused -- and nothing else
# looks wrong. The pods are Ready, the databases are up, the gateway serves
# users normally, and only the calls between services fail. There is not even a
# failing request to look at, because the caller never gets a token to make one
# with; Keycloak's token endpoint answers 401 and the caller logs that and moves
# on. Change both together or neither. See docs/runbooks/authorization.md.
#
# WHY THIS IS A SECOND FILE AND NOT A KEY IN keycloak-clients.yaml. A Secret
# does not cross a namespace. keycloak-clients lives in `keycloak`, where the
# realm import reads it; the services live in `apps`. Same value, two objects --
# the same shape gateway-oidc.yaml has for GATEWAY_CLIENT_SECRET, and for the
# same reason.
#
# A dev value, generated for this cluster. A real environment generates both
# sides at once; see docs/runbooks/secrets.md.
