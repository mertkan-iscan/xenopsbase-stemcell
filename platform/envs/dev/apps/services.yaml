# The gateway and core service.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: services
  namespace: argocd
  annotations:
    # Wave 4: after Postgres (2) and Keycloak (3). Core validates its schema
    # against the database at startup and the gateway resolves the OIDC issuer
    # metadata from Keycloak, so starting either earlier just produces a
    # crash loop until its dependency arrives.
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mertkan-iscan/xenopsbase-stemcell.git
    targetRevision: main
    path: platform/envs/dev/services
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      # prune: true, unlike the database and Keycloak. These are stateless --
      # deleting a Deployment from git should remove it, and there is nothing
      # here whose loss is not recoverable by a sync.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

    # ENROL `apps` IN IMAGE POLICY ENFORCEMENT (T-6.2, #49).
    #
    # This is the label that makes T-6.2's scope line true rather than
    # aspirational: "only images this pipeline built may run". Until now no
    # namespace carried it, so the signing policy governed nothing that serves
    # traffic.
    #
    # Argo creates this namespace (CreateNamespace=true above), so the label has
    # to come from here -- there is no Namespace manifest to put it on, and one
    # applied by hand would be lost on the next rebuild.
    #
    # WHAT THIS MAKES POSSIBLE TO BREAK
    #
    # policy-controller denies anything matching NO policy. Every image in this
    # namespace must therefore be covered:
    #
    #   core, gateway   xenopsbase-images-are-signed   (Fulcio identity)
    #   curlimages/curl third-party-images-by-digest   (exact digest)
    #
    # Adding an image here without covering it denies the pod -- and not at
    # deploy time: the manifest applies cleanly and admission refuses the pod
    # only when one is next created. `make verify-image-allowlist` runs on every
    # pull request precisely so that lands as a red check instead.
    #
    # Verified in a scratch namespace before this was applied: the allowlisted
    # digest admitted, a DIFFERENT digest of the same image denied, an unrelated
    # third-party image denied, and a signed image admitted.
    managedNamespaceMetadata:
      labels:
        policy.sigstore.dev/include: "true"

  # ARGO MUST NOT OWN replicas ONCE AN HPA DOES (T-2.8, #22).
  #
  # `selfHeal: true` above reverts any live state that differs from git. The
  # Deployments declare `replicas`, and the HPA's entire job is to change it.
  # Without this block the two write the same field against each other: the HPA
  # scales to 4, Argo sees drift and sets it back to 2, the HPA scales up again.
  #
  # The visible symptom is not "autoscaling is broken". It is a service that
  # never has enough replicas under load while the HPA reports the correct
  # desired count, and an Application that flips between Synced and OutOfSync
  # for reasons no commit explains.
  #
  # `replicas` stays in the Deployments deliberately rather than being deleted
  # in favour of minReplicas. It is the count a fresh cluster starts at, before
  # metrics-server has produced a reading for the HPA to act on -- and for the
  # gateway that initial value being 2 rather than 1 is what keeps a rollout
  # survivable during the first minute of a cold rebuild.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
