# cloudflared — the only thing connecting this cluster to the public internet,
# and it does so by dialling OUT.
#
# There is no inbound listener, no load balancer and no public port. Cloudflare
# receives the request at its edge and hands it down an outbound connection this
# pod established. That is what lets ADR-0006 close the cluster completely while
# the application still serves.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  # Two replicas, on a three-node dev cluster where almost everything else is
  # one. This pod is the entire public path: one replica means an eviction, a
  # node drain or an OOM takes the site down with nothing to fail over to.
  # Cloudflare load-balances across connectors automatically, so the second
  # costs ~30MB and removes a single point of failure.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      # No legacy Docker-link variables; see services/gateway.yaml for why
      # (T-2.17, #212). Not currently exposed, switched off as the default.
      enableServiceLinks: false
      # Keep the two replicas off the same node, or the second one is decoration.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      containers:
        - name: cloudflared
          # WHEN THIS DIGEST MOVES (T-6.9, #330)
          #
          # On a deliberate connector upgrade, and at no other time. cloudflared
          # is the only path in from the internet, so a bad connector is an
          # outage rather than a degraded component -- which is the argument for
          # pinning it, not against it: a tag with `IfNotPresent` means each node
          # keeps whatever it cached, so two replicas can run different
          # connectors and nothing here reports the difference.
          #
          # Cloudflare does retire old connector versions, so this is not a pin
          # that can be left alone forever. Move it by resolving the new tag
          # (`docker buildx imagetools inspect cloudflare/cloudflared:<tag>`),
          # updating both the digest and the trailing comment, and confirming
          # the tunnel reconnects -- `make smoke ENV=dev` reaches the
          # application through this connector, so it fails if the tunnel does.
          #
          # The index digest, as valkey.yaml uses, not a per-architecture one.
          image: cloudflare/cloudflared@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339  # 2026.8.3, resolved 2026-08-31; trivy 0 HIGH/CRITICAL
          args:
            - tunnel
            - --no-autoupdate
            # Ingress rules live in Cloudflare (config_src = "cloudflare" in the
            # edge module), so the connector takes none locally. One place
            # defines routing rather than two that can disagree.
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  # Encrypted in git, decrypted by ksops at render time
                  # (ADR-0003). Never committed in plaintext, never stored
                  # decrypted.
                  name: cloudflared-token
                  key: token
          # cloudflared exposes readiness on the metrics port. Without these a
          # rolling update can cut every connector at once, because Kubernetes
          # has no way to know the new pod has actually registered with
          # Cloudflare yet.
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
