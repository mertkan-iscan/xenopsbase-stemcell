# Metrics, dashboards and alerting.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    # Wave 0. The ServiceMonitor and PodMonitor CRDs arrive with this chart, and
    # other components' monitors reference them.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    # Pinned. Chart 88.5.0 carries prometheus-operator v0.93.1.
    targetRevision: 88.5.0
    helm:
      # The CRDs in this chart are very large. Without this, Helm's rendered
      # output is fine but Argo's client-side apply blows the 262144-byte
      # annotation limit.
      skipCrds: false
      values: |
        # ----------------------------------------------------------------
        # Prometheus
        # ----------------------------------------------------------------
        prometheus:
          prometheusSpec:
            # The hostname Prometheus believes it serves on (T-8.6 extended).
            #
            # Not cosmetic. Prometheus stamps this into the `generatorURL` of
            # every alert it sends, which is the "view this in Prometheus" link
            # an operator follows out of an Alertmanager mail. Left unset it
            # emits the pod's own address, and every one of those links is dead
            # from a browser.
            externalUrl: https://prometheus-dev.xenopsoftware.com

            # RETENTION IS BOUNDED TWICE, on purpose.
            #
            # `retention` alone bounds age, not size: a sudden increase in
            # series -- a crash-looping pod churning labels, say -- fills the
            # volume well inside the window. `retentionSize` is the one that
            # actually protects the disk.
            #
            # retentionSize is deliberately well under the 10Gi volume. Prometheus
            # enforces it on completed blocks only, so the head block and WAL sit
            # ON TOP of this figure. Setting it at or near the volume size fills
            # the disk anyway, which is exactly the failure it is meant to prevent.
            retention: 7d
            retentionSize: "6GiB"

            # A real volume, not emptyDir. On emptyDir the metrics vanish with the
            # pod, which means they vanish precisely when a pod is crash-looping
            # and the history is what you need.
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: hcloud-volumes
                  accessModes: ["ReadWriteOnce"]
                  # Hetzner's minimum. Nothing smaller is possible.
                  resources:
                    requests:
                      storage: 10Gi

            resources:
              requests: {cpu: 200m, memory: 768Mi}
              limits:   {memory: 1536Mi}

            # Discover monitors from EVERY namespace, not just this chart's own
            # release. Without these four, a ServiceMonitor added next to an
            # application is silently ignored -- it exists, it is valid, and
            # nothing scrapes it.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false

        # ----------------------------------------------------------------
        # Alertmanager
        # ----------------------------------------------------------------
        alertmanager:
          # ROUTING. Without this the chart ships receiver: "null" and every
          # alert is discarded -- the rules evaluate, the UI shows them firing,
          # and nothing reaches a human. That is worse than having no alerts,
          # because it looks like monitoring.
          #
          # Proven necessary: the Postgres archive alerts fired correctly for
          # five hours on 2026-08-20 while the database created that day had no
          # backup at all, and nobody found out until someone happened to look.
          config:
            global:
              resolve_timeout: 5m
              # Brevo, not a personal mailbox. A transactional relay will not
              # rate-limit or spam-flag automated alerts the way a consumer
              # account does -- and alerts that get filtered are alerts that do
              # not arrive.
              #
              # Literal values: Helm does not expand shell-style placeholders
              # here, so a ${VAR} would be sent to the SMTP server verbatim.
              # Only the SMTP key is a secret, and it is read from a file below.
              #
              # smtp_from MUST be an address on a domain AUTHENTICATED in Brevo.
              #
              # This was mertiscan34@gmail.com and nothing was ever delivered.
              # Brevo accepted the SMTP transaction, returned "250 OK: queued",
              # and then discarded the message: a relay cannot send as @gmail.com
              # because nobody but Google can authenticate that domain. The
              # failure is invisible from this side -- Alertmanager logs "Notify
              # success" and the message simply does not exist.
              #
              # mertkaniscan.com is authenticated: brevo-code on the apex, SPF on
              # the branded send. subdomain, DMARC, and DKIM published as CNAMEs
              # at brevo1/brevo2._domainkey resolving to real RSA keys. DKIM
              # signs as d=mertkaniscan.com, which aligns with this From header
              # and satisfies DMARC.
              smtp_from: alerts@mertkaniscan.com
              smtp_smarthost: smtp-relay.brevo.com:587
              smtp_auth_username: b3b140001@smtp-brevo.com
              # Read from a file rather than inlined, so the credential stays in
              # the SOPS secret and never appears in a rendered ConfigMap.
              smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
              smtp_require_tls: true

            route:
              # Group by the thing that is broken, not just where. Two different
              # failures in one namespace should not arrive as one notification.
              group_by: ['alertname', 'namespace']
              group_wait: 30s
              group_interval: 5m
              # 12h is the chart default and is too quiet for something that
              # silently stops backups. 4h still reminds without training people
              # to filter the sender.
              repeat_interval: 4h
              receiver: email

              routes:
                # The chart's heartbeat. It fires permanently by design, as a
                # dead-man's switch for the alert pipeline itself, so it must
                # never notify.
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"

                # Critical repeats faster. Anything at this severity means data
                # is at risk or the platform is not serving.
                - receiver: email
                  matchers:
                    - severity = "critical"
                  repeat_interval: 1h

            inhibit_rules:
              # A critical already tells you the story; the warnings underneath
              # it are noise that trains people to ignore the sender.
              - source_matchers: [severity = "critical"]
                target_matchers: [severity =~ "warning|info"]
                equal: ['namespace', 'alertname']
              - source_matchers: [severity = "warning"]
                target_matchers: [severity = "info"]
                equal: ['namespace', 'alertname']

            receivers:
              - name: "null"
              - name: email
                email_configs:
                  - to: mertiscan34@gmail.com
                    send_resolved: true
                    headers:
                      subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.namespace }})'

          alertmanagerSpec:
            # Same reasoning as Prometheus's externalUrl above: this is the host
            # Alertmanager writes into the notification it sends, so it is what
            # the "silence this" link in an alert mail points at.
            externalUrl: https://alertmanager-dev.xenopsoftware.com

            # Mounts the SOPS-managed secret at
            # /etc/alertmanager/secrets/alertmanager-smtp/
            secrets:
              - alertmanager-smtp
            # emptyDir in dev. Alertmanager's state is silences and dedup
            # history; losing it on restart costs a repeated notification, not
            # data. Not worth a second Hetzner volume at the 10Gi minimum.
            # Prod gets a volume, where a silence surviving a restart matters.
            storage: {}
            resources:
              requests: {cpu: 25m, memory: 96Mi}
              limits:   {memory: 192Mi}

        # ----------------------------------------------------------------
        # Grafana
        # ----------------------------------------------------------------
        grafana:
          # Never the admin/admin default. The credential is SOPS-encrypted in
          # git (ADR-0003), like every other one here.
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password

          # No persistence. Everything Grafana would store -- dashboards,
          # datasources -- is provisioned from git below, so a volume would hold
          # only session state and would quietly become somewhere state could
          # hide that ADR-0002 does not account for.
          persistence:
            enabled: false

          # The sidecar watches for labelled ConfigMaps and drops dashboards
          # into Grafana. This is what makes "dashboards as code" work: adding
          # one is a commit, not a click.
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
              folderAnnotation: grafana_folder
              provider:
                foldersFromFilesStructure: true
            datasources:
              enabled: true
              searchNamespace: ALL

          resources:
            # Grafana 13.x carries unified storage, the embedded Zanzana authz
            # server and an in-memory bleve search index before a single panel
            # renders, which puts its idle working set around 330Mi. The 384Mi
            # ceiling this started with was never sized for that release: it sat
            # at 99.8% of the limit and the kernel spent the difference on
            # reclaim, so /api/health timed out and the liveness probe killed it
            # the moment anyone opened a dashboard.
            requests: {cpu: 50m, memory: 512Mi}
            limits:   {memory: 1Gi}

          grafana.ini:
            server:
              # Grafana builds absolute URLs -- the redirect after login, share
              # links, the OAuth callback if one is ever configured -- from
              # these. Behind a proxy that terminates TLS elsewhere it cannot
              # infer them, and the visible symptom is a login that succeeds and
              # then redirects to http://localhost:3000.
              domain: grafana-dev.xenopsoftware.com
              root_url: https://grafana-dev.xenopsoftware.com
            users:
              # No sign-up, and viewers cannot edit. Grafana is reachable through
              # the tunnel like everything else.
              allow_sign_up: false
              viewers_can_edit: false
            auth.anonymous:
              enabled: false

        # ----------------------------------------------------------------
        # Cluster components
        # ----------------------------------------------------------------
        # k3s does not expose these as scrapeable endpoints the way kubeadm
        # does: they run inside the k3s server process rather than as separate
        # static pods. Left enabled they produce permanently firing "target
        # down" alerts, which is worse than no signal -- an alert that is always
        # red trains everyone to ignore the alert list.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false

        nodeExporter:
          enabled: true
        kubeStateMetrics:
          enabled: true

        prometheus-node-exporter:
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits:   {memory: 96Mi}
        kube-state-metrics:
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits:   {memory: 192Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
