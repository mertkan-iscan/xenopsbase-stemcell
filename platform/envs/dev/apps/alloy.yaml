# Grafana Alloy: collects container logs from every node and ships them to Loki.
#
# Alloy rather than Promtail. Promtail reached end of life and Alloy is its
# stated replacement, so starting a new platform on Promtail would mean adopting
# something already scheduled for removal.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    # Wave 2: after Loki. Alloy buffers and retries, so starting first is not
    # fatal -- but it fills the logs with connection errors, which is a poor
    # first impression from the component whose job is logs.
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    # Pinned. Chart 1.11.1 carries Alloy v1.18.1.
    targetRevision: 1.11.1
    helm:
      values: |
        controller:
          # One per node: container logs are read from each node's own disk, so
          # a Deployment would only ever see the logs of the node it landed on.
          type: daemonset

          # EVERY node includes the control plane (T-2.22, #298).
          #
          # It carries a NoSchedule taint now, so that application workloads stop
          # landing on a cx23 that also runs etcd and the API server. A DaemonSet
          # is not exempt: without this toleration alloy simply stops being
          # scheduled there, and the node whose logs matter most during an
          # incident is the one that goes dark.
          #
          # That failure would be quiet. `kubectl get ds` still reports every
          # desired pod running, because the control plane stops being a node
          # alloy is desired on at all.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule

        alloy:
          # SIZED FOR WHAT IT COLLECTS, NOT FOR WHAT A COLLECTOR "SHOULD" COST
          # (T-5.12).
          #
          # Was `cpu: 50m`. Measured during the T-5.11 load runs, per pod:
          #
          #   alloy on the control plane   993m - 1197m
          #   alloy on each worker         115m -  259m
          #
          # Up to TWENTY TIMES the request. Two of the three pods sat
          # `1/2 Running` -- the alloy container not Ready -- for the same
          # reason Tempo was being killed: on a node at 100% CPU the kernel
          # shares out cores in proportion to REQUESTS, so a 50m request is an
          # instruction to starve this pod first, and it is the pod that carries
          # every span and log line off the box.
          #
          # 300m is above the workers' measured draw and below the control
          # plane's, deliberately. The control-plane figure is inflated by 100%
          # trace sampling; reserving for it would book a core on every node in
          # the cluster to serve a peak that a sampling change removes.
          resources:
            requests: {cpu: 300m, memory: 256Mi}
            limits:   {memory: 512Mi}

          # Needs the host log directory to read container stdout/stderr.
          mounts:
            varlog: true

          # Where the services send spans (T-2.7). A list, not a map, so unlike
          # the Tempo chart's receivers this replaces rather than merges.
          #
          # The chart adds these to the container AND to the Service, which is
          # what makes otelcol.receiver.otlp below reachable at
          # alloy.observability.svc:4317.
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP

          # Clustering off: each instance handles its own node's files, so there
          # is nothing to distribute and the gossip traffic buys nothing.
          clustering:
            enabled: false

          configMap:
            content: |-
              // Discover every pod in the cluster.
              discovery.kubernetes "pods" {
                role = "pod"
              }

              // Keep only pods on THIS node. Without it every Alloy instance
              // targets every pod, and each log line is shipped once per node --
              // triple-counted on a three-node cluster, and it looks like a
              // Loki duplication bug rather than a collector misconfiguration.
              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  regex         = env("HOSTNAME")
                  action        = "keep"
                }

                // Labels worth querying by. Deliberately few: every distinct
                // label value is a separate stream in Loki, and high-cardinality
                // labels (pod UID, request id) are what make it slow and
                // expensive. Details belong in the log LINE, not the labels.
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
                }
              }

              // ---- Traces (T-2.7) ----
              //
              // This is the OTel Collector the ticket asks for. Alloy IS one --
              // it speaks OTLP natively and is the supported successor to the
              // Grafana Agent -- so a separate collector would be a second
              // workload doing the same job, on a cluster where one worker is
              // already at 82% of its memory limits, and a second place a
              // pipeline can be misconfigured.
              //
              // Reached through the Service rather than the node-local pod.
              // Alloy is a DaemonSet, so the Service round-robins across nodes
              // and spans of one trace can land on different instances. That is
              // fine: Tempo assembles a trace from spans by trace ID, not by
              // who delivered them.
              otelcol.receiver.otlp "default" {
                grpc {
                  endpoint = "0.0.0.0:4317"
                }

                output {
                  traces = [otelcol.processor.batch.default.input]
                }
              }

              // Batching is not an optimisation here, it is what keeps a burst
              // of spans from becoming a request per span to Tempo.
              otelcol.processor.batch "default" {
                output {
                  traces = [otelcol.exporter.otlp.tempo.input]
                }
              }

              otelcol.exporter.otlp "tempo" {
                client {
                  endpoint = "tempo.observability.svc.cluster.local:4317"
                  // Plaintext inside the cluster. Tempo terminates no TLS and
                  // this hop does not leave the pod network; `insecure` here
                  // means "do not attempt TLS", not "skip verification".
                  tls {
                    insecure = true
                  }
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
