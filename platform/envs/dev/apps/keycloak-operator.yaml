# The Keycloak operator. The Keycloak instance itself is a separate Application
# (apps/keycloak.yaml), for the same reason the CNPG operator and the Postgres
# Cluster are separate: a Keycloak is a k8s.keycloak.org CRD that does not exist
# until this has installed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mertkan-iscan/xenopsbase-stemcell.git
    targetRevision: main
    path: platform/components/keycloak-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
