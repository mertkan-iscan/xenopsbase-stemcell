apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    # Pinned, for the same reason every other chart here is: a rebuild must
    # reproduce what was there before (ADR-0002).
    targetRevision: 4.15.1
    helm:
      values: |
        controller:
          # ClusterIP, NOT LoadBalancer.
          #
          # This is the concrete saving from choosing a Cloudflare Tunnel in
          # T-1.6. cloudflared runs inside the cluster and forwards to this
          # service over the cluster network, so nothing needs to be reachable
          # from outside. A LoadBalancer here would provision an lb11 that bills
          # continuously -- including while the cluster is destroyed -- and
          # would re-open the public surface ADR-0006 closed.
          service:
            type: ClusterIP

          # No admission webhook. It validates Ingress resources at admission
          # time, which is useful with many authors; here every Ingress arrives
          # through Argo CD from git and has already been reviewed. It also adds
          # a certificate-generating job to every rebuild, which is exactly the
          # kind of moving part a frequently-rebuilt cluster does not need.
          admissionWebhooks:
            enabled: false

          replicaCount: 1

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

          # STRIP X-Forwarded-Prefix FROM EVERY REQUEST (T-3.15, #148).
          #
          # nginx rewrites X-Forwarded-Host to $best_http_host and sets
          # X-Forwarded-Proto itself, so a caller cannot forge either. It does
          # not touch X-Forwarded-Prefix at all -- the header is passed straight
          # through to the gateway, which honours it.
          #
          # Verified against dev on 2026-08-22, from inside the cluster so
          # Cloudflare was not in the path:
          #
          #   GET / -H 'X-Forwarded-Prefix: /injected'
          #     -> 302 .../injected/oauth2/authorization/oidc
          #
          # A caller choosing the path prefix the gateway builds URLs under, and
          # -- per #148 -- moving every path out from under the route predicates
          # so routing to core stops entirely. One header, no authentication.
          #
          # That was closed at Cloudflare, which covers the public path and only
          # the public path. Anything reaching this ingress another way got the
          # old behaviour, and deleting that Cloudflare rule looks like removing
          # a header rewrite rather than like reopening request forgery.
          #
          # An empty value renders `proxy_set_header X-Forwarded-Prefix "";`,
          # which makes nginx omit the header rather than forward it. Nothing
          # here is served under a path prefix, so there is no legitimate sender.
          proxySetHeaders:
            X-Forwarded-Prefix: ""

          config:
            # cloudflared is the only client, and it is in-cluster, so the real
            # client address arrives in headers rather than at the TCP layer.
            use-forwarded-headers: "true"
            # Cloudflare sets this; trusting it is what makes access logs and
            # rate limiting see the actual visitor rather than a pod IP.
            compute-full-forwarded-for: "true"
            proxy-real-ip-cidr: "10.0.0.0/8"
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
