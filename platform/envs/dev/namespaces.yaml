# Namespaces the platform components land in.
#
# Created here rather than by each component's own chart so that the root
# Application has something real to reconcile from the first apply, and so
# deleting one demonstrates self-healing rather than merely being described.
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
  labels: {app.kubernetes.io/managed-by: argocd}
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels: {app.kubernetes.io/managed-by: argocd}
---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
  labels: {app.kubernetes.io/managed-by: argocd}
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels: {app.kubernetes.io/managed-by: argocd}
---
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  labels: {app.kubernetes.io/managed-by: argocd}
---
apiVersion: v1
kind: Namespace
metadata:
  name: database
  labels: {app.kubernetes.io/managed-by: argocd}
---
# The two application services (T-6.1). Separated from the platform namespaces
# above rather than sharing `default`, so a NetworkPolicy or resource quota can
# name what is ours without also naming everything Kubernetes puts in default.
apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    app.kubernetes.io/managed-by: argocd
    # IMAGE POLICY ENFORCEMENT (T-6.2, #49).
    #
    # This is what makes T-6.2's scope line true rather than aspirational --
    # "only images this pipeline built may run". policy-controller's webhook
    # selects on exactly this label and denies anything matching no policy, so
    # every image here must be covered:
    #
    #   core, gateway     xenopsbase-images-are-signed   Fulcio identity
    #   curlimages/curl   third-party-images-by-digest   exact digest
    #
    # IT HAS TO BE HERE, NOT ON THE services APPLICATION.
    #
    # #418 put it in that Application's `managedNamespaceMetadata`, which is the
    # documented way to label a namespace Argo creates -- and it silently lost.
    # This Namespace object is owned by the `root` Application
    # (`argocd.argoproj.io/tracking-id: root:/Namespace:/apps`), so root
    # reasserts these labels on every sync and strips anything another
    # Application added. The label appeared, survived about two minutes, and was
    # gone; enforcement was off and nothing reported it.
    #
    # Caught only by trying to run an unsigned image in `apps` and watching it be
    # ADMITTED. A label that is present in the manifest and absent on the cluster
    # is exactly the shape of control this repository keeps finding.
    policy.sigstore.dev/include: "true"
---
# The in-memory store (ADR-0009). Named for what may live in it, not for the
# product that implements it: nothing authoritative belongs here, and a
# namespace called `cache` makes a pull request that puts a source of truth in
# it look wrong at a glance.
apiVersion: v1
kind: Namespace
metadata:
  name: cache
  labels: {app.kubernetes.io/managed-by: argocd}
---
# xenopsbase-learn's three services.
#
# Its own namespace rather than sharing `apps`, because the two products have
# different release cadences and different Argo Applications, and `prune: true`
# on either should never be reasoning about the other's resources.
#
# THE POLICY LABEL HAS TO BE HERE, on the Namespace object owned by the `root`
# Application -- not in the learn Application's managedNamespaceMetadata. #418
# proved that the hard way for `apps`: root reasserts its labels on every sync
# and strips whatever another Application added, so the label appeared, lasted
# about two minutes, and left enforcement off with nothing reporting it.
#
# Every image that runs in here must be covered by some policy, because
# policy-controller denies anything matching none:
#
#   identity, streaming, reporting   xenopsbase-learn-images-are-signed
#   curlimages/curl (initContainer)  third-party-images-by-digest
apiVersion: v1
kind: Namespace
metadata:
  name: learn
  labels:
    app.kubernetes.io/managed-by: argocd
    policy.sigstore.dev/include: "true"
