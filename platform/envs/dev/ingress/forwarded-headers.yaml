# Corrects X-Forwarded-Port for everything behind the tunnel.
#
# THE FAILURE THIS FIXES
#
# TLS terminates at Cloudflare, the tunnel delivers plain HTTP, and
# ingress-nginx therefore listens on 80. It builds X-Forwarded-Port from
# $server_port, so upstreams are told:
#
#     X-Forwarded-Proto: https
#     X-Forwarded-Port:  80
#
# which describes no real endpoint. Spring believes both and builds absolute
# URLs as https://app-dev.xenopsoftware.com:80/... -- the port is rendered
# because 80 is not the default for https.
#
# The first place that showed was the OIDC login redirect. Keycloak matches
# redirect_uri by exact string, so it rejected every authorization request with
# "Invalid parameter: redirect_uri" while the gateway, the realm and the ingress
# were all healthy. Keycloak's own URLs were unaffected because it ignores the
# port header, which is why identity looked fine and the application did not.
#
# 443 is not a guess: the public endpoint is Cloudflare, and it is always https.
#
# WHY A CONFIGMAP RATHER THAN AN ANNOTATION
#
# The obvious fix is nginx.ingress.kubernetes.io/configuration-snippet on the
# one Ingress. Snippet annotations are disabled by default in current
# ingress-nginx because they let any namespace with Ingress permission inject
# arbitrary nginx config, and turning them on cluster-wide to set one header is
# a poor trade. proxy-set-headers is the supported mechanism and needs no such
# escape hatch.
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-forwarded-headers
  namespace: ingress-nginx
data:
  X-Forwarded-Port: "443"
