apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - alerts-backups.yaml
  - alerts-application-metrics.yaml
  # Disk. The WAL side is in alerts-backups.yaml; these watch the volume it
  # sits on, which had no alert of any kind before T-2.21.
  - alerts-storage.yaml
  # Connections. The budget check reads config files; these watch the running
  # database, which is what ADR-0012 named as the pooler trigger (T-2.18).
  - alerts-connections.yaml
  # Rate limiting. One rule says the limiter is reporting at all, the other that
  # it is not rejecting a share of traffic too large to be one client (T-8.3).
  - alerts-rate-limit.yaml
  # The published objectives, alerted on as error-budget burn rate rather than
  # as a threshold that fires on a blip and sleeps through a slow bleed (T-7.6).
  - alerts-slo.yaml
  - dashboard-platform.yaml
  - tempo.yaml
  # Grafana, Prometheus and Alertmanager on their own hostnames, behind
  # Cloudflare Access (T-8.6 extended).
  - ingress.yaml
