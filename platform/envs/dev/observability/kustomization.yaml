apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - alerts-backups.yaml
  - alerts-application-metrics.yaml
  # Disk. The WAL side is in alerts-backups.yaml; these watch the volume it
  # sits on, which had no alert of any kind before T-2.21.
  - alerts-storage.yaml
  # Connections. The budget check reads config files; these watch the running
  # database, which is what ADR-0012 named as the pooler trigger (T-2.18).
  - alerts-connections.yaml
  - dashboard-platform.yaml
  - tempo.yaml
