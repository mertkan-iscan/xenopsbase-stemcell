# Alerts for the failures that do not announce themselves.
#
# Every rule here exists because the thing it watches can break while every
# dashboard stays green. A Postgres Cluster reporting "Cluster in healthy state"
# says nothing about whether its WAL is reaching object storage -- that exact
# combination happened on 2026-08-19 and went unnoticed until someone looked in
# the bucket.
#
# Written against metrics verified to exist on this cluster, not guessed. Check
# with:
#   curl $PROM/api/v1/label/__name__/values | tr ',' '\n' | grep cnpg_
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backup-and-archiving
  namespace: observability
  labels:
    # Picked up by the ruleSelector; the stack is configured with
    # ruleSelectorNilUsesHelmValues: false so rules outside its own release are
    # still discovered.
    app.kubernetes.io/part-of: xenopsbase
spec:
  groups:
    - name: postgres-archiving
      rules:
        # THE ONE THAT MATTERS. Continuous archiving stopping is invisible:
        # Postgres keeps serving, the Cluster stays Healthy, Argo stays Synced,
        # and recoverability quietly stops advancing.
        - alert: PostgresWALArchivingFailing
          expr: increase(cnpg_pg_stat_archiver_failed_count[15m]) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "WAL archiving is failing on {{ $labels.pod }}"
            description: >-
              pg_stat_archiver reports failures over the last 15 minutes. The
              database is almost certainly still serving, so nothing else will
              look wrong. Recoverability stops advancing from the moment this
              started. Check the barman sidecar:
              kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c plugin-barman-cloud

        # Catches the same failure from the other side: files queued and never
        # shipped. Survives a case where the archiver reports no NEW failures
        # because it has stopped trying.
        - alert: PostgresWALFilesPilingUp
          expr: cnpg_collector_pg_wal_archive_status{value="ready"} > 20
          for: 20m
          labels:
            severity: warning
          annotations:
            summary: "WAL files are queuing for archive on {{ $labels.pod }}"
            description: >-
              More than 20 WAL segments are waiting to be archived. Either
              archiving is failing or it cannot keep up with write volume. Left
              alone this eventually fills the data volume.

        # THE DIRECT RPO SIGNAL, and it was missing.
        #
        # The three rules above catch archiving that FAILS. None catches
        # archiving that simply stops: a hung sidecar raises no error, so
        # failed_count does not increase; a quiet database does not queue 20
        # segments; and archived_count is not zero because it worked yesterday.
        # Everything stays green while recoverability stops advancing.
        #
        # seconds_since_last_archival is the value that actually expresses the
        # RPO, and it is read from pg_stat_archiver -- from Postgres itself --
        # so unlike the backup collectors below it carries a real number.
        # Verified on 2026-08-22: 291.69.
        #
        # 900s is three archive_timeout periods (300s), so one slow ship does
        # not trip it and a stall does.
        - alert: PostgresArchivingStalled
          expr: cnpg_pg_stat_archiver_seconds_since_last_archival > 900
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "No WAL segment archived for over 15 minutes on {{ $labels.pod }}"
            description: >-
              archive_timeout is 300s, so a healthy database ships a segment at
              least that often. Nothing has been archived for 15 minutes and no
              failure was reported, which is what a hung archiver looks like.
              Everything since the last segment is currently unrecoverable.

        # CANNOT FIRE AS WRITTEN, and that is recorded rather than fixed,
        # because the fix is upstream (#145).
        #
        # Under the barman-cloud PLUGIN backup method this project uses,
        # CloudNativePG never populates the in-tree backup fields:
        # cluster.status.lastSuccessfulBackup is absent from the resource, and
        # cnpg_collector_last_available_backup_timestamp is pinned at 0. They
        # belong to the deprecated barmanObjectStore path.
        #
        # So the `> 0` guard below -- added in good faith, to stop a brand-new
        # cluster alerting with a 57-year age -- matches nothing, on every
        # cluster, permanently. The rule has never been able to fire.
        #
        # It is KEPT rather than deleted so that it starts working by itself if
        # the metric is ever populated. PostgresBackupAgeUnobservable is what
        # notices that it currently is not, and `make backup-status` is what
        # actually answers the question in the meantime.
        - alert: PostgresNoRecentBaseBackup
          expr: >-
            cnpg_collector_last_available_backup_timestamp > 0
            and
            (time() - cnpg_collector_last_available_backup_timestamp) > 108000
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "No successful base backup for over 30 hours"
            description: >-
              ScheduledBackup runs daily at 03:00, so 30 hours means at least one
              run was missed or failed. WAL replays forward FROM a base backup,
              so without a recent one, recovery time grows without bound.

        # The alert about the alerts. Fires while base-backup age is not
        # observable at all, so the two dead rules around it are KNOWN dead
        # rather than assumed live.
        #
        # `max(...) == 0` rather than `count(...) == 0`: the metric exists and
        # carries the value 0, so max() returns 0 and the comparison matches.
        # count() over an empty vector returns an empty vector and would itself
        # never fire -- the same trap, one level up.
        #
        # `absent(...)` covers the metric disappearing entirely, which is a
        # different failure with the identical consequence.
        #
        # Warning, not critical, and a long `for`: this is a standing condition
        # rather than an incident, and a critical page that can never be cleared
        # is one that gets muted -- taking the two rules beside it with it.
        # It resolves by itself if CloudNativePG ever populates the metric.
        - alert: PostgresBackupAgeUnobservable
          expr: >-
            max(cnpg_collector_last_available_backup_timestamp) == 0
            or
            absent(cnpg_collector_last_available_backup_timestamp)
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "Base-backup age cannot be read from metrics (#145)"
            description: >-
              cnpg_collector_last_available_backup_timestamp is 0 or absent, so
              PostgresNoRecentBaseBackup and PostgresLastBackupFailed cannot
              fire. Backups may be perfectly healthy — this says nothing about
              them, only that nothing is watching their age. Until it clears,
              run `make backup-status ENV=<env>`, which reads the bucket.

        # CANNOT FIRE AS WRITTEN — same cause as PostgresNoRecentBaseBackup
        # above. cnpg_collector_last_failed_backup_timestamp is pinned at 0
        # under the plugin backup method, so the `> 0` guard matches nothing.
        # Kept for the same reason: it becomes live the moment the metric does.
        - alert: PostgresLastBackupFailed
          expr: >-
            cnpg_collector_last_failed_backup_timestamp > 0
            and
            cnpg_collector_last_failed_backup_timestamp > cnpg_collector_last_available_backup_timestamp
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "The most recent base backup attempt failed"
            description: >-
              The last failure is more recent than the last success, so the
              newest backup on record is older than it appears.

        # A cluster that has never archived at all -- the shape a rebuilt cluster
        # takes when its archive path is not empty and barman refuses it (#113).
        - alert: PostgresNeverArchived
          expr: cnpg_pg_stat_archiver_archived_count == 0
          for: 45m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.pod }} has never archived a WAL segment"
            description: >-
              Not a single segment has been archived since the stats were reset.
              On a freshly rebuilt cluster this is usually barman refusing a
              non-empty archive path -- "Expected empty archive". The cluster
              runs normally and has no backups.

    - name: public-path
      rules:
        # The entire public path depends on cloudflared holding an outbound
        # tunnel. If every connector drops, the site is down while the cluster
        # itself looks perfectly healthy.
        - alert: CloudflaredNoReplicasAvailable
          expr: kube_deployment_status_replicas_available{deployment="cloudflared"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "No cloudflared connectors are available"
            description: >-
              Nothing is serving public traffic. cloudflared retries with backoff
              rather than exiting, so its pods can sit Running and Ready-less for
              a long time -- check for blocked outbound UDP 7844 before anything
              else.

        - alert: CloudflaredDegraded
          expr: kube_deployment_status_replicas_available{deployment="cloudflared"} < 2
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "cloudflared is running below two connectors"
            description: >-
              Still serving, but a single connector is a single point of failure
              for the whole public path.
