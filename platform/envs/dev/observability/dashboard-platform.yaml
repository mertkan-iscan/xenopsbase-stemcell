# Grafana dashboards as code.
#
# The sidecar in the kube-prometheus-stack values watches for ConfigMaps
# carrying grafana_dashboard: "1" and loads them. Adding a dashboard is a
# commit; nothing here is created by clicking, and nothing survives only in
# Grafana's own database -- which is why Grafana runs with persistence disabled.
#
# This one deliberately shows DURABILITY rather than CPU and memory: whether WAL
# is reaching object storage, how old the newest base backup is, and whether the
# public path has connectors. Those are the signals that were green while broken.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Platform"
data:
  platform-durability.json: |
    {
      "title": "Platform durability",
      "uid": "platform-durability",
      "tags": [
        "xenopsbase",
        "platform"
      ],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "type": "stat",
          "title": "Seconds since last WAL archived",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "mappings": []
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "min(cnpg_pg_stat_archiver_seconds_since_last_archival)",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Base backup age",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "mappings": []
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "time() - max(cnpg_collector_last_available_backup_timestamp > 0)",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "WAL segments waiting",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": []
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(cnpg_collector_pg_wal_archive_status{value=\"ready\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "cloudflared connectors",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": []
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kube_deployment_status_replicas_available{deployment=\"cloudflared\"}",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "WAL archive failures (rate)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (increase(cnpg_pg_stat_archiver_failed_count[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "WAL segments archived (cumulative)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (cnpg_pg_stat_archiver_archived_count)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "WAL archive queue by state",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (value) (cnpg_collector_pg_wal_archive_status)",
              "legendFormat": "{{value}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Recoverability window (first recoverability point age)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "time() - max(cnpg_collector_first_recoverability_point > 0)",
              "legendFormat": "window",
              "refId": "A"
            }
          ]
        }
      ]
    }
