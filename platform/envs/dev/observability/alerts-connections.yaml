# Connection saturation — the trigger ADR-0012 wrote down and nothing measured
# (T-2.18, #259).
#
# WHY THIS EXISTS
#
# ADR-0012 decided the order is "fix defects, then MEASURE, then add
# components", and stated in advance what would justify a connection pooler:
#
#   | Connection pooler | Connection demand approaches the budget for reasons
#                         that are not a misconfigured pool |
#
# The defects were fixed (core's pool 20 -> 12, Keycloak's pinned at 15) and the
# arithmetic is asserted by check-connection-budget.sh. But that check reads
# CONFIGURATION FILES. It adds up declared ceilings and says whether they fit.
# It cannot tell you what the database is actually doing, and it only runs when
# somebody runs it.
#
# So the condition the ADR named as the thing to wait for was, until now, not
# observable. A decision criterion nothing measures is a decision criterion that
# never fires: the pooler would have arrived either during an incident, or never.
# That is the same shape as T-2.8's HPA target, T-2.13's RPO default and
# Keycloak's unpinned pool — a control that reports success and does not govern
# the thing it names.
#
# WHAT THE NUMBERS MEAN TODAY, measured rather than assumed
#
#   postgres-1   6% of max_connections
#   postgres-2   1%
#   waiting      0
#
# against a declared ceiling of 65 of 100 at full HPA scale. There is a large
# gap between what is configured and what is used, and that gap is exactly why
# the pooler was deferred rather than rejected.
#
# WRITTEN AGAINST METRICS VERIFIED TO EXIST ON THIS CLUSTER
#
#   cnpg_backends_total{pod,datname,usename,state}
#   cnpg_backends_waiting_total{pod}
#   cnpg_pg_settings_setting{name="max_connections"}
#
# The ratio is computed per POD, not per cluster: max_connections is a
# per-instance limit, so a cluster-wide sum would compare a total against one
# instance's ceiling and read low exactly when one instance is in trouble.
#
# Verify with:
#   100 * sum by (pod) (cnpg_backends_total)
#     / on(pod) group_left max by (pod) (cnpg_pg_settings_setting{name="max_connections"})
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: database-connections
  namespace: observability
  labels:
    # Picked up by the ruleSelector; the stack sets
    # ruleSelectorNilUsesHelmValues: false so rules from outside its own release
    # are still discovered.
    app.kubernetes.io/part-of: xenopsbase
spec:
  groups:
    - name: database-connections
      rules:
        # THE POOLER TRIGGER. This is the alert ADR-0012 was implicitly waiting
        # for, and its description says so, so that whoever it wakes reads the
        # decision criteria rather than reaching for the nearest component.
        #
        # 70% rather than 80%: the budget check already fails at 80% of
        # max_connections, so an alert there would only ever confirm something a
        # CI check had already said. Firing at 70 gives warning while the
        # decision is still unhurried, which is the entire point of writing the
        # criteria down in advance.
        #
        # `for: 15m` because connection counts spike during a rolling deploy --
        # old and new pods hold pools simultaneously, by design. A deploy is not
        # a capacity signal, and an alert that fires on every deploy is one that
        # gets muted.
        - alert: PostgresConnectionsApproachingBudget
          expr: >-
            100 * sum by (pod) (cnpg_backends_total)
              / on(pod) group_left max by (pod) (cnpg_pg_settings_setting{name="max_connections"})
            > 70
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook: docs/runbooks/database.md#connections-are-running-out
            summary: "{{ $labels.pod }} is using {{ $value | printf \"%.0f\" }}% of max_connections"
            description: >-
              Sustained for fifteen minutes, so this is not a rolling deploy.
              THIS IS THE CONDITION ADR-0012 NAMED as justifying a connection
              pooler (#259) — read docs/adr/0012-database-scaling.md before
              acting, because the ADR is explicit that raising max_connections
              is NOT the lever: every connection is a backend process against
              shared_buffers, so a higher limit trades a refused connection for
              a slower database.
              First establish it is not a misconfigured pool:
              make connection-budget
              Runbook: docs/runbooks/database.md

        # Not a louder version of the warning. By 90% the question is no longer
        # which lever to pull; new connections are about to be refused, and a
        # refused connection surfaces as an application error, not as a slow
        # query.
        - alert: PostgresConnectionsNearlyExhausted
          expr: >-
            100 * sum by (pod) (cnpg_backends_total)
              / on(pod) group_left max by (pod) (cnpg_pg_settings_setting{name="max_connections"})
            > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook: docs/runbooks/database.md#connections-are-running-out
            summary: "{{ $labels.pod }} is at {{ $value | printf \"%.0f\" }}% of max_connections"
            description: >-
              Postgres refuses connections past max_connections; it does not
              queue them. Applications will see connection failures, and
              superuser_reserved_connections means an operator can still get in
              to look.
              Find who is holding them:
              kubectl exec -n database {{ $labels.pod }} -c postgres --
                psql -U postgres -c "select usename, state, count(*)
                from pg_stat_activity group by 1,2 order by 3 desc"
              Runbook: docs/runbooks/database.md

        # A different failure from saturation, and worth separating: backends
        # can be few and still all stuck. This counts backends waiting on a lock
        # or other event, which is what a long-running transaction holding rows
        # produces -- and which idle_in_transaction_session_timeout (now bound to
        # the core role, T-2.18) exists to bound.
        - alert: PostgresBackendsWaiting
          expr: max by (pod) (cnpg_backends_waiting_total) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook: docs/runbooks/database.md#connections-are-running-out
            summary: "{{ $labels.pod }} has backends waiting for ten minutes"
            description: >-
              Backends are blocked rather than merely numerous, so this is
              contention and not capacity — adding connections or a pooler
              would make it worse, not better.
              kubectl exec -n database {{ $labels.pod }} -c postgres --
                psql -U postgres -c "select pid, wait_event_type, wait_event,
                state, query from pg_stat_activity where wait_event is not null"
              Runbook: docs/runbooks/database.md

        # Every alert above is a ratio, and a ratio whose denominator stops
        # arriving does not fire — it simply has no series, which looks
        # identical to "healthy". This project has met that shape often enough
        # to spend a rule on it (#113, #155, #269).
        - alert: PostgresConnectionMetricsMissing
          expr: absent(cnpg_backends_total)
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook: docs/runbooks/database.md#connections-are-running-out
            summary: "No Postgres connection metrics are reaching Prometheus"
            description: >-
              cnpg_backends_total has no series at all, so every connection
              alert above is inert and will report nothing whatever happens —
              including the condition ADR-0012 is waiting on to justify a
              pooler. Check the database/postgres ServiceMonitor and the CNPG
              metrics exporter on the instance pods (port 9187).
