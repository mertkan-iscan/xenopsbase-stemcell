apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Order matters at apply time as well as at sync time: the Cluster references
# the ObjectStore by name, so the ObjectStore is listed first.
resources:
  - objectstore.yaml
  - cluster.yaml
  - keycloak-database.yaml
  - core-database.yaml
  - scheduledbackup.yaml
  # A PostSync hook rather than a steady-state resource: it binds core's session
  # limits to the ROLE so they survive a pooler (ADR-0012 section 5, T-2.18).
  - session-settings.yaml
