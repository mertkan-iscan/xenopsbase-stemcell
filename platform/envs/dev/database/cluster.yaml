# The Postgres cluster.
#
# Deliberately holds no schema and no domain tables. Flyway owns the schema from
# commit one (T-3.6), and the stemcell ships a database that is ready rather
# than a database that is populated.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: database
  annotations:
    # Lets this cluster archive into a path that already has history.
    #
    # The check exists to stop two DIFFERENT databases writing to one archive,
    # which would interleave unrelated timelines and corrupt recovery for both.
    # That is a real hazard and the default is right.
    #
    # It is safe HERE, and only because of the line directly below it in this
    # file: this cluster bootstraps by RECOVERING from the very path it archives
    # to. It is the same lineage continuing on a new timeline, which is exactly
    # what barman's timeline handling is for -- not a second database colliding
    # with the first.
    #
    # DANGER: this annotation and `bootstrap.recovery` are a matched pair. If
    # anyone ever changes bootstrap back to initdb while leaving this set, a
    # brand-new empty database will start writing into the old one's archive and
    # silently destroy its recoverability. Change one, change the other.
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  # Two, on a cluster with two schedulable workers. One instance cannot fail
  # over, so the failover criterion of T-2.4 would be untestable and, worse,
  # would look fine right up until the node it was on rebooted.
  instances: 2

  storage:
    size: 10Gi
    storageClass: hcloud-volumes
    # The operator defaults this to true and writes it back into the spec. Set
    # explicitly so git and the cluster agree; otherwise Argo reports the
    # Cluster permanently OutOfSync against a field nobody changed.
    resizeInUseVolumes: true

  # No separate walStorage in dev. Splitting WAL onto its own volume is the
  # right production choice -- it stops a WAL burst from filling the data
  # volume and stalling writes -- but Hetzner volumes have a 10Gi minimum, so
  # it would double the volume count and cost for a database with no traffic.
  # Turn it on in staging and prod, where the failure it prevents is real.

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # The operator defaults this to true and writes it back INTO the array
      # element. Argo compares array items whole, so an operator-added field
      # inside one reads as drift even though every field we set matches.
      enabled: true
      # This is what makes continuous archiving happen at all. Without
      # isWALArchiver the plugin is loaded, base backups still work, and WAL is
      # never shipped -- so the cluster looks backed up and can only ever be
      # restored to the last base backup.
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-backups

        # The directory inside the bucket. Defaults to the Cluster's name, and
        # belongs HERE rather than on the ObjectStore -- the API refuses it
        # there, and says so plainly:
        #
        #   spec.configuration.serverName: Forbidden: use the 'serverName'
        #   plugin parameter in the Cluster resource
        #
        # Pinned because the default breaks on rebuild. barman refuses to
        # archive a NEW cluster into a path that already holds a different
        # cluster's history:
        #
        #   WAL archive check failed for server postgres: Expected empty archive
        #
        # That refusal is correct: interleaving WAL from two timelines under one
        # path corrupts the archive for both. But a cluster rebuilt per ADR-0002
        # comes back with a fresh identity while the old path is still
        # populated, so it starts Healthy and never archives again. Green
        # dashboards, no backups.
        #
        # Naming the generation gives each rebuild its own path and leaves every
        # earlier archive intact and restorable. BUMP THIS on a rebuild whose
        # database is not being recovered from the previous generation.
        #
        # INTERIM: #113 decides the real answer, and #122 the durable one.
        #
        # BUMPED TO g3 on 2026-08-20 after the second recurrence. The rebuild
        # that morning produced a cluster that never archived a single WAL
        # segment: barman refused the non-empty g2 path, the scheduled base
        # backup started and hung waiting for archiving, and the cluster ran for
        # five hours reporting Healthy with no backup of anything created that
        # day.
        #
        # That is twice. The manual bump is not a fix, it is a reminder nobody
        # gets - which is exactly what #122 exists to remove.
        serverName: postgres-g3

  affinity:
    # Keep the replica off the primary's node. Without this both instances can
    # land on one worker, and the second instance protects against a process
    # crash but not against losing the machine -- which is the failure that
    # actually happens.
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits:   {memory: 512Mi}

  postgresql:
    parameters:
      # Modest and explicit rather than tuned. Tuning belongs with the load
      # baseline in T-5.6, against measurements instead of guesses.
      max_connections: "100"
      shared_buffers: "128MB"

  managed:
    roles:
      # Keycloak owns its own role and its own database (database/keycloak.yaml)
      # rather than sharing the `app` role. Two reasons, and the second is the
      # one that matters: a shared role means a compromised application can read
      # and rewrite the identity provider's tables, and a schema migration in
      # one can lock the other.
      #
      # Declared here rather than created by hand, so a rebuilt cluster has it
      # without anyone remembering to run SQL -- which is the whole point of
      # T-2.5's "reproduces exactly on a rebuilt cluster".
      # The core service owns its own role and database, exactly as Keycloak
      # does. Same reasoning: a shared role means a compromised service can read
      # and rewrite the other's tables, and a migration in one can lock the
      # other.
      - name: core
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: core-db
        comment: "Owner of the core database. Managed by CNPG, password from SOPS."
        inherit: true
        connectionLimit: -1

      - name: keycloak
        ensure: present
        login: true
        # NOT superuser, NOT createdb. Keycloak needs to own its own schema and
        # nothing else. The operator runs migrations inside its database, which
        # ownership already permits.
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: keycloak-db
        comment: "Owner of the keycloak database. Managed by CNPG, password from SOPS."
        # Both are CNPG defaults that the operator writes back into this list
        # ELEMENT. Argo compares array items whole, so a field the operator adds
        # inside one reads as drift even though every field set here matches --
        # the same trap as plugins[].enabled above.
        #
        # Stated rather than ignored on purpose: an ignoreDifferences on
        # managed.roles would also hide a real change to this role's privileges,
        # which is exactly the change worth noticing.
        inherit: true
        connectionLimit: -1

  # RECOVERY, not initdb.
  #
  # bootstrap only runs when the Cluster is CREATED, so this is what happens on
  # every rebuild: the database is restored from the archive rather than starting
  # empty. That is what ADR-0002 has always implied - the cluster is disposable
  # because the data is not - and it is what makes the promise real instead of
  # aspirational.
  #
  # It also removes the failure that recurred twice. A cluster bootstrapped with
  # initdb is a NEW lineage, so barman refuses to archive into a path that already
  # holds another cluster's history:
  #
  #   WAL archive check failed for server postgres-gN: Expected empty archive
  #
  # ...and the cluster then runs indefinitely reporting Healthy with no backups.
  # The workaround was a human remembering to bump serverName on every rebuild,
  # which failed both times it was needed. A recovered cluster is a CONTINUATION
  # of the same lineage, so the check does not apply and serverName never changes.
  #
  # FIRST INSTALL IN A NEW ENVIRONMENT will fail here, loudly, because there is
  # nothing to recover from. That is the correct default for a system that holds
  # data: creating an empty database is the exceptional act, not the routine one.
  # docs/runbooks/database.md has the one-time bootstrap procedure.
  bootstrap:
    recovery:
      source: archive
      database: app
      owner: app

  externalClusters:
    - name: archive
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: pg-backups
          # The path this cluster both restores FROM and archives TO. It is the
          # same value because recovery continues the lineage; there is no
          # generation to bump.
          serverName: postgres-g3
  monitoring:
    # On, now that T-2.6 provides the PodMonitor CRD. This is what exports
    # cnpg_collector_* -- including the archiving and backup-age series the
    # alerting rules depend on. Without it, the failure that took longest to
    # notice stays invisible.
    enablePodMonitor: true

    # These two are operator defaults, and they are declared rather than ignored
    # after ignoreDifferences turned out to be the wrong tool here.
    #
    # An ignoreDifferences on /spec/monitoring does NOT merely hide the diff. Argo
    # syncs when it detects drift, so a field it is told not to compare never
    # triggers a sync -- and therefore never gets applied. Setting
    # enablePodMonitor: true under an ignore left the Application reporting
    # Synced, on the right commit, with the live value still false and no
    # PodMonitor. Silent, and it looked correct from every direction.
    #
    # The cost of declaring them is that a future operator version renaming this
    # ConfigMap shows up as drift. That is visible and fixable; the alternative
    # was a change that never applied.
    customQueriesConfigMap:
      - key: queries
        name: cnpg-default-monitoring
    disableDefaultQueries: false
