# The Postgres cluster.
#
# Deliberately holds no schema and no domain tables. Flyway owns the schema from
# commit one (T-3.6), and the stemcell ships a database that is ready rather
# than a database that is populated.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: database
spec:
  # Two, on a cluster with two schedulable workers. One instance cannot fail
  # over, so the failover criterion of T-2.4 would be untestable and, worse,
  # would look fine right up until the node it was on rebooted.
  instances: 2

  storage:
    size: 10Gi
    storageClass: hcloud-volumes
    # The operator defaults this to true and writes it back into the spec. Set
    # explicitly so git and the cluster agree; otherwise Argo reports the
    # Cluster permanently OutOfSync against a field nobody changed.
    resizeInUseVolumes: true

  # No separate walStorage in dev. Splitting WAL onto its own volume is the
  # right production choice -- it stops a WAL burst from filling the data
  # volume and stalling writes -- but Hetzner volumes have a 10Gi minimum, so
  # it would double the volume count and cost for a database with no traffic.
  # Turn it on in staging and prod, where the failure it prevents is real.

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # The operator defaults this to true and writes it back INTO the array
      # element. Argo compares array items whole, so an operator-added field
      # inside one reads as drift even though every field we set matches.
      enabled: true
      # This is what makes continuous archiving happen at all. Without
      # isWALArchiver the plugin is loaded, base backups still work, and WAL is
      # never shipped -- so the cluster looks backed up and can only ever be
      # restored to the last base backup.
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-backups

        # The directory inside the bucket. Defaults to the Cluster's name, and
        # belongs HERE rather than on the ObjectStore -- the API refuses it
        # there, and says so plainly:
        #
        #   spec.configuration.serverName: Forbidden: use the 'serverName'
        #   plugin parameter in the Cluster resource
        #
        # Pinned because the default breaks on rebuild. barman refuses to
        # archive a NEW cluster into a path that already holds a different
        # cluster's history:
        #
        #   WAL archive check failed for server postgres: Expected empty archive
        #
        # That refusal is correct: interleaving WAL from two timelines under one
        # path corrupts the archive for both. But a cluster rebuilt per ADR-0002
        # comes back with a fresh identity while the old path is still
        # populated, so it starts Healthy and never archives again. Green
        # dashboards, no backups.
        #
        # Naming the generation gives each rebuild its own path and leaves every
        # earlier archive intact and restorable. BUMP THIS on a rebuild whose
        # database is not being recovered from the previous generation.
        #
        # INTERIM: #113 decides the real answer.
        serverName: postgres-g2

  affinity:
    # Keep the replica off the primary's node. Without this both instances can
    # land on one worker, and the second instance protects against a process
    # crash but not against losing the machine -- which is the failure that
    # actually happens.
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits:   {memory: 512Mi}

  postgresql:
    parameters:
      # Modest and explicit rather than tuned. Tuning belongs with the load
      # baseline in T-5.6, against measurements instead of guesses.
      max_connections: "100"
      shared_buffers: "128MB"

  bootstrap:
    initdb:
      database: app
      owner: app
      # Pinned rather than defaulted, and not only to stop Argo reporting drift.
      #
      # Collation is baked into every text index at creation. If the underlying
      # glibc changes its collation rules -- which it has, notably in glibc 2.28
      # -- indexes built under the old rules silently disagree with the new
      # ones, and queries return wrong results rather than errors. Locale C has
      # no such dependency: it sorts by byte value and never changes.
      #
      # The cost is that ORDER BY on text is ASCII order, not linguistic order.
      # Applications that need human-language sorting should ask for a collation
      # per column or per query, which is explicit and reviewable, rather than
      # inheriting one from whatever libc the base image happened to ship.
      encoding: UTF8
      localeCollate: C
      localeCType: C

  # No monitoring block. enablePodMonitor already defaults to false, and the
  # operator writes two further defaults into that stanza -- so declaring it
  # here would claim ownership of a field the operator keeps editing, and Argo
  # would report drift forever. T-2.6 adds it back deliberately, alongside the
  # ServiceMonitor CRD that makes it meaningful.
