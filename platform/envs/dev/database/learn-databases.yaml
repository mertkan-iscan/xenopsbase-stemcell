# The xenopsbase-learn services' databases.
#
# ONE DATABASE PER SERVICE, NOT ONE FOR ALL, AND NOT A SECOND CLUSTER.
#
# One each because learn's own rule says so: no module reads another module's
# schema, and the enforcement it names is credentials rather than convention.
# One database with five schemas would make that rule a review comment; five
# databases with five roles makes it something Postgres refuses.
#
# Inside THIS cluster because the isolation that matters -- one service unable
# to read or rewrite another's tables -- comes from separate roles and
# databases, not from separate Postgres clusters. It also keeps learn's data
# under the same WAL archive as everything else, so ADR-0002's durable-state
# boundary gains no new exception. A second cluster would be a second backup
# story, a second restore drill, and a second thing to forget.
#
# Prefixed `learn_` because this cluster already contains `core` and `keycloak`
# and will contain more. A database called `identity` would be ambiguous the
# first time anything else in the platform wants that word.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: learn-identity
  namespace: database
spec:
  cluster: {name: postgres}
  name: learn_identity
  owner: learn_identity
  # retain, not delete. Deleting this manifest -- or mistyping a path in git --
  # must not DROP DATABASE. Everything else here is recreated by reconciliation;
  # a dropped database is only recovered from backup.
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: learn-streaming
  namespace: database
spec:
  cluster: {name: postgres}
  name: learn_streaming
  owner: learn_streaming
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: learn-reporting
  namespace: database
spec:
  cluster: {name: postgres}
  name: learn_reporting
  owner: learn_reporting
  databaseReclaimPolicy: retain
---
# Catalog and assessment (xenopsbase-learn#143). Added when the gateway learned
# to route to them: both had been building, testing and publishing images for
# weeks against a database that did not exist, and nothing reported it because
# nothing had ever asked them to start.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: learn-catalog
  namespace: database
spec:
  cluster: {name: postgres}
  name: learn_catalog
  owner: learn_catalog
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: learn-assessment
  namespace: database
spec:
  cluster: {name: postgres}
  name: learn_assessment
  owner: learn_assessment
  databaseReclaimPolicy: retain
---
# Packaging (xenopsbase-learn#163). Uploaded SCORM, cmi5 and HTML5 courses: the
# archive's metadata, the extracted file inventory, and where each learner got
# to inside a package. The files themselves are in object storage; this holds
# the row that says which bucket key is which course.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: learn-packaging
  namespace: database
spec:
  cluster: {name: postgres}
  name: learn_packaging
  owner: learn_packaging
  databaseReclaimPolicy: retain
