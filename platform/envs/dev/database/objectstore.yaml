# Where base backups and the WAL archive go.
#
# This is the durable half of the database, in the sense of ADR-0002. The
# Postgres volumes are a working disk that dies with the cluster; THIS is the
# copy that has to survive, and it lives in a bucket Terraform never destroys.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pg-backups
  namespace: database
spec:
  configuration:
    destinationPath: s3://xenopsbase-dev-pg-backups/
    endpointURL: https://fsn1.your-objectstorage.com

    # The directory inside the bucket. Defaults to the Cluster's name, and is
    # pinned here because that default breaks on rebuild.
    #
    # barman refuses to archive a NEW cluster into a path that already holds a
    # different cluster's history:
    #
    #   WAL archive check failed for server postgres: Expected empty archive
    #
    # That refusal is correct -- interleaving WAL from two timelines under one
    # path corrupts the archive for both. But a cluster rebuilt per ADR-0002
    # comes back with a fresh identity and the old path still populated, so it
    # starts up Healthy and never archives again. Silent, and green.
    #
    # Naming the generation gives each rebuild its own path and keeps every
    # previous archive intact and restorable. BUMP THIS on a rebuild whose
    # database is not being recovered from the previous generation.
    #
    # INTERIM. #113 decides the real answer -- the candidates are recovering
    # from the archive on rebuild instead of initdb, or retiring old paths
    # deliberately. This is the option that unblocks archiving without deleting
    # a backup, which is the one thing that cannot be undone.
    serverName: postgres-g2

    s3Credentials:
      # The `db` key from the storage module, NOT the infra key. Its bucket
      # policy grants pg-backups and nothing else, so this credential leaking
      # does not expose uploaded documents or logs. Verified directly: the
      # observability key returns 403 on this bucket, which is what makes the
      # least-privilege claim evidence rather than intent.
      accessKeyId:
        name: pg-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: pg-backup-s3
        key: SECRET_ACCESS_KEY

    wal:
      # WAL is the recovery granularity: base backups set the floor, WAL is what
      # closes the gap between the last base backup and the moment of failure.
      compression: gzip
      # Hetzner object storage is a different datacentre from the nodes even in
      # the same city, so archiving is network-bound. Parallelism keeps
      # archive_command from becoming the bottleneck that stalls commits.
      maxParallel: 2

    data:
      compression: gzip
      jobs: 2

  # 30 days in dev. Deliberately finite: this bucket has NO lifecycle expiry
  # rule (see infra/lifecycle/), because expiring a WAL segment that a base
  # backup still depends on silently destroys recoverability for everything
  # after it. Barman understands that dependency; a bucket lifecycle rule does
  # not. Retention is therefore expressed here and only here.
  retentionPolicy: 30d
