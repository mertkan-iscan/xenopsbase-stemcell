# The gateway: the only public entry point to the application.
#
# It holds the browser session, performs the OIDC authorization-code flow
# against Keycloak, and relays the access token downstream (T-3.5). Core is
# reachable only through it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: apps
  labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: xenopsbase}
spec:
  # TWO, and this is the change the whole of T-2.11 was for.
  #
  # It was 1 because the session lived in the pod's heap, so a second replica
  # served requests that landed on the wrong one and signed people out at
  # random. With the session in Valkey the replicas are interchangeable, which
  # is what "stateless" has to mean before it means anything.
  #
  # THAT WAS HALF TRUE FOR A WHILE (T-3.19, #179). Moving the session did not
  # move the OAuth2 authorized client: Spring Boot keeps the access and refresh
  # tokens in a separate, in-memory store that the session's location says
  # nothing about. So the session replicated and the tokens did not, and the
  # pod that had not handled the login redirected every request it received --
  # page, stylesheet, XHR alike -- into a fresh Keycloak authorization request.
  # Fixed in the gateway, not here: SecurityConfiguration now binds the
  # authorized client to the WebSession, so it rides the same Valkey that made
  # this number 2 in the first place.
  #
  # Two is also what makes a rollout survivable: the old pod keeps serving while
  # the new one starts, instead of every logged-in user being dropped on every
  # deploy.
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: xenopsbase}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: ghcr.io/mertkan-iscan/xenopsbase-stemcell/gateway:main
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: prod}

            # The PUBLIC issuer, not a cluster-internal address. The login flow
            # redirects the user's BROWSER to Keycloak, and a browser cannot
            # resolve a .svc.cluster.local name. It must also match the issuer
            # Keycloak advertises, or token validation fails after a login that
            # otherwise appeared to work.
            - {name: OIDC_ISSUER_URI, value: https://auth-dev.xenopsoftware.com/realms/xenopsbase}
            - {name: OIDC_CLIENT_ID, value: gateway}
            - name: OIDC_CLIENT_SECRET
              # Key name differs from the env var on purpose: this is the same
              # secret the realm import consumes, mirrored into this namespace
              # rather than duplicated with a second value that could drift.
              valueFrom: {secretKeyRef: {name: gateway-oidc, key: GATEWAY_CLIENT_SECRET}}

            # The exact string Keycloak compares redirect_uri against, stated
            # rather than inferred.
            #
            # Spring otherwise builds it from the forwarded headers, and those
            # have been wrong twice on this path: once in the realm (the
            # registration id) and once at the edge (X-Forwarded-Port: 80
            # alongside X-Forwarded-Proto: https, giving https://host:80/...).
            # Keycloak matches this by exact string and answers 400 on any
            # difference, so it is the worst value in the system to derive from
            # a header an intermediary can get wrong.
            #
            # This does NOT replace the edge fix. It covers only this one URL;
            # logout and every other absolute URL the gateway builds still come
            # from the headers. See the request_headers ruleset in
            # infra/terraform/edge/main.tf.
            #
            # Relaxed binding, so no rebuild is needed to set it:
            # SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_REDIRECT_URI maps to
            # spring.security.oauth2.client.registration.oidc.redirect-uri.
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_REDIRECT_URI
              value: https://app-dev.xenopsoftware.com/login/oauth2/code/oidc

            # Traces to the Alloy collector, which batches and forwards to
            # Tempo (T-2.7). gRPC on 4317, which is the only receiver Alloy
            # declares; there is no HTTP receiver on 4318 to fall back to.
            #
            # Set here rather than defaulted in application.yml so that a
            # laptop with no collector exports nothing instead of retrying
            # against a closed port.
            - {name: OTLP_TRACING_ENDPOINT, value: "http://alloy.observability.svc.cluster.local:4317"}

            # Sessions in Valkey rather than in this pod's heap (ADR-0009).
            # Set explicitly rather than defaulted in application.yml, so what
            # runs in the cluster is visible here; the default is `none`, which
            # is an in-memory store and correct for a laptop with no Valkey.
            - {name: SESSION_STORE_TYPE, value: redis}
            - {name: VALKEY_HOST, value: valkey.cache.svc.cluster.local}
            - name: VALKEY_PASSWORD
              valueFrom: {secretKeyRef: {name: valkey-client, key: password}}

            - {name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED, value: "true"}
          startupProbe:
            httpGet: {path: /management/health, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /management/health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /management/health/liveness, port: http}
            periodSeconds: 20
          # SIZED FROM MEASUREMENT, NOT FROM A DEFAULT (T-2.15, #209).
          #
          # T-5.6 measured this pod: 0.006 cores idle, 1.99 cores under a 10-VU
          # hammer, 490 MiB peak working set. 568 req/s cost about 5.2 cores
          # across gateway and core together, so roughly 110 req/s per core.
          #
          # cpu 500m books each replica for ~55 req/s of capacity. Not the idle
          # figure, which would have the scheduler treat a serving pod as free,
          # and not the synthetic peak, which would reserve 4 of the cluster's 8
          # cores for pods that spend most of their life at 6 millicores.
          #
          # It also makes the HPA arithmetic in T-2.8 mean something: against a
          # 200m request the measured peak reads as 995% utilisation, so any
          # conventional target scales to maximum instantly.
          #
          # memory 640Mi because the request is what the SCHEDULER books, and
          # 512Mi was BELOW the 490 MiB this pod actually uses -- 4% of
          # headroom, so under node pressure it could be evicted while using
          # exactly what it legitimately needs.
          #
          # NO CPU LIMIT, deliberately. A CPU limit is enforced by CFS
          # throttling, which stalls a request mid-flight for the rest of the
          # period and shows up as tail latency rather than as a resource
          # event. Bursting into idle capacity is the better trade for a
          # latency-sensitive service; the memory limit stays, because memory
          # is not compressible and the failure mode is the node, not this pod.
          resources:
            requests: {cpu: 500m, memory: 640Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: apps
  labels: {app.kubernetes.io/name: gateway}
spec:
  selector: {app.kubernetes.io/name: gateway}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# app-dev.xenopsoftware.com terminates here.
#
# The tunnel delivers every hostname to the same ingress controller, which
# routes by Host header -- so this needs no load balancer and no second tunnel,
# exactly as Keycloak's ingress does.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: apps
  annotations:
    # Document uploads go straight to object storage from the browser, so the
    # bytes do not pass through here (T-3.7). This bound is for ordinary API
    # requests; leaving it at nginx's 1m default would still be enough, but a
    # stated limit is better than an inherited one.
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  rules:
    - host: app-dev.xenopsoftware.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
