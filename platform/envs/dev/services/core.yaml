# The core service: Spring Boot on Postgres, documents on object storage.
#
# Not exposed through the ingress. Everything public enters through the gateway,
# which is what holds the session and relays the token (T-3.5). A second public
# entry point straight to core would be an unauthenticated one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  namespace: apps
  labels: {app.kubernetes.io/name: core, app.kubernetes.io/part-of: xenopsbase}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: core}
  template:
    metadata:
      labels: {app.kubernetes.io/name: core, app.kubernetes.io/part-of: xenopsbase}
    spec:
      # -----------------------------------------------------------------------
      # KEEP CORE OFF THE NODE CARRYING THE OBSERVABILITY SINGLETONS (T-2.29)
      # -----------------------------------------------------------------------
      #
      # Prometheus, Tempo, Loki and Argo CD's application controller are
      # StatefulSet or singleton workloads that book 1024Mi, 768Mi, 768Mi and
      # 256Mi. They are effectively immovable: three of the four are bound to a
      # PVC, so once placed they stay. Whichever node draws them carries ~2.8GB
      # of platform before a single application pod lands.
      #
      # core is the largest MOBILE pod in the cluster at 832Mi, and nothing
      # stopped it landing on that node. On 2026-09-03 a routine image rollout
      # did exactly that, and worker-0 went from 919Mi schedulable to 87Mi --
      # the T-2.29 (#368) condition, back within a day of that card closing,
      # caused by nothing more exotic than a deploy. `make verify-headroom` is
      # what caught it.
      #
      # WHY PREFERRED, WHEN gateway.yaml ARGUES FOR required
      #
      # The opposite call, deliberately. gateway's rule is between replicas of
      # one Deployment: a fourth replica with nowhere to go SHOULD go Pending,
      # because Pending is what the autoscaler listens to and a doubled-up
      # replica measured 1.7x the CPU per request.
      #
      # This rule is against pods core does not own and cannot displace. At
      # floor core is a SINGLE replica, so `required` would mean that if the
      # singletons ever spread across both fixed workers -- one rescheduled PVC
      # is enough -- core would have no legal node and the application would be
      # down. A preference degrades to the scheduler's own packing, which is
      # what we have today. Availability of the application outranks the
      # placement it would prefer.
      #
      # THE `namespaces` KEY IS LOAD BEARING
      #
      # podAntiAffinity matches within the POD'S OWN namespace unless told
      # otherwise, and core is in `apps`. Without this list the selector would
      # match nothing, cost nothing, and report nothing -- a rule that looks
      # right in review and does not exist at runtime.
      #
      # The label values are third-party chart output and could drift on an
      # upgrade. That is why this is not the only guard: `make verify-headroom`
      # asserts the OUTCOME against the running cluster, so a selector that
      # silently stops matching is caught by the check that caught the original
      # imbalance.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                namespaces: [observability, argocd]
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [prometheus, tempo, loki, argocd-application-controller]
                topologyKey: kubernetes.io/hostname
      # No legacy Docker-link variables; see services/gateway.yaml for why
      # (T-2.17, #212). Not currently exposed, switched off as the default.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      # WAIT FOR THE OIDC ISSUER, RATHER THAN DYING ON IT (T-3.24, #279).
      #
      # Both services resolve the issuer's discovery document while Spring is
      # building beans, and a single HTTP GET with no retry decides whether the
      # context starts. On a cold rebuild the order is postgres -> keycloak ->
      # apps, and the apps lose that race every time.
      #
      # Losing it is not a delay, it is a crash: the context fails, the
      # container exits, and the kubelet backs off -- capped at five minutes. So
      # the applications stayed down long after Keycloak was healthy, and only a
      # manual `kubectl rollout restart` brought them back.
      #
      # This turns that crash into a wait. Same mechanism in both Deployments,
      # deliberately: the two fail in different beans and one fix reads better
      # than two.
      #
      #   core     JwtDecoders.fromOidcIssuerLocation, from SecurityConfiguration
      #   gateway  ClientRegistrations.fromIssuerLocation, from Boot's
      #            reactiveClientRegistrationRepository -- autoconfiguration, so
      #            the application's own code never runs and cannot be made lazy
      #            without hand-rolling issuer validation
      #
      # Reproduced rather than assumed: both jars, issuer pointed at a closed
      # port, both refuse to start. The gateway's stack is recorded on #279.
      #
      # WHY THIS DOES NOT TIME OUT
      #
      # It waits indefinitely and the pod sits in Init, which is the point --
      # exiting non-zero would restart the pod and rebuild the same
      # CrashLoopBackOff one layer up. What changes over time is the MESSAGE,
      # because a wait that reads the same at ten seconds and at ten hours is
      # the kind of control that gets ignored.
      initContainers:
        - name: wait-for-oidc
          # Pinned by digest, like every other off-the-shelf image here. Chosen
          # over the service's own image because eclipse-temurin, which jib
          # builds on, ships neither curl nor wget -- checked, not assumed.
          image: curlimages/curl@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13  # 8.21.0
          imagePullPolicy: IfNotPresent
          securityContext:
            # runAsUser is REQUIRED here, and its absence is what failed the
            # first cold-rebuild drill after T-3.24 landed:
            #
            #   Error: container has runAsNonRoot and image has non-numeric
            #   user (curl_user), cannot verify user is non-root
            #
            # The pod sets runAsNonRoot, so the kubelet has to PROVE the user is
            # not root before starting the container. curlimages/curl declares
            # `USER curl_user` by name, and the kubelet does not read the
            # image's /etc/passwd -- a name it cannot resolve is not proof, so
            # it refuses. Every pod sat in Init:CreateContainerConfigError, which
            # never resolves on its own.
            #
            # Checking `id` inside the image was the wrong check: it confirmed
            # the user is non-root, not that the image declares a NUMERIC uid,
            # which is the only thing runAsNonRoot can verify. 100:101 is
            # curl_user:curl_group from the image's own /etc/passwd.
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            # The same value the application container reads, from the same
            # ConfigMap. See oidc.yaml for why this is not a literal.
            - name: OIDC_ISSUER_URI
              valueFrom: {configMapKeyRef: {name: oidc, key: OIDC_ISSUER_URI}}
          command: [sh, -c]
          args:
            - |
              set -u
              url="${OIDC_ISSUER_URI}/.well-known/openid-configuration"

              # Not a timeout -- nothing is aborted when this elapses, the
              # wording just stops calling a ten-minute outage a cold start.
              # #289 measured a full rebuild-to-serving at 883s with Keycloak
              # well inside that, so anything past 600s is no longer the race
              # this container exists to absorb.
              patience=600

              start=$(date +%s)
              attempt=0
              echo "waiting for OIDC discovery before starting the application"
              echo "  $url"

              while :; do
                attempt=$((attempt + 1))
                # curl already prints 000 when the connection never completed,
                # so `|| echo 000` appended a SECOND one and the line read
                # 000000 -- while the explanation below talked about 000. Found
                # by running this script against a closed port.
                code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" 2>/dev/null || true)
                [ -n "$code" ] || code=000
                elapsed=$(( $(date +%s) - start ))

                if [ "$code" = "200" ]; then
                  echo "OIDC discovery answered 200 after ${elapsed}s and ${attempt} attempts — starting"
                  exit 0
                fi

                if [ "$elapsed" -lt "$patience" ]; then
                  echo "  ${elapsed}s: ${code} — still converging"
                elif [ -z "${explained:-}" ]; then
                  # Once, on the transition. Five lines every five seconds for
                  # as long as the outage lasts buries the one line that says
                  # something changed, which is the whole point of saying it.
                  explained=yes
                  echo "  ${elapsed}s: ${code} — NOT converging. Past ${patience}s this is more likely"
                  echo "    misconfiguration than a slow dependency:"
                  echo "      000  the connection never completed — DNS, the edge, or a"
                  echo "           certificate cert-manager has not issued"
                  echo "      404  the host answers but the realm path is wrong"
                  echo "    Check: kubectl -n keycloak get pods,ingress"
                else
                  echo "  ${elapsed}s: ${code} — still not converging"
                fi

                sleep 5
              done
          # Small and bounded. This container does nothing but sleep and issue
          # one request every five seconds, and it must not be what stops the
          # pod being scheduled during a cold rebuild.
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
      containers:
        - name: core
          # Pinned by digest at deploy time, not by a moving tag. See the
          # kustomization in this directory for how the value is set.
          image: ghcr.io/mertkan-iscan/xenopsbase-stemcell/core:main
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8081}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: prod}

            # Stated here rather than taken from application.yml's default.
            #
            # core is a RESOURCE SERVER: it never starts a login, it only
            # validates the tokens the gateway relays inward. The value still
            # has to be the PUBLIC issuer, because that is the string Keycloak
            # puts in every token's `iss` claim regardless of which host the
            # request arrived on.
            #
            # The default in application.yml points at dev, so it was correct
            # here and wrong in any other environment -- and the initContainer
            # above has to wait for the same URL this resolves, which a default
            # nothing else can see cannot guarantee.
            - name: OIDC_ISSUER_URI
              valueFrom: {configMapKeyRef: {name: oidc, key: OIDC_ISSUER_URI}}

            # Flyway runs at startup and the schema is validated against the
            # entities (T-3.6a), so a drifted image fails here rather than on
            # the first query that touches a missing column.
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-rw.database.svc.cluster.local:5432/core
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: core-db, key: username}}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: core-db, key: password}}

            # No default anywhere for these two, deliberately (T-3.7): a wrong
            # default writes documents into another environment's bucket and
            # nothing reports an error.
            - {name: DOCUMENTS_BUCKET, value: xenopsbase-dev-documents}
            - {name: DOCUMENTS_ENDPOINT, value: https://fsn1.your-objectstorage.com}

            # The AWS SDK reads these from the environment by its own default
            # provider chain, which is why they are named this way and not
            # mapped into application.yml.
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: documents-s3, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: documents-s3, key: AWS_SECRET_ACCESS_KEY}}
            - {name: AWS_REGION, value: fsn1}

            # Where the infrastructure usage view reads from (T-3.16). Read
            # only, and the endpoint that uses it is restricted to app-admin by
            # core's existing /api/admin/** rule.
            - {name: PROMETHEUS_URL, value: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090"}

            # Traces to the Alloy collector, which batches and forwards to
            # Tempo (T-2.7). gRPC on 4317, which is the only receiver Alloy
            # declares; there is no HTTP receiver on 4318 to fall back to.
            #
            # Set here rather than defaulted in application.yml so that a
            # laptop with no collector exports nothing instead of retrying
            # against a closed port.
            # The REAL property name, not a placeholder alias (T-2.16, #211).
            #
            # application-prod.yml used to carry `${OTLP_TRACING_ENDPOINT:}`,
            # whose empty default is a set value -- so the exporter was built
            # and rejected it, and the profile could not start anywhere this
            # variable was absent. Setting the property by its own name means an
            # absent variable leaves it absent, no exporter is registered, and
            # the service starts with tracing off rather than crash-looping.
            #
            # Relaxed binding: this maps to
            # management.opentelemetry.tracing.export.otlp.endpoint
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: "http://alloy.observability.svc.cluster.local:4317"

            # Set explicitly rather than relying on Spring Boot's Kubernetes
            # auto-detection. The detection works by looking for *_SERVICE_HOST
            # environment variables, so it is a heuristic -- and when it misses,
            # the probe paths below 404 and the pod never becomes ready, which
            # reads as an application failure.
            - {name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED, value: "true"}
          startupProbe:
            # Generous, because this is the probe that covers Flyway. A slow
            # migration is not a failure, but a liveness probe cannot tell the
            # difference -- so startupProbe holds the others off instead of
            # restarting a pod midway through a schema change.
            httpGet: {path: /management/health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /management/health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /management/health/liveness, port: http}
            periodSeconds: 20
          # SIZED FROM MEASUREMENT, NOT FROM A DEFAULT (T-2.15, #209).
          #
          # T-5.6 measured this pod: 0.005 cores idle, 1.72 cores under load,
          # 638 MiB peak working set. See gateway.yaml for the derivation --
          # about 110 req/s per core, and why the request is neither the idle
          # figure nor the synthetic peak.
          #
          # memory 832Mi against a 638 MiB observed peak. 768Mi left 17% of
          # headroom over something already measured, which is thin for a
          # number the scheduler treats as the whole truth.
          #
          # NO CPU LIMIT, deliberately -- CFS throttling stalls a request
          # mid-flight and surfaces as tail latency. The reasoning is written
          # out once, in gateway.yaml.
          #
          # cpu 700m, not 500m (T-5.12). Measured at 648m-658m per replica at
          # the 1200 req/s step and ~740m at the peak of the T-5.11 runs, so
          # 500m booked a pod for rather less than it uses and left the
          # scheduler treating a saturated node as half free. See the long note
          # in gateway.yaml for the mechanism and the evidence -- this is the
          # same change, at core's smaller measured draw.
          #
          # The HPA target in hpa.yaml is a percentage OF this number and has
          # been re-derived so the scale-out point does not move.
          resources:
            requests: {cpu: 700m, memory: 832Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            # readOnlyRootFilesystem is on, and the JVM still needs somewhere to
            # write. /tmp is used for multipart staging and JVM scratch files.
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: core
  namespace: apps
  labels: {app.kubernetes.io/name: core}
spec:
  # Named `core` on port 8081 because that is what the gateway's CORE_URI
  # defaults to. Renaming either without the other produces a 503 on a real
  # request rather than a startup failure.
  selector: {app.kubernetes.io/name: core}
  ports:
    - {name: http, port: 8081, targetPort: http}
