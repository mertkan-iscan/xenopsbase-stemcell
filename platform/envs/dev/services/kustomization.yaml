apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The two application services. Everything else under platform/ is off-the-shelf
# infrastructure; this is the part that is ours.
resources:
  - core.yaml
  - gateway.yaml

# Images are pinned here rather than in the Deployments, so a deploy is a
# one-line commit and `git log` on this file is the deployment history.
#
# The `main` tag in the Deployment is a placeholder that this overrides. A
# moving tag with imagePullPolicy: IfNotPresent is the worst combination
# available -- the node keeps whatever it cached, so two replicas can run
# different code and nothing reports a difference.
#
# By digest, not by tag. The paragraph above says the immutable reference is the
# digest and this file then used `main`, which was wrong twice over:
#
#  - `main` moves, and with imagePullPolicy: IfNotPresent a node keeps whatever
#    it cached, so two replicas can run different code and nothing reports it.
#  - it did not even exist. Jib logged "Built and pushed image as
#    .../gateway:f586e748..., .../gateway:main" and the gateway package came out
#    with only the SHA and `latest` tags, while core got all three from the
#    identical command. The kubelet's "not found" was the first sign.
#
# A digest cannot be absent, cannot move, and cannot disagree with what was
# tested. The commit SHA is recorded beside each one so a reader does not have
# to resolve the digest to know which build this is -- per image, because the
# two no longer move together.
images:
  - name: ghcr.io/mertkan-iscan/xenopsbase-stemcell/core
    # Commit 2381ff1 -- terminal .anyRequest() rule. No behaviour change today,
    # since every path core serves is named explicitly above it.
    digest: sha256:51572fef4bc4f06cdd8225c782156c3b2a98e639eb1d8d0d320fe17a402d4dee
  - name: ghcr.io/mertkan-iscan/xenopsbase-stemcell/gateway
    # Commit 16618a6 -- problem-detail `path` relative instead of an absolute
    # URL. Follows 2381ff1 (terminal .anyExchange() rule), 491c6e6 (drop
    # offline_access) and 065d2560 (drop `api`). All of it lives in the image,
    # so a digest bump is what deploys it; the realm halves reach the cluster by
    # a different route again (see docs/runbooks/authorization.md, "Applying a
    # realm change in dev").
    digest: sha256:9c0940005853cdf871cd9dbb60e546204182a9a19705980eed65a21e9d467300
