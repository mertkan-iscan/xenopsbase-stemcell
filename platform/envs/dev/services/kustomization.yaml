apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The two application services. Everything else under platform/ is off-the-shelf
# infrastructure; this is the part that is ours.
resources:
  - core.yaml
  - gateway.yaml
  # Without this nothing scrapes the applications, and the registry being on
  # in application-prod.yml produces an endpoint that answers into nowhere
  # (T-2.12).
  - servicemonitor.yaml
  # Autoscaling (T-2.8). Requires the Application to ignore /spec/replicas --
  # see platform/envs/dev/apps/services.yaml. Without that, Argo and the HPA
  # write the same field in a loop.
  - hpa.yaml

# Images are pinned here rather than in the Deployments, so a deploy is a
# one-line commit and `git log` on this file is the deployment history.
#
# The `main` tag in the Deployment is a placeholder that this overrides. A
# moving tag with imagePullPolicy: IfNotPresent is the worst combination
# available -- the node keeps whatever it cached, so two replicas can run
# different code and nothing reports a difference.
#
# By digest, not by tag. The paragraph above says the immutable reference is the
# digest and this file then used `main`, which was wrong twice over:
#
#  - `main` moves, and with imagePullPolicy: IfNotPresent a node keeps whatever
#    it cached, so two replicas can run different code and nothing reports it.
#  - it did not even exist. Jib logged "Built and pushed image as
#    .../gateway:f586e748..., .../gateway:main" and the gateway package came out
#    with only the SHA and `latest` tags, while core got all three from the
#    identical command. The kubelet's "not found" was the first sign.
#
# A digest cannot be absent, cannot move, and cannot disagree with what was
# tested. The commit SHA is recorded beside each one so a reader does not have
# to resolve the digest to know which build this is -- per image, because the
# two no longer move together.
images:
  - name: ghcr.io/mertkan-iscan/xenopsbase-stemcell/core
    # Commit e7acc9b -- the correlation id reaches spans, not just logs (T-3.8).
    # Carries 1c81e0d (infra usage endpoint with node placement, T-3.16).
    digest: sha256:6b4e1b13100454c413d9f6df8db105b00a4b8d0a60aed29809bcdaef665dd38e
  - name: ghcr.io/mertkan-iscan/xenopsbase-stemcell/gateway
    # Commit 2e44a9e -- a logged-in administrator finally holds the role they
    # were granted (T-3.20, #186). Two defects, either of which alone made
    # every hasAuthority rule on the session path refuse everyone: the
    # authorities were built from the UserInfo response, where Keycloak never
    # puts realm roles, and AuthoritiesConstants still named ROLE_ADMIN, which
    # no token this realm issues has ever contained. /api/admin/**,
    # /management/**, /v3/api-docs/** and health show-details were all dead.
    # Carries f7ef7d7 (tokens in the WebSession, T-3.19), which is what makes
    # `replicas: 2` in gateway.yaml true rather than intended,
    # 5efdc48 (asset requests are not navigation, T-3.18),
    # d861dbf (trusted-proxies reverted to '.*', T-3.15),
    # 1dbbfe5 (failed login restarts at /, T-3.17),
    # e7acc9b (correlation id on spans, T-3.8), 4ccd88f (sessions in Valkey,
    # T-2.11), 6d965b8 (CSP without 'unsafe-inline'/'unsafe-eval'), 806e8be
    # (logout origin from the request) and f430d36.
    digest: sha256:8f850bc98b03d25de7c16dd168964a295394eec0bd20129ce6a46610d7dd4563
