apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The two application services. Everything else under platform/ is off-the-shelf
# infrastructure; this is the part that is ours.
resources:
  # The issuer both Deployments read, and that both wait for before starting
  # (T-3.24). Listed first because nothing below starts without it.
  - oidc.yaml
  - core.yaml
  - gateway.yaml
  # Without this nothing scrapes the applications, and the registry being on
  # in application-prod.yml produces an endpoint that answers into nowhere
  # (T-2.12).
  - servicemonitor.yaml
  # Autoscaling (T-2.8). Requires the Application to ignore /spec/replicas --
  # see platform/envs/dev/apps/services.yaml. Without that, Argo and the HPA
  # write the same field in a loop.
  - hpa.yaml

# Images are pinned here rather than in the Deployments, so a deploy is a
# one-line commit and `git log` on this file is the deployment history.
#
# The `main` tag in the Deployment is a placeholder that this overrides. A
# moving tag with imagePullPolicy: IfNotPresent is the worst combination
# available -- the node keeps whatever it cached, so two replicas can run
# different code and nothing reports a difference.
#
# By digest, not by tag. The paragraph above says the immutable reference is the
# digest and this file then used `main`, which was wrong twice over:
#
#  - `main` moves, and with imagePullPolicy: IfNotPresent a node keeps whatever
#    it cached, so two replicas can run different code and nothing reports it.
#  - it did not even exist. Jib logged "Built and pushed image as
#    .../gateway:f586e748..., .../gateway:main" and the gateway package came out
#    with only the SHA and `latest` tags, while core got all three from the
#    identical command. The kubelet's "not found" was the first sign.
#
# A digest cannot be absent, cannot move, and cannot disagree with what was
# tested. The commit SHA is recorded beside each one so a reader does not have
# to resolve the digest to know which build this is -- per image, because the
# two no longer move together.
images:
  - name: ghcr.io/mertkan-iscan/xenopsbase-stemcell/core
    # Commit c805107 -- trace sampling drops from 1.0 to 0.1 (T-5.12, #307).
    #
    # The value it replaces carried its own warning: "everything, which is right
    # for dev and wrong for a busy production service -- overridden by
    # TRACING_SAMPLE_PROBABILITY rather than by editing this". Nothing ever
    # overrode it, and the prod profile is what dev runs.
    #
    # What that cost is not what T-5.10 looked for. It A/B-tested 1.0 against
    # 0.01, measured 4.85m vs 5.08m CPU per request INSIDE the services, and
    # correctly called that noise. It never measured the collectors: alloy drew
    # 993m-1197m against a 50m request and tempo ~1650m against 100m, while
    # being OOMKilled 16 times and never once reaching Ready. No span reached
    # storage during any run in T-5.10 or T-5.11.
    #
    # Carries e841ae1 (Hikari pool sized against the database, T-2.18, #259),
    # e7acc9b (correlation id on spans, T-3.8), 1c81e0d (infra usage endpoint,
    # T-3.16), and 1329471 (the RFC 9457 problem document is serialised rather
    # than string-formatted, T-5.12).
    #
    # Commit 51aa4dc -- tomcat-embed-core moves 11.0.24 -> 11.0.25 ahead of
    # Spring Boot, carrying the fix for three CRITICAL advisories the image scan
    # was failing on: CVE-2026-65182 (security constraint bypass), CVE-2026-65905
    # (authentication bypass) and CVE-2026-68525 (unauthorized access). Two of
    # the three are bypasses in the servlet container every request goes through,
    # so this is the reason the digest moves rather than a side effect (T-6.13,
    # #403).
    #
    # Commit 924c150 -- core caches document pages through Valkey (T-3.22, #264,
    # ADR-0011). Cache-aside on GET /api/documents only, keyed
    # xob:c:v1:document-list:<owner>:<page> so one user's page can never be
    # served to another, evicted after commit rather than inside the
    # transaction, every entry carrying a jittered TTL.
    #
    # Losing Valkey does not fail a request: reads fall through to Postgres and
    # an eviction that cannot run leaves a stale entry bounded by its TTL. That
    # is proven by DocumentCacheDegradationIT, which runs with the cache
    # switched ON and the server unreachable -- covering startup as well as
    # reads and writes.
    #
    # CACHE_ENABLED and CACHE_VALKEY_HOST in core.yaml are what turn it on, and
    # the host must be valkey-cache rather than valkey (T-2.19, #262).
    digest: sha256:ab87297e2b29d9acb75db64a55cf9f47f6ba787563a30c921919e09953ba4678
  - name: ghcr.io/mertkan-iscan/xenopsbase-stemcell/gateway
    # Commit c805107 -- the gateway can shed load without the circuit breaker
    # counting it as core failing, and the fallback stops telling the caller
    # something it cannot know (T-5.11, #307). Trace sampling drops to 0.1 here
    # too; see the note on core above for why that mattered more than the A/B
    # test suggested.
    #
    # The load-bearing line is `ignoreExceptions: BulkheadFullException`. The
    # runtime nests these as fallback(timeLimiter(circuitBreaker(bulkhead))), so
    # the breaker is OUTSIDE the bulkhead and every shed request lands inside its
    # window. Measured on this cluster across two runs: 109,195 and 337,679
    # rejections recorded, `failed` 0, `not_permitted` 0 -- the circuit never
    # opened once, against 133,931 short-circuits in the run before it.
    #
    # FallbackResource returned one fixed sentence for every reason it was
    # reached, including a TimeLimiter timeout where the request may well have
    # committed. "It had no effect" is the one part of that body a caller acts
    # on. It now derives the detail, the Retry-After and a gateway.fallback
    # counter from the actual cause.
    #
    # Carries 2e44a9e (a logged-in administrator finally holds the role they
    # were granted, T-3.20, #186), f7ef7d7 (tokens in the WebSession, T-3.19),
    # 5efdc48 (asset requests are not navigation, T-3.18), d861dbf
    # (trusted-proxies reverted to '.*', T-3.15), 1dbbfe5 (failed login restarts
    # at /, T-3.17), e7acc9b (correlation id on spans, T-3.8), 4ccd88f (sessions
    # in Valkey, T-2.11), 6d965b8 (CSP without 'unsafe-inline'/'unsafe-eval'),
    # 806e8be (logout origin from the request) and f430d36.
    #
    # Commit a6d8c33 -- per-client rate limiting on every proxied route
    # (T-8.3, #61). 20/s sustained, 60 burst, keyed on the Keycloak `sub` and
    # falling back to the client address, counted in Valkey so the limit is the
    # limit rather than limit x replicas.
    #
    # Deployed to run `make load-ratelimit` against it, which is #61's third
    # criterion and cannot be satisfied from a branch: the scenario needs the
    # filter actually in the request path. It fails OPEN -- `deny-empty-key` is
    # false, so a client the resolver cannot identify is served rather than
    # rejected -- and the ceiling is far above real use, so the expected effect
    # on normal traffic is none at all.
    #
    # Commit 7877620 -- the load baseline stopped measuring the rate limiter
    # (T-5.13, #371). The limiter is unchanged for every real caller; what is new
    # is that holders of the app-loadtest realm role are exempt, and only the dev
    # realm issues that role.
    #
    # Deployed to satisfy #371's third criterion, which asks for a run that
    # reaches core verified against core's own metrics rather than k6's view.
    # That cannot be checked from a branch.
    #
    # Commit 51aa4dc -- tomcat-embed-core moves 11.0.24 -> 11.0.25 ahead of
    # Spring Boot, carrying the fix for three CRITICAL advisories the image scan
    # was failing on: CVE-2026-65182 (security constraint bypass), CVE-2026-65905
    # (authentication bypass) and CVE-2026-68525 (unauthorized access). Two of
    # the three are bypasses in the servlet container every request goes through,
    # so this is the reason the digest moves rather than a side effect (T-6.13,
    # #403).
    digest: sha256:a11dd0a68154bae1118baf72bb8ccf4635fb5a78e3533ea76a94bb7389baffe3
