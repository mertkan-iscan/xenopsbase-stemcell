apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Child Applications and platform manifests for dev.
#
# Terraform knows only about the root Application that points here. Adding a
# component is a commit to this file, not an infrastructure change -- which is
# the whole point of the app-of-apps arrangement (ADR-0004).
resources:
  - namespaces.yaml
  # A request floor for the namespaces whose manifests this repository does
  # not write -- kured and system-upgrade-controller come from the kube-hetzner
  # module and expose no values (T-2.25).
  - limits.yaml
  # Wave 0/1. The admission controller and the policy it enforces (T-6.2, #49).
  # Listed here for the reason the comment above gives: a file in apps/ that is
  # not in this list is rendered by nothing and applied by nobody, and Argo
  # reports Synced because from its side nothing changed.
  - apps/policy-controller.yaml
  - apps/image-policy.yaml
  - apps/ingress-nginx.yaml
  - apps/cert-manager.yaml
  - apps/cloudflared.yaml
  - apps/cloudnative-pg.yaml
  - apps/barman-cloud-plugin.yaml
  - apps/postgres.yaml
  - apps/valkey.yaml
  - apps/keycloak-operator.yaml
  - apps/keycloak.yaml
  - apps/kube-prometheus-stack.yaml
  - apps/observability-config.yaml
  - apps/loki.yaml
  - apps/alloy.yaml
  - apps/services.yaml
  - issuers/letsencrypt.yaml

  # Argo CD installs itself from Terraform, but its ingress is an ordinary
  # object and belongs with everything else that is reconciled from git.
  - argocd/ingress.yaml

  # Decrypted by ksops at render time inside argocd-repo-server (ADR-0003).
  # Nothing here is committed in plaintext and nothing is stored decrypted.
  - secrets
